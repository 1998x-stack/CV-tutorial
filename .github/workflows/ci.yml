name: Validate static tutorial
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify structure, local references, source SVG and build output
        run: |
          python3 scripts/check_site.py
          python3 scripts/build_pages.py
          test -f _site/index.html
          test -f _site/01.html
          test -f _site/chapters/28.html
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute original 06–10 article code blocks
        run: python3 tests/test_cv_examples.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Audit home and chapters 06–10 at desktop and mobile widths
        run: python3 scripts/check_browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-browser-qa
          path: reports/browser/
          if-no-files-found: warn
