<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">视觉任务输出与评价协议</title><desc id="desc">分类比较图像级类别，检测需要匹配类别与边界框，分割需要比较像素集合；指标依赖不同的匹配协议。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338" text-anchor="start">先确定输出对象，再选择评价指标</text>
<rect x="35" y="104" width="220" height="218" rx="10" fill="#e6f2ed" stroke="#087b7c" stroke-width="2"/><text x="145" y="144" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="middle">分类</text><text x="145" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="middle">类别分数</text><text x="145" y="265" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#087b7c" text-anchor="middle">Top-1 / Top-5</text><rect x="285" y="104" width="220" height="218" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="395" y="144" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="middle">检测</text><text x="395" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="middle">类别 + 边界框</text><text x="395" y="265" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#c46b45" text-anchor="middle">IoU 匹配 / AP</text><rect x="535" y="104" width="220" height="218" rx="10" fill="#ebe7f5" stroke="#7560b5" stroke-width="2"/><text x="645" y="144" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="middle">分割</text><text x="645" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="middle">像素类别掩码</text><text x="645" y="265" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#7560b5" text-anchor="middle">per-class IoU / mIoU</text>
<text x="30" y="382" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="start">不同任务的 AP、accuracy 与 IoU 不能脱离数据划分和阈值协议直接比较。</text></svg>