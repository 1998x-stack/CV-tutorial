<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">HWC 图像张量与像素索引</title><desc id="desc">二维空间坐标 y、x 选中一个像素，最后一个通道轴保存 RGB 三个分量；数组索引按 image[y,x,channel]。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338" text-anchor="start">一张 RGB 图像在内存中是什么形状？</text>
<text x="48" y="94" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#087b7c" text-anchor="start">H × W × 3</text>
<text x="48" y="125" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="start">行 y</text><text x="170" y="125" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="start">列 x</text>
<rect x="55" y="145" width="86" height="60" rx="5" fill="#e3f0ea" stroke="#9ebdb2" stroke-width="2"/><text x="98" y="182" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[0,0]</text><rect x="155" y="145" width="86" height="60" rx="5" fill="#e3f0ea" stroke="#9ebdb2" stroke-width="2"/><text x="198" y="182" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[0,1]</text><rect x="55" y="219" width="86" height="60" rx="5" fill="#e3f0ea" stroke="#9ebdb2" stroke-width="2"/><text x="98" y="256" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[1,0]</text><rect x="155" y="219" width="86" height="60" rx="5" fill="#f3d8c4" stroke="#9ebdb2" stroke-width="2"/><text x="198" y="256" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[1,1]</text><rect x="55" y="293" width="86" height="60" rx="5" fill="#e3f0ea" stroke="#9ebdb2" stroke-width="2"/><text x="98" y="330" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[2,0]</text><rect x="155" y="293" width="86" height="60" rx="5" fill="#e3f0ea" stroke="#9ebdb2" stroke-width="2"/><text x="198" y="330" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[2,1]</text>
<rect x="345" y="150" width="180" height="170" rx="10" fill="#f5f8f6" stroke="#b7c9c2" stroke-width="2"/>
<text x="435" y="184" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">image[y, x, :]</text>
<rect x="370" y="202" width="130" height="29" rx="5" fill="#f6dfd8" stroke="#9ebdb2" stroke-width="2"/><text x="435" y="223" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">R = 255</text><rect x="370" y="240" width="130" height="29" rx="5" fill="#e6f0dc" stroke="#9ebdb2" stroke-width="2"/><text x="435" y="261" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">G = 128</text><rect x="370" y="278" width="130" height="29" rx="5" fill="#dce9f2" stroke="#9ebdb2" stroke-width="2"/><text x="435" y="299" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">B = 32</text>
<path d="M265 253 L337 253 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="575" y="172" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087b7c" text-anchor="start">张量约定</text>
<text x="575" y="210" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="start">H：行数</text><text x="575" y="240" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="start">W：列数</text><text x="575" y="270" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="start">C：颜色通道</text>
