<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">同一图像的三种视觉任务</title><desc id="d">分类预测全图类别，检测在图像内标出每个物体的边界框，语义分割为每个像素标注类别。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="28" y="41" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">一张输入图像 · 三种不同粒度的输出</text><g font-family="Arial,sans-serif" font-size="19" fill="#243338" text-anchor="middle"><text x="90" y="91">原图</text><text x="300" y="91">分类</text><text x="512" y="91">目标检测</text><text x="698" y="91">语义分割</text></g><g><rect x="20" y="116" width="145" height="184" rx="10" fill="#dcece1"/><path d="M20 237Q70 159 165 225V300H20Z" fill="#95bda8"/><circle cx="65" cy="180" r="27" fill="#c46b45"/><rect x="103" y="202" width="43" height="66" rx="9" fill="#7461ba"/><rect x="228" y="126" width="148" height="163" rx="10" fill="#ecf5f2" stroke="#087b7c" stroke-width="2"/><rect x="436" y="116" width="149" height="184" rx="10" fill="#dcece1"/><circle cx="478" cy="180" r="27" fill="#c46b45"/><rect x="529" y="202" width="43" height="66" rx="9" fill="#7461ba"/><rect x="449" y="141" width="58" height="74" fill="none" stroke="#c46b45" stroke-width="3"/><rect x="518" y="194" width="66" height="86" fill="none" stroke="#7461ba" stroke-width="3"/><rect x="634" y="116" width="143" height="184" rx="10" fill="#95bda8"/><path d="M635 116h141v93l-49 12-40-36-52 35Z" fill="#dcece1"/><circle cx="680" cy="180" r="27" fill="#c46b45"/><rect x="722" y="202" width="43" height="66" rx="9" fill="#7461ba"/></g><g font-size="18" font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><text x="303" y="188">一组类别分数</text><text x="510" y="325">类别 + 边界框</text><text x="700" y="325">像素 → 类别</text></g><g stroke="#087b7c" stroke-width="3" fill="none"><path d="M174 205h40l-9-8m9 8-9 8M386 205h38l-9-8m9 8-9 8M595 205h27l-9-8m9 8-9 8"/></g><text x="27" y="383" font-size="16" font-family="Arial,sans-serif" fill="#53676d">语义分割并不自动区分同类的不同实例；实例分割才需要实例身份。</text></svg>