<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">计算机视觉研究代表性里程碑</title><desc id="d">早期几何方法、SIFT、ImageNet、AlexNet 与 ViT 五个代表节点按先后展示，但不暗示方法互相取代。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="32" y="48" font-size="24" font-family="Arial,sans-serif" font-weight="700" fill="#243338">数据、先验与学习方式的演进</text><path d="M56 213H748" stroke="#a4b9b3" stroke-width="5"/><g fill="#087b7c"><circle cx="100" cy="213" r="13"/><circle cx="255" cy="213" r="13"/><circle cx="409" cy="213" r="13"/><circle cx="561" cy="213" r="13"/><circle cx="711" cy="213" r="13"/></g><g font-size="18" font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><text x="100" y="173">几何方法</text><text x="255" y="173">SIFT</text><text x="409" y="173">ImageNet</text><text x="561" y="173">AlexNet</text><text x="711" y="173">ViT</text></g><g font-size="16" font-family="Arial,sans-serif" fill="#53676d" text-anchor="middle"><text x="100" y="248">早期研究</text><text x="255" y="248">2004</text><text x="409" y="248">2009</text><text x="561" y="248">2012</text><text x="711" y="248">2020</text></g><text x="40" y="326" font-family="Arial,sans-serif" font-size="17" fill="#53676d">年份标记代表性论文或预印本；经典几何与特征方法仍有现实用途。</text></svg>