<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">OpenCV BGR 通道到灰度强度</title><desc id="desc">OpenCV 默认彩色读取顺序是 BGR；BGR2GRAY 使用加权亮度转换，不能把 BGR 三元组误当 RGB。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338" text-anchor="start">颜色数组不是“红、绿、蓝”自动排好的</text>
<text x="65" y="112" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#087b7c" text-anchor="start">OpenCV BGR</text>
<rect x="60" y="145" width="68" height="70" rx="7" fill="#4b83b8" stroke="#4b83b8" stroke-width="2"/><text x="94" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">B</text><text x="94" y="243" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">0</text><rect x="145" y="145" width="68" height="70" rx="7" fill="#54a16b" stroke="#54a16b" stroke-width="2"/><text x="179" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">G</text><text x="179" y="243" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">200</text><rect x="230" y="145" width="68" height="70" rx="7" fill="#cf6252" stroke="#cf6252" stroke-width="2"/><text x="264" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">R</text><text x="264" y="243" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">255</text>
<path d="M330 182 L415 182 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="440" y="137" width="140" height="105" rx="8" fill="#e9e9e9" stroke="#89979a" stroke-width="2"/><text x="510" y="180" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#243338" text-anchor="middle">Y′</text><text x="510" y="218" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="middle">灰度</text>
<path d="M588 182 L645 182 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="162" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087b7c" text-anchor="middle">单通道</text><text x="664" y="193" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="middle">H × W</text>
<text x="40" y="310" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#c46b45" text-anchor="start">Y′ ≈ 0.114 B + 0.587 G + 0.299 R</text>
<text x="40" y="372" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">系数作用于常见 gamma 编码的 RGB/BGR 数值；不是直接的线性物理辐亮度。</text></svg>