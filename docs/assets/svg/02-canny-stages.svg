<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Canny 边缘检测的计算步骤</title><desc id="d">灰度化、平滑、梯度估计、非极大值抑制、双阈值与滞后连接按照依赖先后组成流程。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="26" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">Canny 不是单次卷积：它是一条选择边缘的流水线</text><rect x="24" y="119" width="139" height="115" rx="10" fill="#e2f2ed" stroke="#087b7c"/><text x="93" y="182" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#243338">灰度图</text><rect x="177" y="119" width="139" height="115" rx="10" fill="#f8ede4" stroke="#c46b45"/><text x="246" y="182" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#243338">高斯平滑</text><rect x="330" y="119" width="139" height="115" rx="10" fill="#e2f2ed" stroke="#087b7c"/><text x="399" y="182" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#243338">梯度强度</text><rect x="483" y="119" width="139" height="115" rx="10" fill="#f8ede4" stroke="#c46b45"/><text x="552" y="182" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" font-weight="700" fill="#243338">非极大值抑制</text><rect x="636" y="119" width="139" height="115" rx="10" fill="#e2f2ed" stroke="#087b7c"/><text x="705" y="182" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#243338">双阈值连接</text><g stroke="#53676d" stroke-width="2.5" fill="none"><path d="M163 177h14m-7-7 7 7-7 7"/><path d="M316 177h14m-7-7 7 7-7 7"/><path d="M469 177h14m-7-7 7 7-7 7"/><path d="M622 177h14m-7-7 7 7-7 7"/></g><g font-size="17" font-family="Arial,sans-serif" fill="#53676d"><text x="27" y="305">平滑降低噪声；梯度提供方向；非极大值抑制让轮廓变细。</text><text x="27" y="341">弱响应只有与强边缘相连时才可能被保留。</text></g></svg>