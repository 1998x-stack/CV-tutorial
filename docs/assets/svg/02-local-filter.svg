<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">局部均值滤波的数值演算</title><desc id="d">三乘三矩阵包含数字一到九，九个数在权重均为九分之一时产生输出五。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="28" y="47" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#243338">3×3 局部窗口 = 9 次乘法 + 求和</text><g font-family="Arial,sans-serif" font-size="23" fill="#243338" text-anchor="middle"><rect x="70" y="105" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="105" y="149">1</text><rect x="148" y="105" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="183" y="149">2</text><rect x="226" y="105" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="261" y="149">3</text><rect x="70" y="183" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="105" y="227">4</text><rect x="148" y="183" width="70" height="70" rx="5" fill="#e9c4a6" stroke="#9ebdb2"/><text x="183" y="227">5</text><rect x="226" y="183" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="261" y="227">6</text><rect x="70" y="261" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="105" y="305">7</text><rect x="148" y="261" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="183" y="305">8</text><rect x="226" y="261" width="70" height="70" rx="5" fill="#e0f0e9" stroke="#9ebdb2"/><text x="261" y="305">9</text></g><path d="M314 218h90m-14-10 14 10-14 10" fill="none" stroke="#087b7c" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#243338"><text x="422" y="134" font-size="20">九个权重：1/9</text><text x="422" y="180" font-size="20">(1 + 2 + … + 9) / 9</text><rect x="432" y="214" width="104" height="72" rx="12" fill="#e3f2ed" stroke="#087b7c" stroke-width="2"/><text x="484" y="261" text-anchor="middle" font-size="31" font-weight="700">5</text><text x="422" y="334" font-size="17" fill="#53676d">向右移一列，再计算下一个位置。</text></g></svg>