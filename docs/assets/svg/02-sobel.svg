<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Sobel 水平与垂直梯度</title><desc id="desc">Sobel 用两个方向的离散差分近似灰度图的空间导数，梯度方向垂直于局部边缘。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338" text-anchor="start">同一个像素邻域，计算两个方向的变化</text>
<text x="70" y="103" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087b7c" text-anchor="start">灰度邻域</text>
<rect x="60" y="125" width="48" height="48" rx="4" fill="#e4eee9" stroke="#a9bdb5" stroke-width="2"/><text x="84" y="156" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">20</text><rect x="115" y="125" width="48" height="48" rx="4" fill="#f7f7f2" stroke="#a9bdb5" stroke-width="2"/><text x="139" y="156" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">20</text><rect x="170" y="125" width="48" height="48" rx="4" fill="#f2d9c8" stroke="#a9bdb5" stroke-width="2"/><text x="194" y="156" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">220</text><rect x="60" y="180" width="48" height="48" rx="4" fill="#e4eee9" stroke="#a9bdb5" stroke-width="2"/><text x="84" y="211" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">20</text><rect x="115" y="180" width="48" height="48" rx="4" fill="#f7f7f2" stroke="#a9bdb5" stroke-width="2"/><text x="139" y="211" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">20</text><rect x="170" y="180" width="48" height="48" rx="4" fill="#f2d9c8" stroke="#a9bdb5" stroke-width="2"/><text x="194" y="211" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">220</text><rect x="60" y="235" width="48" height="48" rx="4" fill="#e4eee9" stroke="#a9bdb5" stroke-width="2"/><text x="84" y="266" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">20</text><rect x="115" y="235" width="48" height="48" rx="4" fill="#f7f7f2" stroke="#a9bdb5" stroke-width="2"/><text x="139" y="266" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">20</text><rect x="170" y="235" width="48" height="48" rx="4" fill="#f2d9c8" stroke="#a9bdb5" stroke-width="2"/><text x="194" y="266" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">220</text>
<path d="M250 205 L305 205 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="325" y="115" width="185" height="105" rx="10" fill="#e6f2ed" stroke="#087b7c" stroke-width="2"/>
<text x="417" y="151" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087b7c" text-anchor="middle">Gx：左右差分</text><text x="417" y="188" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[-1 0 1] 方向</text>
<rect x="325" y="244" width="185" height="105" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/>
<text x="417" y="280" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c46b45" text-anchor="middle">Gy：上下差分</text><text x="417" y="317" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">[-1 0 1] 方向</text>
<path d="M516 170 L575 170 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M516 297 L575 297 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="594" y="152" width="168" height="164" rx="10" fill="#f2eef9" stroke="#7560b5" stroke-width="2"/>
<text x="678" y="194" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#7560b5" text-anchor="middle">幅值</text><text x="678" y="232" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="middle">√(Gx²+Gy²)</text><text x="678" y="274" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="middle">方向 atan2</text>
<text x="30" y="390" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">Sobel 输出是梯度响应；Canny 还要做非极大值抑制和滞后阈值连接。</text></svg>