<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">HOG 的局部梯度统计与归一化</title><desc id="d">从像素梯度到每个 cell 的方向直方图，再将相邻多个 cell 组成 block 并归一化；给出两乘二 cell、每 cell 九方向桶的 36 维示例。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="30" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">HOG：方向分布，比原始像素更稳定</text><g stroke="#9db8ae" stroke-width="1.5" fill="#eaf5f0"><rect x="45" y="107" width="232" height="232" rx="6"/><path d="M161 107v232M45 223h232"/></g><g stroke="#087b7c" stroke-width="5"><path d="M72 195l61-57M182 139l62 62M75 258l60 59M185 307l55-59"/></g><g font-family="Arial,sans-serif" fill="#243338"><text x="54" y="91" font-size="18">2×2 cells</text><text x="344" y="91" font-size="18">每个 cell：9-bin 直方图</text></g><g fill="#c46b45"><rect x="344" y="216" width="23" height="14" rx="3"/><rect x="375" y="193" width="23" height="37" rx="3"/><rect x="406" y="166" width="23" height="64" rx="3"/><rect x="437" y="139" width="23" height="91" rx="3"/><rect x="468" y="177" width="23" height="53" rx="3"/><rect x="499" y="197" width="23" height="33" rx="3"/><rect x="530" y="209" width="23" height="21" rx="3"/><rect x="561" y="190" width="23" height="40" rx="3"/><rect x="592" y="172" width="23" height="58" rx="3"/></g><path d="M285 211h45l-10-9m10 9-10 9" fill="none" stroke="#087b7c" stroke-width="3"/><path d="M624 211h40l-10-9m10 9-10 9" fill="none" stroke="#087b7c" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#243338"><rect x="676" y="149" width="99" height="119" rx="9" fill="#e4f0ef" stroke="#087b7c"/><text x="726" y="190" text-anchor="middle" font-size="19" font-weight="700">L2</text><text x="726" y="224" text-anchor="middle" font-size="18">36 维</text><text x="345" y="279" font-size="15" fill="#53676d">示意单个 cell；实际每个 cell 都统计方向</text><text x="42" y="379" font-size="16" fill="#53676d">重叠 block 将相邻 cell 直方图归一化，再串接为最终特征。</text></g></svg>