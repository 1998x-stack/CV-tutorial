<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">HOG 从梯度到窗口描述子的计算流程</title><desc id="desc">HOG 对像素梯度幅值按方向投票到 cell 直方图，再对重叠 block 做 L2-Hys 等归一化，最后拼接整个检测窗口。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="start">HOG 不是一个 9 维直方图，而是多个 block 的拼接</text>
<rect x="25" y="143" width="132" height="126" rx="10" fill="#e4f1ec" stroke="#087b7c" stroke-width="2"/><text x="91" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">像素梯度</text><text x="91" y="226" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">gx, gy</text><path d="M159 206 L177 206 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="143" width="132" height="126" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="246" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">Cell</text><text x="246" y="226" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">9-bin</text><path d="M314 206 L332 206 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="143" width="132" height="126" rx="10" fill="#ebe7f5" stroke="#7560b5" stroke-width="2"/><text x="401" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">Block</text><text x="401" y="226" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">2×2 cells</text><path d="M469 206 L487 206 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="143" width="132" height="126" rx="10" fill="#e4f1ec" stroke="#087b7c" stroke-width="2"/><text x="556" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">归一化</text><text x="556" y="226" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">L2-Hys</text><path d="M624 206 L642 206 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="645" y="143" width="132" height="126" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="711" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">窗口向量</text><text x="711" y="226" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">concat</text>
<text x="35" y="327" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#087b7c" text-anchor="start">单个 block</text><text x="35" y="359" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243338" text-anchor="start">2 × 2 cells × 9 bins = 36 维</text>
<text x="410" y="327" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#c46b45" text-anchor="start">整窗特征</text><text x="410" y="359" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243338" text-anchor="start">多个重叠 block 向量依序串接</text>
<text x="30" y="395" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">方向投票通常按梯度幅值加权；具体插值与归一化细节取决于实现配置。</text></svg>