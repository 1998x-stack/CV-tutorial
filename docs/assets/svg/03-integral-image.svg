<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">积分图四角公式计算矩形和</title><desc id="desc">积分图 IΣ(x,y) 存储从左上角到当前位置的前缀和；闭区间矩形和由右下、左下、右上和左上四个角值组合。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
