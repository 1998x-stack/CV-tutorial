<circle cx="150" cy="220" r="7" fill="#c46b45"/>
<path d="M150 220 L225 153" stroke="#c46b45" stroke-width="5"/><path d="M211 153 L225 153 L223 168" fill="none" stroke="#c46b45" stroke-width="4"/>
