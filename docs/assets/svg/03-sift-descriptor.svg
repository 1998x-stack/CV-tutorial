<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">SIFT 关键点方向与 128 维描述子</title><desc id="desc">关键点邻域先按主方向对齐，再将 4×4 个空间子区的 8 个方向桶串接成 128 维描述子。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
