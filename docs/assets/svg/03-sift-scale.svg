<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">SIFT 尺度空间关键点的选取流程</title><desc id="d">同一幅图像经过逐尺度高斯模糊，相邻尺度相减得到 DoG，再寻找空间及尺度邻域的极值，筛选关键点并分配方向。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="26" y="44" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">SIFT：不只寻找角点，还在尺度维度寻找极值</text><g font-family="Arial,sans-serif" font-size="18" fill="#243338"><text x="33" y="108">高斯尺度空间</text><text x="345" y="108">相邻尺度做差</text><text x="575" y="108">关键点定位</text></g><g fill="#e2f0eb" stroke="#087b7c" stroke-width="2"><rect x="54" y="131" width="140" height="82" rx="8"/><rect x="76" y="158" width="140" height="82" rx="8" opacity=".76"/><rect x="98" y="185" width="140" height="82" rx="8" opacity=".58"/></g><g fill="none" stroke="#c46b45" stroke-width="3"><path d="M280 196h53m-9-9 9 9-9 9"/></g><g fill="#f4e6da" stroke="#c46b45" stroke-width="2"><rect x="355" y="140" width="130" height="89" rx="8"/><rect x="372" y="158" width="130" height="89" rx="8"/></g><g fill="none" stroke="#087b7c" stroke-width="3"><path d="M523 196h36m-9-9 9 9-9 9"/></g><g fill="#e5f3ef" stroke="#087b7c" stroke-width="2"><rect x="585" y="145" width="174" height="114" rx="8"/></g><g fill="#c46b45"><circle cx="635" cy="181" r="9"/><circle cx="685" cy="220" r="9"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#53676d"><text x="50" y="317">不同 σ 产生不同模糊尺度</text><text x="338" y="317">DoG 近似尺度归一化 LoG</text><text x="572" y="317">空间 + 尺度邻域极值</text><text x="30" y="368">后续还需定位精炼、低对比度与边缘响应过滤、方向分配以及 128 维描述。</text></g></svg>