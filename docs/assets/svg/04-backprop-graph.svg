<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">单神经元的前向计算与反向梯度</title><desc id="d">前向输入x为2权重w为0.5，乘法结果z为1，ReLU输出a为1，平方损失L为0.5；反向dw为2。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="28" y="46" font-family="Arial,sans-serif" font-size="23" fill="#243338" font-weight="700">同一个计算图，前向得值，反向得导数</text><g font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><rect x="38" y="117" width="136" height="110" rx="12" fill="#e2f1ea" stroke="#087b7c"/><text x="106" y="155" font-size="18">x=2</text><text x="106" y="190" font-size="18">w=0.5</text><rect x="220" y="117" width="129" height="110" rx="12" fill="#f7e8dd" stroke="#c46b45"/><text x="284" y="159" font-size="18">z=wx+b</text><text x="284" y="193" font-size="18">=1</text><rect x="402" y="117" width="134" height="110" rx="12" fill="#f7e8dd" stroke="#c46b45"/><text x="469" y="159" font-size="18">ReLU(z)</text><text x="469" y="193" font-size="18">a=1</text><rect x="589" y="117" width="172" height="110" rx="12" fill="#e5e0f4" stroke="#7461ba"/><text x="675" y="158" font-size="18">L=(a−t)²/2</text><text x="675" y="193" font-size="18">t=0, L=0.5</text></g><g stroke="#087b7c" stroke-width="3" fill="none"><path d="M175 169h44m-10-8 10 8-10 8M350 169h51m-10-8 10 8-10 8M537 169h51m-10-8 10 8-10 8"/></g><g stroke="#c46b45" stroke-width="3" fill="none"><path d="M672 270H106m10-8-10 8 10 8"/></g><g font-family="Arial,sans-serif" font-size="17" fill="#c46b45"><text x="105" y="306">dL/dw=2</text><text x="259" y="306">dL/dz=1</text><text x="439" y="306">dL/da=1</text><text x="613" y="306">dL/dL=1</text></g><text x="34" y="378" font-family="Arial,sans-serif" font-size="16" fill="#53676d">反向传递的是损失对节点的梯度；在共享变量的汇合处，应累加多个分支的梯度。</text></svg>