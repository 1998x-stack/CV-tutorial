<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">反向传播的链式法则与梯度累积</title><desc id="desc">前向图从输入和权重计算 z、激活 a 与损失；反向梯度沿依赖逆向传播，共享节点的各条路径贡献相加。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338" text-anchor="start">反向传播：局部导数相乘，共享分支相加</text>
<rect x="28" y="140" width="155" height="100" rx="10" fill="#e4f1ec" stroke="#087b7c" stroke-width="2"/><text x="105" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">x, w</text><text x="105" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">输入</text><path d="M185 190 L215 190 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="140" width="155" height="100" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="295" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">z=wx+b</text><text x="295" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">线性</text><path d="M375 190 L405 190 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="408" y="140" width="155" height="100" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="485" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">a=ReLU(z)</text><text x="485" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">激活</text><path d="M565 190 L595 190 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="598" y="140" width="155" height="100" rx="10" fill="#ebe7f5" stroke="#7560b5" stroke-width="2"/><text x="675" y="180" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243338" text-anchor="middle">L(a,t)</text><text x="675" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">损失</text>
<text x="30" y="302" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#087b7c" text-anchor="start">前向：</text><text x="100" y="302" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="start">z → a → L</text>
<text x="30" y="340" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#c46b45" text-anchor="start">反向：</text><text x="100" y="340" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243338" text-anchor="start">∂L/∂a → ∂L/∂z → ∂L/∂w</text>
<text x="30" y="386" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">若一个中间量被两条路径复用，回传到该量的梯度贡献必须求和。</text></svg>