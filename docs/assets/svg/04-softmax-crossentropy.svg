<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Logits 到 softmax 概率再到交叉熵</title><desc id="desc">三个 logits 经过减最大值的稳定 softmax 得到概率；目标类别为 0 时，交叉熵取该类别概率的负对数。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="start">分类损失：训练时输入 logits，不必先手工 softmax</text>
<rect x="35" y="124" width="165" height="180" rx="10" fill="#e4f1ec" stroke="#087b7c" stroke-width="2"/><text x="117" y="158" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#087b7c" text-anchor="middle">Logits</text>
<rect x="62" y="178" width="110" height="28" rx="4" fill="#fff" stroke="#a9bdb5" stroke-width="2"/><text x="117" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">2.0</text><rect x="62" y="214" width="110" height="28" rx="4" fill="#fff" stroke="#a9bdb5" stroke-width="2"/><text x="117" y="234" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">1.0</text><rect x="62" y="250" width="110" height="28" rx="4" fill="#fff" stroke="#a9bdb5" stroke-width="2"/><text x="117" y="270" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">0.0</text>
<path d="M207 213 L280 213 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="290" y="124" width="190" height="180" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="385" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#c46b45" text-anchor="middle">Softmax</text>
<rect x="320" y="178" width="130" height="28" rx="4" fill="#d7eee4" stroke="#c4cfc9" stroke-width="2"/><text x="385" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#243338" text-anchor="middle">0.665</text><rect x="320" y="214" width="130" height="28" rx="4" fill="#fff" stroke="#c4cfc9" stroke-width="2"/><text x="385" y="234" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#243338" text-anchor="middle">0.245</text><rect x="320" y="250" width="130" height="28" rx="4" fill="#fff" stroke="#c4cfc9" stroke-width="2"/><text x="385" y="270" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#243338" text-anchor="middle">0.090</text>
<path d="M487 213 L555 213 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="565" y="124" width="195" height="180" rx="10" fill="#ebe7f5" stroke="#7560b5" stroke-width="2"/><text x="662" y="160" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#7560b5" text-anchor="middle">目标 y = 0</text><text x="662" y="207" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243338" text-anchor="middle">−log(0.665)</text><text x="662" y="250" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7560b5" text-anchor="middle">L ≈ 0.408</text>
<text x="30" y="380" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">概率仅用于解释；CrossEntropyLoss 采用数值稳定的 logits 形式计算同一目标。</text></svg>