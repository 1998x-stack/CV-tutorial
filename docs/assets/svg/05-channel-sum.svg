<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">多输入通道在卷积输出前求和</title><desc id="desc">每个输出通道对应一组跨输入通道的核；各输入通道局部相关结果相加，再加偏置得到输出特征图。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="start">卷积不只是空间滑窗：还要跨输入通道求和</text>
<rect x="30" y="118" width="180" height="190" rx="10" fill="#e4f1ec" stroke="#087b7c" stroke-width="2"/><text x="120" y="155" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087b7c" text-anchor="middle">Input C₁</text><text x="120" y="204" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#243338" text-anchor="middle">3 × 3 map</text><text x="120" y="250" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">X[0, 0, :, :]</text>
<rect x="30" y="322" width="180" height="65" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="120" y="363" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c46b45" text-anchor="middle">Input C₂</text>
<path d="M215 205 L280 205 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 352 L280 352 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="290" y="132" width="160" height="100" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="370" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c46b45" text-anchor="middle">W[o, 0]</text><text x="370" y="205" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">2 × 2</text>
<rect x="290" y="282" width="160" height="100" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="370" y="324" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c46b45" text-anchor="middle">W[o, 1]</text><text x="370" y="355" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243338" text-anchor="middle">2 × 2</text>
<path d="M455 182 L525 250 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 332 L525 265 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="535" y="178" width="220" height="140" rx="10" fill="#ebe7f5" stroke="#7560b5" stroke-width="2"/><text x="645" y="220" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#7560b5" text-anchor="middle">Σ 通道结果 + bias</text><text x="645" y="265" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#243338" text-anchor="middle">Output Cₒ</text>
<text x="30" y="405" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">权重形状：[Cout, Cin, Kh, Kw]；输出形状：[N, Cout, Hout, Wout]。</text></svg>