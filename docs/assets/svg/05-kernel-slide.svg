<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">卷积层互相关的逐窗口计算</title><desc id="d">输入为数字一至九的三乘三网格，核为一零零负一的二乘二网格；按相关操作滑动后，得到一个二乘二输出且每个值为负四。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/><text x="29" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">先看一个像素窗口：乘、加、移动</text><g font-family="Arial,sans-serif" font-size="18" fill="#243338"><text x="39" y="102">输入 3×3</text><text x="330" y="102">核 2×2</text><text x="620" y="102">输出 2×2</text></g><rect x="41" y="132" width="58" height="58" rx="4" fill="#f1decf" stroke="#adc8bd"/><text x="70" y="167" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">1</text><rect x="106" y="132" width="58" height="58" rx="4" fill="#f1decf" stroke="#adc8bd"/><text x="135" y="167" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">2</text><rect x="171" y="132" width="58" height="58" rx="4" fill="#e2f1e9" stroke="#adc8bd"/><text x="200" y="167" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">3</text><rect x="41" y="197" width="58" height="58" rx="4" fill="#f1decf" stroke="#adc8bd"/><text x="70" y="232" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">4</text><rect x="106" y="197" width="58" height="58" rx="4" fill="#f1decf" stroke="#adc8bd"/><text x="135" y="232" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">5</text><rect x="171" y="197" width="58" height="58" rx="4" fill="#e2f1e9" stroke="#adc8bd"/><text x="200" y="232" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">6</text><rect x="41" y="262" width="58" height="58" rx="4" fill="#e2f1e9" stroke="#adc8bd"/><text x="70" y="297" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">7</text><rect x="106" y="262" width="58" height="58" rx="4" fill="#e2f1e9" stroke="#