<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">卷积输出尺寸的整数窗口计数</title><desc id="desc">输入 32、kernel 3、padding 1、stride 2、dilation 1 时，有效核宽 3，输出长度为 floor((32+2−3)/2)+1=16。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="start">输出尺寸由有效核、padding 和 stride 共同决定</text>
<rect x="45" y="120" width="210" height="185" rx="10" fill="#e4f1ec" stroke="#087b7c" stroke-width="2"/><text x="150" y="158" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#087b7c" text-anchor="middle">输入特征图</text><text x="150" y="220" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#243338" text-anchor="middle">32 × 32</text><text x="150" y="265" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">H = W = 32</text>
<path d="M265 210 L355 210 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="365" y="120" width="150" height="185" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="440" y="160" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#c46b45" text-anchor="middle">滑动窗口</text><text x="440" y="215" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338" text-anchor="middle">K = 3</text><text x="440" y="260" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">S = 2, P = 1</text>
<path d="M525 210 L590 210 m-10 -8 10 8 -10 8" fill="none" stroke="#087b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="600" y="120" width="160" height="185" rx="10" fill="#ebe7f5" stroke="#7560b5" stroke-width="2"/><text x="680" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7560b5" text-anchor="middle">输出</text><text x="680" y="220" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#243338" text-anchor="middle">16 × 16</text><text x="680" y="265" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676d" text-anchor="middle">Hout = Wout</text>
<text x="32" y="360" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#c46b45" text-anchor="start">有效核 K_eff = D(K−1)+1 = 3</text>
<text x="32" y="394" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087b7c" text-anchor="start">floor((32 + 2×1 − 3)/2) + 1 = 16</text></svg>