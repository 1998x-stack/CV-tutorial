<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">全连接层与卷积层的参数预算</title><desc id="desc">对 224×224×3 输入，全连接到 1000 单元有 150528000 个权重；3×3 卷积 3 输入通道、64 输出通道仅有 1728 个权重。</desc><rect width="800" height="420" rx="20" fill="#fffdfa"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338" text-anchor="start">局部连接与权重共享，改变的是参数预算</text>
<rect x="40" y="110" width="315" height="205" rx="10" fill="#f7e8dc" stroke="#c46b45" stroke-width="2"/><text x="197" y="150" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#c46b45" text-anchor="middle">Flatten → FC 1000</text>
<text x="197" y="204" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#243338" text-anchor="middle">150,528 × 1,000</text><text x="197" y="250" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#c46b45" text-anchor="middle">150,528,000 weights</text>
<rect x="445" y="110" width="315" height="205" rx="10" fill="#e4f1ec" stroke="#087b7c" stroke-width="2"/><text x="602" y="150" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#087b7c" text-anchor="middle">3×3 Conv 64</text>
<text x="602" y="204" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#243338" text-anchor="middle">3 × 3 × 3 × 64</text><text x="602" y="250" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#087b7c" text-anchor="middle">1,728 weights</text>
<text x="30" y="365" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">卷积参数少不代表 FLOPs 必然少：还要计入输出 H×W、通道、stride 和访存。</text></svg>