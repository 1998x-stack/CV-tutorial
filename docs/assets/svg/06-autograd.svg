<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">autograd 的前向计算与反向梯度累积</title><desc id="desc">w=2，x=3，z=wx=6，L=(z−1)^2/2=12.5，反向导数dL/dw=15；第二次backward累加到已有grad</desc><rect x="2" y="2" width="896" height="416" rx="18" fill="#fffdfa" stroke="#d9e9e2"/><text x="26" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">反向计算图保存依赖；叶子参数的 .grad 默认累加</text><rect x="26" y="126" width="202" height="103" rx="12" fill="#e5f3ee" stroke="#087b7c" stroke-width="2"/><text x="127" y="182" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" fill="#243338">w = 2, x = 3</text><path d="M228 175h15m-6-6 6 6-6 6" fill="none" stroke="#53676d" stroke-width="2"/><rect x="243" y="126" width="202" height="103" rx="12" fill="#f9e9dc" stroke="#c46b45" stroke-width="2"/><text x="344" y="182" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" fill="#243338">z = w × x = 6</text><path d="M445 175h15m-6-6 6 6-6 6" fill="none" stroke="#53676d" stroke-width="2"/><rect x="460" y="126" width="202" height="103" rx="12" fill="#ebe7f6" stroke="#7461ba" stroke-width="2"/><text x="561" y="182" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" fill="#243338">L = (z − 1)²/2</text><path d="M662 175h15m-6-6 6 6-6 6" fill="none" stroke="#53676d" stroke-width="2"/><rect x="677" y="126" width="202" height="103" rx="12" fill="#e5f3ee" stroke="#087b7c" stroke-width="2"/><text x="778" y="182" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" fill="#243338">∂L/∂w = 15</text><path d="M760 270V318H126V267" stroke="#c46b45" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="440" y="309" font-size="17" font-family="Arial,sans-serif" fill="#c46b45" text-anchor="middle">反向传播：梯度沿依赖反向流动</text><text x="28" y="374" font-family="Arial,sans-serif" font-size="16" fill="#53676d">同一参数若对新计算图再次 backward，必须先决定是否清空已有 .grad。</text></svg>