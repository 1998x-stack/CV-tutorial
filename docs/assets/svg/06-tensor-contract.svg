<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">从输入到结果的计算序列</title><desc id="desc">节点通过从左到右的箭头表达张量计算顺序</desc><rect x="2" y="2" width="896" height="416" rx="18" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="49" font-family="Arial,sans-serif" font-size="22" fill="#243338" font-weight="700">张量的形状、设备与类型必须成组检查</text><rect x="24" y="140" width="199.5" height="125" rx="12" fill="#e5f3ee" stroke="#087b7c" stroke-width="2"/><text x="123.75" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#243338" font-weight="700">CPU 上的张量</text><text x="123.75" y="227" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#53676d">(N,C,H,W)</text><path d="M223.5 202h13m-6-6 6 6-6 6" stroke="#53676d" stroke-width="2" fill="none"/><rect x="237.5" y="140" width="199.5" height="125" rx="12" fill="#f9e9dc" stroke="#c46b45" stroke-width="2"/><text x="337.25" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#243338" font-weight="700">to(device)</text><text x="337.25" y="227" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#53676d">保持 dtype / 形状</text><path d="M437 202h13m-6-6 6 6-6 6" stroke="#53676d" stroke-width="2" fill="none"/><rect x="451" y="140" width="199.5" height="125" rx="12" fill="#ebe7f6" stroke="#7461ba" stroke-width="2"/><text x="550.75" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#243338" font-weight="700">NCHW 模型</text><text x="550.75" y="227" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#53676d">(N,K) logits</text><path d="M650.5 202h13m-6-6 6 6-6 6" stroke="#53676d" stroke-width="2" fill="none"/><rect x="664.5" y="140" width="199.5" height="125" rx="12" fill="#e5f3ee" stroke="#087b7c" stroke-width="2"/><text x="764.25" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#243338" font-weight="700">loss 与标量</text><text x="764.25" y="227" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#53676d">标量 loss</text><text x="29" y="355" font-family="Arial,sans-serif" font-size="16" fill="#53676d">各模块的执行顺序固定，但形状、设备与梯度跟踪规则必须显式检查。</text></svg>