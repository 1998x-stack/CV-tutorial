<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">训练与验证拥有不同的状态语义</title><desc id="desc">训练在 train 模式打开梯度与优化器更新；验证使用 eval 模式和 inference_mode 无梯度，仅记录指标</desc><rect x="2" y="2" width="896" height="416" rx="18" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="49" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">两个阶段，不能只靠关掉 backward 来区分</text><rect x="35" y="94" width="394" height="260" rx="15" fill="#eaf5f0" stroke="#087b7c" stroke-width="2"/><rect x="470" y="94" width="394" height="260" rx="15" fill="#fff0e5" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#243338"><text x="58" y="132" font-size="22" font-weight="700">训练 train()</text><text x="493" y="132" font-size="22" font-weight="700">验证 eval()</text></g><g font-family="Arial,sans-serif" fill="#243338" font-size="19"><text x="58" y="184">输入 → forward → loss</text><text x="58" y="224">zero_grad → backward</text><text x="58" y="264">optimizer.step()</text><text x="58" y="313" font-size="15" fill="#53676d">Dropout 等遵循训练行为</text><text x="493" y="184">输入 → forward → metric</text><text x="493" y="224">inference_mode()</text><text x="493" y="264">无参数更新</text><text x="493" y="313" font-size="15" fill="#53676d">BN 使用已维护的运行统计</text></g></svg>