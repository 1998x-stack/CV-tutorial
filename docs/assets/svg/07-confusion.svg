<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">三分类混淆矩阵显示错误去向</title><desc id="d">行为真实标签，列为预测标签。三乘三样例矩阵分别为行A 5 1 0，行B 2 3 0，行C 0 1 4。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d5e4dd"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">只看 accuracy，会丢失错到了哪个类别的信息</text><text x="299" y="105" font-family="Arial,sans-serif" font-size="18" fill="#53676d">预测标签</text><text x="40" y="225" font-family="Arial,sans-serif" font-size="18" fill="#53676d">真实标签</text><text x="271" y="137" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#243338">A</text><text x="182" y="199" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#243338">A</text><text x="394" y="137" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#243338">B</text><text x="182" y="281" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#243338">B</text><text x="517" y="137" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#243338">C</text><text x="182" y="363" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#243338">C</text><rect x="215" y="152" width="108" height="72" rx="8" fill="#cde8dc" stroke="#d3ded9"/><text x="269" y="199" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">5</text><rect x="338" y="152" width="108" height="72" rx="8" fill="#faeee6" stroke="#d3ded9"/><text x="392" y="199" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">1</text><rect x="461" y="152" width="108" height="72" rx="8" fill="#faeee6" stroke="#d3ded9"/><text x="515" y="199" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">0</text><rect x="215" y="234" width="108" height="72" rx="8" fill="#faeee6" stroke="#d3ded9"/><text x="269" y="281" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">2</text><rect x="338" y="234" width="108" height="72" rx="8" fill="#cde8dc" stroke="#d3ded9"/><text x="392" y="281" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">3</text><rect x="461" y="234" width="108" height="72" rx="8" fill="#faeee6" stroke="#d3ded9"/><text x="515" y="281" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">0</text><rect x="215" y="316" width="108" height="72" rx="8" fill="#faeee6" stroke="#d3ded9"/><text x="269" y="363" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">0</text><rect x="338" y="316" width="108" height="72" rx="8" fill="#faeee6" stroke="#d3ded9"/><text x="392" y="363" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">1</text><rect x="461" y="316" width="108" height="72" rx="8" fill="#cde8dc" stroke="#d3ded9"/><text x="515" y="363" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243338">4</text><g font-family="Arial,sans-serif" font-size="17" fill="#53676d"><text x="635" y="171">A 类：TP = 5</text><text x="635" y="207">FP = 2</text><text x="635" y="243">FN = 1</text><text x="635" y="291">Precision = 5/7</text><text x="635" y="324">Recall = 5/6</text></g></svg>