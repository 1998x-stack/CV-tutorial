<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">数据集应按原始群组划分，以防止相近图像泄漏</title><desc id="d">同一人或同一视频场景生成的多个帧应作为一组进入训练、验证或测试，而不是任意拆散。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d5e4dd"/><text x="28" y="48" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">先按拍摄主体 / 场景分组，再划分数据</text><rect x="35" y="112" width="264" height="102" rx="12" fill="#e6f3ee" stroke="#087b7c" stroke-width="2"/><text x="167" y="151" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#243338" font-weight="700">组 A · 连续帧</text><rect x="92" y="170" width="28" height="26" rx="3" fill="#87bbaa"/><rect x="132" y="170" width="28" height="26" rx="3" fill="#87bbaa"/><rect x="172" y="170" width="28" height="26" rx="3" fill="#87bbaa"/><rect x="212" y="170" width="28" height="26" rx="3" fill="#87bbaa"/><rect x="326" y="112" width="264" height="102" rx="12" fill="#f9eadf" stroke="#c46b45" stroke-width="2"/><text x="458" y="151" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#243338" font-weight="700">组 B · 连续帧</text><rect x="383" y="170" width="28" height="26" rx="3" fill="#dfae8f"/><rect x="423" y="170" width="28" height="26" rx="3" fill="#dfae8f"/><rect x="463" y="170" width="28" height="26" rx="3" fill="#dfae8f"/><rect x="503" y="170" width="28" height="26" rx="3" fill="#dfae8f"/><rect x="617" y="112" width="264" height="102" rx="12" fill="#eae7f5" stroke="#7461ba" stroke-width="2"/><text x="749" y="151" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#243338" font-weight="700">组 C · 连续帧</text><rect x="674" y="170" width="28" height="26" rx="3" fill="#b5a8d9"/><rect x="714" y="170" width="28" height="26" rx="3" fill="#b5a8d9"/><rect x="754" y="170" width="28" height="26" rx="3" fill="#b5a8d9"/><rect x="794" y="170" width="28" height="26" rx="3" fill="#b5a8d9"/><g stroke="#70827f" stroke-width="3" fill="none"><path d="M167 220v40m-8-8 8 8 8-8M458 220v40m-8-8 8 8 8-8M749 220v40m-8-8 8 8 8-8"/></g><rect x="53" y="276" width="226" height="62" rx="10" fill="#fff" stroke="#b9cdc5"/><text x="166" y="315" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">训练集</text><rect x="344" y="276" width="226" height="62" rx="10" fill="#fff" stroke="#b9cdc5"/><text x="457" y="315" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">验证集</text><rect x="635" y="276" width="226" height="62" rx="10" fill="#fff" stroke="#b9cdc5"/><text x="748" y="315" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#243338">测试集</text><text x="32" y="388" font-family="Arial,sans-serif" font-size="16" fill="#53676d">示意图：每个组仅属一个 split；真实实验还需类别分层、采集域及时间泄漏检查。</text></svg>