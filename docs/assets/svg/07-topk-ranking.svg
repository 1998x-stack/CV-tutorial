<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Top-1 与 Top-5 同时检验真实标签在排序中的位置</title><desc id="d">对于真实类别为 C 的例子，按 logits 从大到小得到顺序 A B C D E，Top1 不命中，Top5 命中。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d5e4dd"/><text x="28" y="48" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">分数排序用于选择；不是概率校准的证明</text><text x="38" y="109" font-family="Arial,sans-serif" font-size="18" fill="#53676d">真实类别：C；五个类别的 logits 从高到低</text><rect x="46" y="144" width="148" height="165" rx="8" fill="#dfeee8" stroke="#087b7c" stroke-width="2"/><text x="120" y="192" font-size="24" font-family="Arial,sans-serif" text-anchor="middle" fill="#243338" font-weight="700">A</text><text x="120" y="346" font-size="15" font-family="Arial,sans-serif" text-anchor="middle" fill="#53676d">排名 1</text><rect x="219" y="144" width="148" height="139" rx="8" fill="#dfeee8" stroke="#087b7c" stroke-width="2"/><text x="293" y="192" font-size="24" font-family="Arial,sans-serif" text-anchor="middle" fill="#243338" font-weight="700">B</text><text x="293" y="320" font-size="15" font-family="Arial,sans-serif" text-anchor="middle" fill="#53676d">排名 2</text><rect x="392" y="144" width="148" height="113" rx="8" fill="#e9c0a5" stroke="#c46b45" stroke-width="2"/><text x="466" y="192" font-size="24" font-family="Arial,sans-serif" text-anchor="middle" fill="#243338" font-weight="700">C</text><text x="466" y="294" font-size="15" font-family="Arial,sans-serif" text-anchor="middle" fill="#53676d">排名 3</text><rect x="565" y="144" width="148" height="91" rx="8" fill="#dfeee8" stroke="#087b7c" stroke-width="2"/><text x="639" y="192" font-size="24" font-family="Arial,sans-serif" text-anchor="middle" fill="#243338" font-weight="700">D</text><text x="639" y="272" font-size="15" font-family="Arial,sans-serif" text-anchor="middle" fill="#53676d">排名 4</text><rect x="738" y="144" width="148" height="72" rx="8" fill="#dfeee8" stroke="#087b7c" stroke-width="2"/><text x="812" y="192" font-size="24" font-family="Arial,sans-serif" text-anchor="middle" fill="#243338" font-weight="700">E</text><text x="812" y="253" font-size="15" font-family="Arial,sans-serif" text-anchor="middle" fill="#53676d">排名 5</text><path d="M46 337H190" stroke="#c46b45" stroke-width="4"/><text x="47" y="364" font-size="16" font-family="Arial,sans-serif" fill="#c46b45">Top-1：错误</text><text x="315" y="364" font-size="16" font-family="Arial,sans-serif" fill="#087b7c">Top-5：正确（C 排在第 3）</text></svg>