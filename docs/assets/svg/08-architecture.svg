<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">AlexNet 五层卷积与三层全连接的整体架构</title><desc id="d">论文有五个卷积层96 256 384 384 256输出通道，三个全连接层4096 4096 1000输出；同时穿插ReLU归一化和池化。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d7e6df"/><text x="30" y="43" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#243338">AlexNet（论文概念层次）：5 Conv + 3 FC</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="20" y="116" width="86" height="150" rx="10" fill="#e9eee9" stroke="#087b7c" stroke-width="1.8"/><text x="63" y="165" font-size="16" fill="#243338" font-weight="700">RGB 输入</text><text x="63" y="197" font-size="14" fill="#53676d">3ch</text><path d="M105 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="116" y="116" width="86" height="150" rx="10" fill="#dcefe8" stroke="#087b7c" stroke-width="1.8"/><text x="159" y="165" font-size="16" fill="#243338" font-weight="700">Conv1</text><text x="159" y="197" font-size="14" fill="#53676d">96ch</text><path d="M201 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="212" y="116" width="86" height="150" rx="10" fill="#dcefe8" stroke="#087b7c" stroke-width="1.8"/><text x="255" y="165" font-size="16" fill="#243338" font-weight="700">Conv2</text><text x="255" y="197" font-size="14" fill="#53676d">256ch</text><path d="M297 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="308" y="116" width="86" height="150" rx="10" fill="#dcefe8" stroke="#087b7c" stroke-width="1.8"/><text x="351" y="165" font-size="16" fill="#243338" font-weight="700">Conv3</text><text x="351" y="197" font-size="14" fill="#53676d">384ch</text><path d="M393 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="404" y="116" width="86" height="150" rx="10" fill="#dcefe8" stroke="#087b7c" stroke-width="1.8"/><text x="447" y="165" font-size="16" fill="#243338" font-weight="700">Conv4</text><text x="447" y="197" font-size="14" fill="#53676d">384ch</text><path d="M489 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="500" y="116" width="86" height="150" rx="10" fill="#dcefe8" stroke="#087b7c" stroke-width="1.8"/><text x="543" y="165" font-size="16" fill="#243338" font-weight="700">Conv5</text><text x="543" y="197" font-size="14" fill="#53676d">256ch</text><path d="M585 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="596" y="116" width="86" height="118" rx="10" fill="#f5e3d7" stroke="#c46b45" stroke-width="1.8"/><text x="639" y="165" font-size="16" fill="#243338" font-weight="700">FC6</text><text x="639" y="197" font-size="14" fill="#53676d">4096</text><path d="M681 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="692" y="116" width="86" height="118" rx="10" fill="#f5e3d7" stroke="#c46b45" stroke-width="1.8"/><text x="735" y="165" font-size="16" fill="#243338" font-weight="700">FC7</text><text x="735" y="197" font-size="14" fill="#53676d">4096</text><path d="M777 195h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="788" y="116" width="86" height="118" rx="10" fill="#f5e3d7" stroke="#c46b45" stroke-width="1.8"/><text x="831" y="165" font-size="16" fill="#243338" font-weight="700">FC8</text><text x="831" y="197" font-size="14" fill="#53676d">1000</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#53676d"><text x="32" y="315">局部响应归一化：Conv1/Conv2 后；池化：前两个归一化层及 Conv5 后。</text><text x="32" y="347">FC 部分参数密集；论文还采用两块 GPU 的特定通道连接方式。</text><text x="32" y="378">为教学重绘的阶段图，不复制论文图 2，也不将现代库实现当原版。</text></g></svg>