<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">训练增强与测试十裁剪之间的区别</title><desc id="d">训练从放大后的图像随机裁出224方形并翻转，以及RGB强度变化；评估十裁剪是五个确定位置及对应水平翻转，平均预测分布。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d7e6df"/><text x="28" y="44" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">训练增加变化；评估通过固定视角平均</text><rect x="44" y="102" width="340" height="249" rx="14" fill="#e5f1eb" stroke="#087b7c" stroke-width="2"/><rect x="506" y="102" width="345" height="249" rx="14" fill="#f7e9df" stroke="#c46b45" stroke-width="2"/><g font-size="18" font-family="Arial,sans-serif" fill="#243338"><text x="60" y="135" font-weight="700">Train：随机裁切 / 水平翻转</text><text x="523" y="135" font-weight="700">Test：5 位置 × 2 个方向</text></g><g fill="#c9ded5" stroke="#087b7c" stroke-width="1.7"><rect x="83" y="157" width="183" height="157" rx="7"/><rect x="113" y="169" width="144" height="129" rx="4" fill="#a8cfc0" stroke="#c46b45" stroke-width="3"/></g><g fill="#eed6c3" stroke="#c46b45" stroke-width="1.7"><rect x="536" y="168" width="64" height="56" rx="5"/><rect x="653" y="168" width="64" height="56" rx="5"/><rect x="770" y="168" width="64" height="56" rx="5"/><rect x="536" y="241" width="64" height="56" rx="5"/><rect x="653" y="241" width="64" height="56" rx="5"/></g><g font-size="16" font-family="Arial,sans-serif" fill="#53676d"><text x="62" y="339">每次随机抽取不同 224×224 内容</text><text x="523" y="338">另外取每个裁剪的水平翻转</text><text x="32" y="390">论文描述还包括 RGB 主成分扰动；此图不代表任一具体数据增强样本。</text></g></svg>