<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">AlexNet 的双 GPU 分组通道连接示意</title><desc id="d">两个 GPU 各持有部分特征图；第二四五卷积局部同卡连接，第三卷积跨卡读取所有第二层输出；全连接访问所有前一层特征。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d7e6df"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">双 GPU 的重点是连接约束，不只是复制两套网络</text><rect x="32" y="100" width="826" height="122" rx="14" fill="#e7f4f0" stroke="#087b7c"/><text x="48" y="127" font-size="16" font-family="Arial,sans-serif" fill="#243338">GPU 0</text><rect x="32" y="251" width="826" height="122" rx="14" fill="#f7e9df" stroke="#c46b45"/><text x="48" y="278" font-size="16" font-family="Arial,sans-serif" fill="#243338">GPU 1</text><text x="161" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">Conv2</text><rect x="115" y="145" width="92" height="51" rx="7" fill="#fffdfa" stroke="#087b7c" stroke-width="2"/><text x="161" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 1</text><rect x="115" y="296" width="92" height="51" rx="7" fill="#fffdfa" stroke="#c46b45" stroke-width="2"/><text x="161" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 2</text><text x="320" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">Conv3</text><rect x="274" y="145" width="92" height="51" rx="7" fill="#fffdfa" stroke="#087b7c" stroke-width="2"/><text x="320" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 1</text><rect x="274" y="296" width="92" height="51" rx="7" fill="#fffdfa" stroke="#c46b45" stroke-width="2"/><text x="320" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 2</text><text x="479" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">Conv4</text><rect x="433" y="145" width="92" height="51" rx="7" fill="#fffdfa" stroke="#087b7c" stroke-width="2"/><text x="479" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 1</text><rect x="433" y="296" width="92" height="51" rx="7" fill="#fffdfa" stroke="#c46b45" stroke-width="2"/><text x="479" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 2</text><text x="638" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">Conv5</text><rect x="592" y="145" width="92" height="51" rx="7" fill="#fffdfa" stroke="#087b7c" stroke-width="2"/><text x="638" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 1</text><rect x="592" y="296" width="92" height="51" rx="7" fill="#fffdfa" stroke="#c46b45" stroke-width="2"/><text x="638" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 2</text><text x="797" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">FC</text><rect x="751" y="145" width="92" height="51" rx="7" fill="#fffdfa" stroke="#087b7c" stroke-width="2"/><text x="797" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 1</text><rect x="751" y="296" width="92" height="51" rx="7" fill="#fffdfa" stroke="#c46b45" stroke-width="2"/><text x="797" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">特征 2</text><g stroke="#53676d" stroke-width="2" fill="none"><path d="M207 170H274"/><path d="M366 170H433"/><path d="M525 170H592"/><path d="M684 170H751"/><path d="M207 321H274"/><path d="M366 321H433"/><path d="M525 321H592"/><path d="M684 321H751"/></g><g stroke="#7461ba" stroke-width="3" fill="none" stroke-dasharray="7 5"><path d="M207 170L274 321M207 321L274 170M684 170L751 321M684 321L751 170"/></g><text x="30" y="406" font-family="Arial,sans-serif" font-size="15" fill="#53676