<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">VGG16 参数主要集中在第一个全连接层</title><desc id="d">VGG16 经典无批归一化版本约138.36M可训练参数，其中第一FC层含约102.76M，约占74%；其它层合计约35.59M。</desc><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#d3e3dc"/><text x="30" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">为什么 VGG 的模型文件这么大？</text><text x="40" y="105" font-family="Arial,sans-serif" font-size="18" fill="#53676d">VGG-16：约 138.36M 参数</text><rect x="42" y="143" width="813" height="96" rx="12" fill="#e5f3ed"/><path d="M55 143h603v96H55a13 13 0 0 1-13-13v-70a13 13 0 0 1 13-13z" fill="#c46b45"/><path d="M658 143h184a13 13 0 0 1 13 13v70a13 13 0 0 1-13 13H658z" fill="#087b7c"/><g font-family="Arial,sans-serif" font-size="21" fill="#fff"><text x="72" y="198">第 1 个 FC：102.76M（约 74%）</text><text x="681" y="198" font-size="17">其它</text></g><g font-family="Arial,sans-serif" font-size="18" fill="#243338"><text x="40" y="294">FC1 输入：7×7×512 = 25,088</text><text x="40" y="326">输出：4096；权重：25,088×4096，另加 bias</text><text x="40" y="363" font-size="16" fill="#53676d">比例为按 torchvision vgg16(weights=None) 常见无 BN 结构计算的近似值。</text></g></svg>