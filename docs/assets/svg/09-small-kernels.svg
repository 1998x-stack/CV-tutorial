<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">连续小卷积核与大卷积核的感受野相同但参数和非线性不同</title><desc id="d">两个三乘三卷积核有五乘五理论感受野，三个三乘三卷积核有七乘七理论感受野；通道恒为C时分别需要18C平方和27C平方核权重，而单层五乘五需要25C平方，七乘七需要49C平方。</desc><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#d3e3dc"/><text x="29" y="47" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">感受野相同 ≠ 完全相同的函数</text><g font-family="Arial,sans-serif" font-size="18" fill="#243338"><text x="42" y="103">2× (3×3)</text><text x="346" y="103">1× (5×5)</text><text x="654" y="103">3× (3×3)</text></g><rect x="60" y="147" width="92" height="92" rx="8" fill="#e6f1ea" stroke="#087b7c" stroke-width="2"/><rect x="112" y="174" width="92" height="92" rx="8" fill="#e6f1ea" stroke="#087b7c" stroke-width="2"/><rect x="362" y="147" width="116" height="116" rx="8" fill="#f8e7da" stroke="#c46b45" stroke-width="2"/><rect x="654" y="147" width="92" height="92" rx="8" fill="#e6f1ea" stroke="#087b7c" stroke-width="2"/><rect x="706" y="174" width="92" height="92" rx="8" fill="#e6f1ea" stroke="#087b7c" stroke-width="2"/><rect x="758" y="201" width="92" height="92" rx="8" fill="#e6f1ea" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="18" fill="#243338"><text x="48" y="308">5×5 RF · 18C²</text><text x="354" y="308">5×5 RF · 25C²</text><text x="664" y="308">7×7 RF · 27C²</text><text x="42" y="365" font-size="16" fill="#53676d">固定通道 C、忽略 bias；每层之间的 ReLU 赋予堆叠更多非线性变换。</text></g></svg>