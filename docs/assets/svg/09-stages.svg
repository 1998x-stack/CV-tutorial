<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">VGG16 按五个卷积阶段组织，逐层降低空间尺寸</title><desc id="d">输入224平方，五段通道依次为64 128 256 512 512，卷积重复次数为2 2 3 3 3，每段之后最大池化下采样两倍，空间从224变到112 56 28 14 7，最后接三个FC。</desc><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#d3e3dc"/><text x="30" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">VGG-16（configuration D）：卷积 13 层 + FC 3 层</text><rect x="24" y="106" width="157" height="184" rx="12" fill="#e6f2ed" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="103" y="143" font-size="19" font-weight="700">Stage 1</text><text x="103" y="179" font-size="18">2 × Conv3</text><text x="103" y="212" font-size="16">64 channels</text><text x="103" y="245" font-size="16">Pool → 112²</text></g><path d="M182 200h15m-7-7 7 7-7 7" stroke="#53676d" stroke-width="2" fill="none"/><rect x="198" y="106" width="157" height="184" rx="12" fill="#f6e9e0" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="277" y="143" font-size="19" font-weight="700">Stage 2</text><text x="277" y="179" font-size="18">2 × Conv3</text><text x="277" y="212" font-size="16">128 channels</text><text x="277" y="245" font-size="16">Pool → 56²</text></g><path d="M356 200h15m-7-7 7 7-7 7" stroke="#53676d" stroke-width="2" fill="none"/><rect x="372" y="106" width="157" height="184" rx="12" fill="#e6f2ed" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="451" y="143" font-size="19" font-weight="700">Stage 3</text><text x="451" y="179" font-size="18">3 × Conv3</text><text x="451" y="212" font-size="16">256 channels</text><text x="451" y="245" font-size="16">Pool → 28²</text></g><path d="M530 200h15m-7-7 7 7-7 7" stroke="#53676d" stroke-width="2" fill="none"/><rect x="546" y="106" width="157" height="184" rx="12" fill="#f6e9e0" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="625" y="143" font-size="19" font-weight="700">Stage 4</text><text x="625" y="179" font-size="18">3 × Conv3</text><text x="625" y="212" font-size="16">512 channels</text><text x="625" y="245" font-size="16">Pool → 14²</text></g><path d="M704 200h15m-7-7 7 7-7 7" stroke="#53676d" stroke-width="2" fill="none"/><rect x="720" y="106" width="157" height="184" rx="12" fill="#e6f2ed" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="799" y="143" font-size="19" font-weight="700">Stage 5</text><text x="799" y="179" font-size="18">3 × Conv3</text><text x="799" y="212" font-size="16">512 channels</text><text x="799" y="245" font-size="16">Pool → 7²</text></g><g font-family="Arial,sans-serif" fill="#53676d"><text x="30" y="330" font-size="17">每个卷积均为 3×3、stride 1、padding 1；每个 stage 末尾 2×2 max pool、stride 2。</text><text x="30" y="367" font-size="17">224² → 112² → 56² → 28² → 14² → 7²；再接 4096、4096、1000。</text></g></svg>