<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">残差块的雅可比包含恒等项但还受激活函数影响</title><desc id="d">对于预激活求和y=x+F(x)，相对于x的雅可比为I+J_F；原始v1在加法后ReLU，因此反向还经过ReLU门控，不是对所有输入恒等直通。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d8e9e1"/><text x="29" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">求和节点的导数：I + J_F；激活可能继续门控</text><g stroke="#087b7c" stroke-width="3" fill="none"><path d="M110 230H240M390 230H520M680 230H782"/><path d="M130 226V140H527v81" stroke="#7461ba" stroke-dasharray="8 6"/><path d="M230 223l10 7-10 7M510 223l10 7-10 7M773 223l10 7-10 7"/></g><g font-family="Arial,sans-serif" fill="#243338"><rect x="32" y="196" width="106" height="70" rx="11" fill="#e5f1eb" stroke="#087b7c"/><text x="85" y="238" font-size="22" text-anchor="middle">x</text><rect x="242" y="195" width="145" height="70" rx="11" fill="#f9e7d8" stroke="#c46b45"/><text x="314" y="239" font-size="21" text-anchor="middle">F(x)</text><circle cx="555" cy="230" r="37" fill="#e9e4f5" stroke="#7461ba" stroke-width="2"/><text x="555" y="238" font-size="28" text-anchor="middle">+</text><rect x="685" y="196" width="156" height="70" rx="11" fill="#e5f1eb" stroke="#087b7c"/><text x="763" y="239" font-size="20" text-anchor="middle">y = x + F</text></g><g font-family="Arial,sans-serif" font-size="18" fill="#53676d"><text x="90" y="111">跨层支路不含可学习变换时</text><text x="92" y="326">可提供独立的梯度分量，但并不保证梯度范数恒定或训练一定收敛。</text><text x="92" y="362">原版 v1：相加后的 ReLU 会额外影响传播；v2 修改了这一结构。</text></g></svg>