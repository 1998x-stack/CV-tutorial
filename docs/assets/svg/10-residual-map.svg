<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">普通映射与残差映射的计算路径对照</title><desc id="d">普通路径只通过两层卷积F，残差路径将原始输入x绕过计算分支直接加在F(x)上，然后在原版ResNet v1中经过ReLU；跳连的起点必须早于F。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d8e9e1"/><text x="30" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">区别不在多一条装饰线，而在求和算子真的接收 x</text><rect x="26" y="90" width="407" height="284" rx="14" fill="#f5f7f4" stroke="#c6d6d0"/><rect x="467" y="90" width="407" height="284" rx="14" fill="#eaf6f0" stroke="#087b7c" stroke-width="2"/><g font-size="20" font-family="Arial,sans-serif" fill="#243338"><text x="51" y="124">普通块（plain）</text><text x="494" y="124">残差块（v1）</text></g><g fill="#f5e3d5" stroke="#c46b45" stroke-width="2"><rect x="130" y="178" width="185" height="66" rx="9"/><rect x="583" y="178" width="157" height="66" rx="9"/></g><g font-size="19" font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="222" y="216">F(x) : Conv + BN</text><text x="662" y="216">F(x) : Conv + BN</text><text x="222" y="157">x</text><text x="662" y="157">x</text><text x="222" y="297">ReLU → output</text><text x="692" y="297">⊕ → ReLU</text></g><g stroke="#087b7c" stroke-width="3" fill="none"><path d="M222 160v16M222 244v26M662 160v16M662 245v24h30M692 245v23M662 155h152v111H714"/><path d="M714 260l-7 7 7 7"/></g><g font-size="15" font-family="Arial,sans-serif" fill="#53676d"><text x="44" y="349">输出仅由 F(x) 得到</text><text x="490" y="349">同形状逐元素相加；原版加法之后还经过 ReLU</text></g></svg>