<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">ResNet50 四个 bottleneck stage 的数量及输出通道</title><desc id="d">输入224，卷积主干与池化后为56平方，四个stage含3 4 6 3个bottleneck块，输出宽度为256 512 1024 2048，最后全局池化和FC，层数以1+3乘16+1计算。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d8e9e1"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">ResNet-50：把 3, 4, 6, 3 个 bottleneck 排成四段</text><rect x="28" y="116" width="199" height="191" rx="13" fill="#e5f3ee" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="127" y="152" font-size="20" font-weight="700">Stage 2</text><text x="127" y="193" font-size="24">3 × block</text><text x="127" y="230" font-size="18">256 ch</text><text x="127" y="266" font-size="18">56 × 56</text></g><rect x="247" y="116" width="199" height="191" rx="13" fill="#f8e8dd" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="346" y="152" font-size="20" font-weight="700">Stage 3</text><text x="346" y="193" font-size="24">4 × block</text><text x="346" y="230" font-size="18">512 ch</text><text x="346" y="266" font-size="18">28 × 28</text></g><rect x="466" y="116" width="199" height="191" rx="13" fill="#e5f3ee" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="565" y="152" font-size="20" font-weight="700">Stage 4</text><text x="565" y="193" font-size="24">6 × block</text><text x="565" y="230" font-size="18">1024 ch</text><text x="565" y="266" font-size="18">14 × 14</text></g><rect x="685" y="116" width="199" height="191" rx="13" fill="#f8e8dd" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="784" y="152" font-size="20" font-weight="700">Stage 5</text><text x="784" y="193" font-size="24">3 × block</text><text x="784" y="230" font-size="18">2048 ch</text><text x="784" y="266" font-size="18">7 × 7</text></g><g font-family="Arial,sans-serif" font-size="17" fill="#53676d"><text x="31" y="343">每块主支路使用 1×1 → 3×3 → 1×1；下采样出现在阶段开始位置。</text><text x="31" y="376">50 = stem conv(1) + 16 个 bottleneck×3 层 + 分类 FC(1)；shortcut 投影不计入该命名。</text></g></svg>