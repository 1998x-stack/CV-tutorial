<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">ResNet v1 v2 与 torchvision v1.5 的区别</title><desc id="d">v1加法后ReLU，v2将BN与ReLU移动到主分支卷积前，保持加法后更直接的恒等路径；在torchvision的v1.5中，bottleneck下采样stride2移到中间的3x3层。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d8e9e1"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">名字相同，不保证 block 的算子次序相同</text><rect x="27" y="103" width="276" height="254" rx="13" fill="#e3f2ec" stroke="#087b7c" stroke-width="2"/><text x="165" y="140" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700" fill="#243338">ResNet v1 (2015)</text><text x="165" y="190" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">Conv-BN-ReLU</text><text x="165" y="225" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">Conv-BN → +</text><text x="165" y="260" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">再 ReLU</text><text x="165" y="319" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">标准 post-activation</text><rect x="319" y="103" width="276" height="254" rx="13" fill="#e8e5f5" stroke="#7461ba" stroke-width="2"/><text x="457" y="140" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700" fill="#243338">Pre-activation v2 (2016)</text><text x="457" y="190" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">BN-ReLU-Conv</text><text x="457" y="225" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">BN-ReLU-Conv → +</text><text x="457" y="260" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">相加后无 ReLU</text><text x="457" y="319" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">更直接的恒等输出</text><rect x="611" y="103" width="276" height="254" rx="13" fill="#f8e9dc" stroke="#c46b45" stroke-width="2"/><text x="749" y="140" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700" fill="#243338">torchvision v1.5</text><text x="749" y="190" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">Conv1×1 (s1)</text><text x="749" y="225" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">Conv3×3 (s2)</text><text x="749" y="260" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" fill="#243338">Conv1×1 (s1)</text><text x="749" y="319" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">仅指 bottleneck 下采样</text><text x="31" y="393" font-family="Arial,sans-serif" font-size="15" fill="#53676d">v1/v2 表示激活位置；v1.5 是另一维度的工程变体，不能仅看版本号决定所有算子。</text></svg>