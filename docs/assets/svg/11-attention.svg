<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">一枚query如何通过softmax对三枚key分配注意力权重</title><desc id="desc">toy example，缩放后的三个分数为0、ln2、ln1即0、约0.693、0，经softmax得到四分之一、二分之一、四分之一，和为1，然后对value加权求和。</desc><rect x="2" y="2" width="896" height="416" rx="19" fill="#fffdfa" stroke="#dbe8e2"/><text x="27" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">一枚 query 可以读取所有 key 的 value</text><rect x="26" y="119" width="140" height="109" rx="12" fill="#e4f2ed" stroke="#087b7c"/><text x="96" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#243338">Query q</text><text x="96" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#53676d">1 × dₖ</text><g stroke="#087b7c" stroke-width="2.5" fill="none"><path d="M168 176h70m-10-9 10 9-10 9"/></g><rect x="252" y="124" width="82" height="98" rx="10" fill="#f8e8dc" stroke="#c46b45"/><text x="293" y="162" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#243338">K₁</text><text x="293" y="195" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#53676d">0</text><rect x="351" y="124" width="82" height="98" rx="10" fill="#f8e8dc" stroke="#c46b45"/><text x="392" y="162" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#243338">K₂</text><text x="392" y="195" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#53676d">ln 2</text><rect x="450" y="124" width="82" height="98" rx="10" fill="#f8e8dc" stroke="#c46b45"/><text x="491" y="162" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#243338">K₃</text><text x="491" y="195" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#53676d">0</text><path d="M537 174h42m-10-9 10 9-10 9" stroke="#087b7c" stroke-width="2.5" fill="none"/><rect x="595" y="115" width="256" height="160" rx="12" fill="#ebe6f6" stroke="#7461ba" stroke-width="2"/><text x="720" y="153" font-size="20" font-family="Arial,sans-serif" text-anchor="middle" fill="#243338" font-weight="700">softmax 权重</text><g font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#243338"><text x="641" y="217">¼</text><text x="720" y="217">½</text><text x="799" y="217">¼</text></g><g fill="#7461ba"><rect x="611" y="231" width="60" height="10" rx="3"/><rect x="690" y="231" width="60" height="20" rx="3"/><rect x="769" y="231" width="60" height="10" rx="3"/></g><text x="30" y="338" font-family="Arial,sans-serif" font-size="18" fill="#53676d">输出 = ¼·V₁ + ½·V₂ + ¼·V₃；注意权重是相对分数，非因果解释。</text><text x="30" y="370" font-family="Arial,sans-serif" font-size="16" fill="#53676d">在视觉分类的标准 encoder 中，patch token 与 CLS 通常没有因果掩码。</text></svg>