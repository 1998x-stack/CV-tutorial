<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">ViT原始Encoder的预归一化残差顺序</title><desc id="desc">进入块的token先LN和多头自注意力，再与输入相加；之后LN与MLP再相加。该布局不同于原始2017编码器的post-LN。</desc><rect x="2" y="2" width="896" height="416" rx="19" fill="#fffdfa" stroke="#dbe8e2"/><text x="27" y="47" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">ViT Encoder：两个 Pre-LN 残差子层</text><g font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><rect x="23" y="149" width="98" height="93" rx="9" fill="#e4f1eb" stroke="#087b7c" stroke-width="2"/><text x="72" y="188" font-family="Arial,sans-serif" font-size="16" fill="#243338" text-anchor="middle">输入 x</text><path d="M121 193h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="131" y="149" width="98" height="93" rx="9" fill="#e4f1eb" stroke="#087b7c" stroke-width="2"/><text x="180" y="188" font-family="Arial,sans-serif" font-size="16" fill="#243338" text-anchor="middle">LN</text><path d="M229 193h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="239" y="149" width="98" height="93" rx="9" fill="#f8e6d9" stroke="#c46b45" stroke-width="2"/><text x="288" y="188" font-family="Arial,sans-serif" font-size="13" fill="#243338" text-anchor="middle">Multi-head</text><text x="288" y="210" font-family="Arial,sans-serif" font-size="14" fill="#243338">Attention</text><path d="M337 193h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="347" y="149" width="98" height="93" rx="9" fill="#e8e1f5" stroke="#7461ba" stroke-width="2"/><text x="396" y="188" font-family="Arial,sans-serif" font-size="16" fill="#243338" text-anchor="middle">+</text><path d="M445 193h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="455" y="149" width="98" height="93" rx="9" fill="#e4f1eb" stroke="#087b7c" stroke-width="2"/><text x="504" y="188" font-family="Arial,sans-serif" font-size="16" fill="#243338" text-anchor="middle">LN</text><path d="M553 193h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="563" y="149" width="98" height="93" rx="9" fill="#f8e6d9" stroke="#c46b45" stroke-width="2"/><text x="612" y="188" font-family="Arial,sans-serif" font-size="16" fill="#243338" text-anchor="middle">MLP（GELU）</text><path d="M661 193h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="671" y="149" width="98" height="93" rx="9" fill="#e8e1f5" stroke="#7461ba" stroke-width="2"/><text x="720" y="188" font-family="Arial,sans-serif" font-size="16" fill="#243338" text-anchor="middle">+</text><path d="M769 193h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="779" y="149" width="98" height="93" rx="9" fill="#e4f1eb" stroke="#087b7c" stroke-width="2"/><text x="828" y="188" font-family="Arial,sans-serif" font-size="16" fill="#243338" text-anchor="middle">输出 z</text></g><path d="M72 149V93H396V149 M395 149v-13m-6 6 6-6 6 6" fill="none" stroke="#7461ba" stroke-width="3"/><path d="M396 242v43h324v-43" stroke="#7461ba" stroke-width="3" fill="none"/><g font-family="Arial,sans-serif" font-size="16" fill="#53676d"><text x="30" y="342">第一个加法：u = x + MSA(LN(x))；第二个加法：z = u + MLP(LN(u))。</text><text x="30" y="375">多头数、token 个数和特征维 D 一同决定算力；注意力矩阵形状 N×N。</text></g></svg>