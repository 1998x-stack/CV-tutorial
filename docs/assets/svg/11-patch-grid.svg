<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">224像素输入经16像素patch转换为196个视觉token并添加分类token</title><desc id="desc">14行14列patch，每块3乘16乘16等于768原始元素，ViT-B/16经线性映射后得到196个768维token，加一枚CLS token得到197枚。</desc><rect x="2" y="2" width="896" height="416" rx="19" fill="#fffdfa" stroke="#dbe8e2"/><text x="28" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">像素二维网格 → token 序列（不等于丢失空间索引）</text><rect x="45" y="95" width="255" height="255" rx="9" fill="#dbeee6" stroke="#087b7c" stroke-width="2"/><path d="M63.214285714285715 95v255 M45 113.21428571428572h255" stroke="#81b5a5" stroke-width=".65"/><path d="M81.42857142857143 95v255 M45 131.42857142857144h255" stroke="#81b5a5" stroke-width=".65"/><path d="M99.64285714285714 95v255 M45 149.64285714285714h255" stroke="#81b5a5" stroke-width=".65"/><path d="M117.85714285714286 95v255 M45 167.85714285714286h255" stroke="#81b5a5" stroke-width=".65"/><path d="M136.07142857142856 95v255 M45 186.07142857142856h255" stroke="#81b5a5" stroke-width=".65"/><path d="M154.28571428571428 95v255 M45 204.28571428571428h255" stroke="#81b5a5" stroke-width=".65"/><path d="M172.5 95v255 M45 222.5h255" stroke="#81b5a5" stroke-width=".65"/><path d="M190.71428571428572 95v255 M45 240.71428571428572h255" stroke="#81b5a5" stroke-width=".65"/><path d="M208.92857142857142 95v255 M45 258.92857142857144h255" stroke="#81b5a5" stroke-width=".65"/><path d="M227.14285714285714 95v255 M45 277.1428571428571h255" stroke="#81b5a5" stroke-width=".65"/><path d="M245.35714285714286 95v255 M45 295.3571428571429h255" stroke="#81b5a5" stroke-width=".65"/><path d="M263.57142857142856 95v255 M45 313.57142857142856h255" stroke="#81b5a5" stroke-width=".65"/><path d="M281.7857142857143 95v255 M45 331.7857142857143h255" stroke="#81b5a5" stroke-width=".65"/><path d="M300 95v255 M45 350h255" stroke="#81b5a5" stroke-width=".65"/><rect x="45" y="95" width="18.214285714285715" height="18.214285714285715" fill="#c46b45"/><g font-family="Arial,sans-serif" fill="#243338"><text x="54" y="83" font-size="17">224×224×3</text><text x="47" y="379" font-size="16" fill="#53676d">14×14 = 196 个 patch</text></g><g stroke="#087b7c" stroke-width="3" fill="none"><path d="M315 211h83m-11-9 11 9-11 9M622 211h64m-11-9 11 9-11 9"/></g><g fill="#f8e6d9" stroke="#c46b45" stroke-width="2"><rect x="414" y="143" width="183" height="132" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="505" y="181" font-size="19" font-weight="700">线性投影</text><text x="505" y="214" font-size="17">768 → D=768</text><text x="505" y="245" font-size="16">每 patch 独立</text></g><g fill="#e9e3f4" stroke="#7461ba" stroke-width="2"><rect x="697" y="119" width="160" height="201" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="777" y="157" font-size="20" font-weight="700">197 × 768</text><text x="777" y="199" font-size="18">196 patch</text><text x="777" y="231" font-size="18">+ 1 CLS</text><text x="777" y="273" font-size="15">+ 位置嵌入</text></g><text x="336" y="379" font-family="Arial,sans-serif" font-size="16" fill="#53676d">一般情况 N = (H/P)(W/P)，假设 H、W 可被 P 整除。</text></svg>