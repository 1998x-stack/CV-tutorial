<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">ConvNeXt原始Block以7x7深度卷积加通道混合与残差连接构成</title><desc id="desc">NCHW输入经过7x7 depthwise convolution，转NHWC，LayerNorm，再两个1x1等价线性层C至4C至C并使用GELU，随后可选LayerScale与DropPath，最后与输入相加。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dae9e2"/><text x="27" y="47" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#243338">空间混合与通道混合被清晰地拆开</text><rect x="24" y="146" width="100" height="111" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="74" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">输入 X</text><text x="74" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">C channels</text><path d="M124 201h9m-4-4 4 4-4 4" fill="none" stroke="#53676d" stroke-width="2"/><rect x="133" y="146" width="100" height="111" rx="10" fill="#f8e7d9" stroke="#c46b45" stroke-width="2"/><text x="183" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">DWConv 7×7</text><text x="183" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">groups=C</text><path d="M233 201h9m-4-4 4 4-4 4" fill="none" stroke="#53676d" stroke-width="2"/><rect x="242" y="146" width="100" height="111" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="292" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">LN (NHWC)</text><text x="292" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">per token</text><path d="M342 201h9m-4-4 4 4-4 4" fill="none" stroke="#53676d" stroke-width="2"/><rect x="351" y="146" width="100" height="111" rx="10" fill="#f8e7d9" stroke="#c46b45" stroke-width="2"/><text x="401" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">Linear C→4C</text><text x="401" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">expanded</text><path d="M451 201h9m-4-4 4 4-4 4" fill="none" stroke="#53676d" stroke-width="2"/><rect x="460" y="146" width="100" height="111" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="510" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">GELU</text><text x="510" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">activation</text><path d="M560 201h9m-4-4 4 4-4 4" fill="none" stroke="#53676d" stroke-width="2"/><rect x="569" y="146" width="100" height="111" rx="10" fill="#f8e7d9" stroke="#c46b45" stroke-width="2"/><text x="619" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">Linear 4C→C</text><text x="619" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">projected</text><path d="M669 201h9m-4-4 4 4-4 4" fill="none" stroke="#53676d" stroke-width="2"/><rect x="678" y="146" width="100" height="111" rx="10" fill="#e9e5f5" stroke="#7461ba" stroke-width="2"/><text x="728" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">LayerScale</text><text x="728" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">γ·features</text><path d="M778 201h9m-4-4 4 4-4 4" fill="none" stroke="#53676d" stroke-width="2"/><rect x="787" y="146" width="100" height="111" rx="10" fill="#e9e5f5" stroke="#7461ba" stroke-width="2"/><text x="837" y="192" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#243338">⊕ 残差</text><text x="837" y="224" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#53676d">x + F(x)</text><path d="M74 145V98H838V145" stroke="#7461ba" stroke-width="3" fill="none" stroke-dasharray="8 5"/><g font-family="Arial,sans-serif" font-size="16" fill="#53676d"><text x="27" y="328">原始实现：深度卷积后交换到 NHWC 执行 LN 和逐位置 Linear，再回 NCHW。</text><text x="27" y="363">LayerScale 与训练期 stochastic depth 可参与主分支；此图简化 DropPath，不暗示每次都丢弃。</text></g></svg>