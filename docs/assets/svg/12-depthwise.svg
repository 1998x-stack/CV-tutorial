<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Depthwise与标准卷积的核参数差异</title><desc id="desc">在输入输出均为C=96、核大小为7时标准卷积含7乘7乘96乘96等于451584个核权重，depthwise卷积含7乘7乘96等于4704个核权重；后者独立处理每个输入通道，通道混合由pointwise层完成。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dae9e2"/><text x="27" y="47" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">Depthwise 的参数优势来自不混合通道</text><rect x="36" y="116" width="380" height="177" rx="13" fill="#f8e7dc" stroke="#c46b45" stroke-width="2"/><rect x="486" y="116" width="380" height="177" rx="13" fill="#e3f2eb" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="226" y="165" font-size="21" font-weight="700">普通 7×7 Conv</text><text x="226" y="216" font-size="26">451,584</text><text x="226" y="253" font-size="17">7×7×96×96 核权重</text><text x="676" y="165" font-size="21" font-weight="700">Depthwise 7×7</text><text x="676" y="216" font-size="26">4,704</text><text x="676" y="253" font-size="17">7×7×96，groups=96</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#53676d"><text x="36" y="342">在此相同通道数条件下，空间卷积核参数减少为普通卷积的 1/96。</text><text x="36" y="374">ConvNeXt 的 1×1 通道 MLP 也消耗大量参数和计算，不能据此说整个 block 缩小 96 倍。</text></g></svg>