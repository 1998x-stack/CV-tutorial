<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">ConvNeXt-T 的四阶段结构与空间尺寸</title><desc id="desc">4x4 stride4 patchify stem产生56x56x96，四阶段深度为3 3 9 3，通道96 192 384 768，空间分辨率56 28 14 7。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dae9e2"/><text x="26" y="45" font-size="23" font-family="Arial,sans-serif" fill="#243338" font-weight="700">ConvNeXt-T：空间减半，通道加倍，第三阶段更深</text><rect x="24" y="126" width="143" height="143" rx="11" fill="#e5f2ed" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><text x="95" y="175" font-size="18">Stem</text><text x="95" y="207" font-size="15">4×4 / s4</text><text x="95" y="241" font-size="16">56² × 96</text></g><rect x="192" y="113" width="158" height="177" rx="11" fill="#e6f2ed" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="271" y="159" font-size="18" font-weight="700">Stage 1</text><text x="271" y="193" font-size="20">3 blocks</text><text x="271" y="223" font-size="16">96 通道</text><text x="271" y="251" font-size="16">56×56</text></g><path d="M350 205h13m-6-6 6 6-6 6" stroke="#53676d" fill="none" stroke-width="2"/><rect x="365" y="113" width="158" height="156" rx="11" fill="#f9e8db" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="444" y="159" font-size="18" font-weight="700">Stage 2</text><text x="444" y="193" font-size="20">3 blocks</text><text x="444" y="223" font-size="16">192 通道</text><text x="444" y="251" font-size="16">28×28</text></g><path d="M523 205h13m-6-6 6 6-6 6" stroke="#53676d" fill="none" stroke-width="2"/><rect x="538" y="113" width="158" height="177" rx="11" fill="#e6f2ed" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="617" y="159" font-size="18" font-weight="700">Stage 3</text><text x="617" y="193" font-size="20">9 blocks</text><text x="617" y="223" font-size="16">384 通道</text><text x="617" y="251" font-size="16">14×14</text></g><path d="M696 205h13m-6-6 6 6-6 6" stroke="#53676d" fill="none" stroke-width="2"/><rect x="711" y="113" width="158" height="157" rx="11" fill="#f9e8db" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="790" y="159" font-size="18" font-weight="700">Stage 4</text><text x="790" y="193" font-size="20">3 blocks</text><text x="790" y="223" font-size="16">768 通道</text><text x="790" y="251" font-size="16">7×7</text></g><g font-family="Arial,sans-serif" fill="#53676d" font-size="16"><text x="26" y="337">stage 之间采用 2×2、stride=2 的下采样卷积（通常带 LN），输入 224×224。</text><text x="26" y="374">各阶段块的总数 18；不同 ConvNeXt 型号拥有不同通道宽度与块深度。</text></g></svg>