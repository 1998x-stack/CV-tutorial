<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">AdamW 的梯度更新与解耦权重衰减是两条不同分支</title><desc id="desc">梯度进入一阶二阶矩估计后形成自适应方向，另一支直接按lr乘weight_decay乘原权重衰减，二者在同一个更新式中共同影响参数。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e1"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">AdamW：自适应梯度与 decoupled decay 分开计算</text><rect x="41" y="127" width="245" height="155" rx="13" fill="#e5f2ec" stroke="#087b7c" stroke-width="2"/><rect x="327" y="127" width="245" height="155" rx="13" fill="#f6e7da" stroke="#c46b45" stroke-width="2"/><rect x="616" y="127" width="245" height="155" rx="13" fill="#e9e4f5" stroke="#7461ba" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="163" y="171" font-size="22" font-weight="700">gradient g</text><text x="163" y="211" font-size="17">moments m, v</text><text x="163" y="249" font-size="16">bias correction</text><text x="449" y="171" font-size="22" font-weight="700">Adam direction</text><text x="449" y="211" font-size="17">lr × m̂/(√v̂+ε)</text><text x="449" y="249" font-size="16">adaptive step</text><text x="738" y="171" font-size="22" font-weight="700">weight decay</text><text x="738" y="211" font-size="17">lr × λ × θ</text><text x="738" y="249" font-size="16">separate shrinkage</text></g><g stroke="#087b7c" stroke-width="3" fill="none"><path d="M286 207h40m-9-9 9 9-9 9"/></g><g font-family="Arial,sans-serif" fill="#53676d" font-size="18"><text x="35" y="343">θ 新值 = θ 旧值 − Adam 方向 − 解耦衰减项（忽略特殊 optimizer 选项）。</text><text x="35" y="376">bias/normalization 参数是否衰减是工程配置，而非 AdamW API 自动保证的通用规律。</text></g></svg>