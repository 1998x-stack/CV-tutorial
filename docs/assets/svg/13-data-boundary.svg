<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">训练数据与验证数据的处理路径必须分开</title><desc id="desc">训练集允许随机裁剪颜色增强mixup，验证集使用固定确定性变换且没有随机增强；均值方差仅使用训练数据拟合，评估不更新模型权重。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e1"/><text x="28" y="47" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#243338">训练策略和评估策略不是同一条数据流水线</text><rect x="31" y="89" width="404" height="274" rx="14" fill="#e7f4ed" stroke="#087b7c" stroke-width="2"/><rect x="464" y="89" width="404" height="274" rx="14" fill="#f9eade" stroke="#c46b45" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="20" fill="#243338" font-weight="700"><text x="51" y="126">Train split</text><text x="485" y="126">Validation split</text></g><g font-family="Arial,sans-serif" fill="#243338" font-size="19"><text x="50" y="172">随机裁剪 / 翻转 / 颜色</text><text x="50" y="217">可选 Mixup / CutMix</text><text x="50" y="261">训练集均值方差归一化</text><text x="50" y="307">参数更新：有</text><text x="483" y="172">确定性 resize / crop</text><text x="483" y="217">不使用训练随机混合增强</text><text x="483" y="261">使用训练时的归一化配置</text><text x="483" y="307">参数更新：无</text></g><text x="29" y="398" font-family="Arial,sans-serif" font-size="15" fill="#53676d">测试集的独立性与训练/验证切分单位同样重要；权重选择只基于约定的训练与验证协议。</text></svg>