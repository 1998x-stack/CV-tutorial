<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">学习率先线性预热再沿半余弦衰减</title><desc id="desc">横轴为20个优化器step，前4步线性从0增长到基础学习率，之后按半余弦从基础学习率降低至0，整条线连续且不越过基础学习率。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e1"/><text x="28" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#243338">Warmup + cosine：变化的是优化器步数，不是魔法公式</text><path d="M89 98v258h738" stroke="#53676d" stroke-width="2.5" fill="none"/><g font-family="Arial,sans-serif" fill="#53676d" font-size="16"><text x="33" y="109">base lr</text><text x="50" y="360">0</text><text x="89" y="382">step 0</text><text x="250" y="382">W=4</text><text x="767" y="382">T=20</text></g><path d="M89 332L237 119" stroke="#c46b45" stroke-width="5" fill="none"/><path d="M237.0 119.0 L246.2 119.1 L255.4 119.5 L264.7 120.2 L273.9 121.0 L283.1 122.2 L292.3 123.6 L301.5 125.2 L310.8 127.1 L320.0 129.2 L329.2 131.6 L338.4 134.2 L347.6 136.9 L356.8 140.0 L366.1 143.2 L375.3 146.6 L384.5 150.2 L393.7 154.0 L402.9 157.9 L412.2 162.1 L421.4 166.3 L430.6 170.7 L439.8 175.3 L449.0 180.0 L458.3 184.7 L467.5 189.6 L476.7 194.6 L485.9 199.6 L495.1 204.7 L504.3 209.9 L513.6 215.1 L522.8 220.3 L532.0 225.5 L541.2 230.7 L550.4 235.9 L559.7 241.1 L568.9 246.3 L578.1 251.4 L587.3 256.4 L596.5 261.4 L605.8 266.3 L615.0 271.0 L624.2 275.7 L633.4 280.3 L642.6 284.7 L651.8 288.9 L661.1 293.1 L670.3 297.0 L679.5 300.8 L688.7 304.4 L697.9 307.8 L707.2 311.0 L716.4 314.1 L725.6 316.8 L734.8 319.4 L744.0 321.8 L753.3 323.9 L762.5 325.8 L771.7 327.4 L780.9 328.8 L790.1 330.0 L799.3 330.8 L808.6 331.5 L817.8 331.9 L827.0 332.0" stroke="#087b7c" stroke-width="5" fill="none"/><path d="M237 106v250" stroke="#7461ba" stroke-dasharray="7 6" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="18" fill="#243338"><text x="118" y="189">线性预热</text><text x="486" y="169">半余弦下降</text><text x="350" y="279" fill="#53676d" font-size="15">实际调度需清楚约定 step 在更新前还是更新后调用</text></g></svg>