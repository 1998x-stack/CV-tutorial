<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">高置信度但低准确率意味着过度自信</title><desc id="desc">在合成数据两组样本中，低置信组平均confidence=0.6、accuracy=0.5；高置信组平均confidence=0.9、accuracy=0.6；偏离校准对角线。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dae8e2"/><text x="28" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">准确率相同，不代表概率同样可信</text><path d="M115 87v262h650" stroke="#53676d" stroke-width="2.5" fill="none"/><path d="M115 349L765 87" stroke="#087b7c" stroke-width="3" stroke-dasharray="8 7" fill="none"/><g font-family="Arial,sans-serif" fill="#53676d" font-size="17"><text x="31" y="91">准确率 ↑</text><text x="626" y="392">平均 confidence →</text><text x="125" y="376">0</text><text x="745" y="375">1</text></g><circle cx="505" cy="218" r="12" fill="#c46b45"/><circle cx="700" cy="192" r="12" fill="#c46b45"/><g font-family="Arial,sans-serif" font-size="17" fill="#243338"><text x="356" y="201">bin A：0.6 → 0.5</text><text x="545" y="180">bin B：0.9 → 0.6</text><text x="275" y="318" font-size="16" fill="#53676d">虚线表示理想校准：confidence = accuracy</text></g></svg>