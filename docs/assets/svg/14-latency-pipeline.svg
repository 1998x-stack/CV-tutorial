<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">端到端推理延迟由解码预处理传输网络后处理组成</title><desc id="desc">图像解码、resize与normalize、host to device传输、神经网络推理、后处理、结果导出均占时间；不同测试口径可能只测神经网络forward，不可直接比较。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dae8e2"/><text x="26" y="46" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">“一次推理多久”取决于起止点</text><rect x="26" y="137" width="134" height="132" rx="11" fill="#e5f3eb" stroke="#087b7c" stroke-width="2"/><text x="93" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">输入解码</text><text x="93" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#53676d">I/O</text><path d="M160 203h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="172" y="137" width="134" height="132" rx="11" fill="#e9e5f5" stroke="#7461ba" stroke-width="2"/><text x="239" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">resize / norm</text><text x="239" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#53676d">CPU/GPU</text><path d="M306 203h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="318" y="137" width="134" height="132" rx="11" fill="#e5f3eb" stroke="#087b7c" stroke-width="2"/><text x="385" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">数据搬运</text><text x="385" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#53676d">H2D</text><path d="M452 203h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="464" y="137" width="134" height="132" rx="11" fill="#f8e7da" stroke="#c46b45" stroke-width="2"/><text x="531" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">model forward</text><text x="531" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#53676d">算子</text><path d="M598 203h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="610" y="137" width="134" height="132" rx="11" fill="#e5f3eb" stroke="#087b7c" stroke-width="2"/><text x="677" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">后处理</text><text x="677" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#53676d">NMS/softmax</text><path d="M744 203h10m-5-5 5 5-5 5" stroke="#53676d" stroke-width="2" fill="none"/><rect x="756" y="137" width="134" height="132" rx="11" fill="#e9e5f5" stroke="#7461ba" stroke-width="2"/><text x="823" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">结果输出</text><text x="823" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#53676d">D2H/UI</text><path d="M27 110v-24h847v24" stroke="#c46b45" stroke-width="3" fill="none"/><text x="450" y="75" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#c46b45">端到端 latency：通常包括更多阶段</text><text x="30" y="351" font-family="Arial,sans-serif" font-size="16" fill="#53676d">GPU 计时需先 warmup 并在测量边界同步；报告 p50/p95、batch、shape 与设备。</text></svg>