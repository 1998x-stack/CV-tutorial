<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">MAC与FLOP计数口径可以差一倍</title><desc id="desc">单次乘累加MAC通常对应一次乘法与一次加法，若把两个都算作浮点运算则约两FLOPs；卷积还可能有bias和激活等其它操作。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dae8e2"/><text x="29" y="47" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">比算力前，先统一 MAC 与 FLOP 的单位</text><rect x="44" y="119" width="258" height="177" rx="13" fill="#e8f4ed" stroke="#087b7c" stroke-width="2"/><rect x="361" y="119" width="242" height="177" rx="13" fill="#f8e8db" stroke="#c46b45" stroke-width="2"/><rect x="661" y="119" width="194" height="177" rx="13" fill="#eae5f4" stroke="#7461ba" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><text x="173" y="167" font-size="23">1 MAC</text><text x="173" y="205" font-size="16">y += a × b</text><text x="173" y="247" font-size="15">一乘累加</text><text x="482" y="167" font-size="23">约 2 FLOPs</text><text x="482" y="205" font-size="16">乘法 + 加法</text><text x="482" y="247" font-size="15">按单独算子计</text><text x="758" y="167" font-size="22">Latency</text><text x="758" y="205" font-size="16">真实测时</text><text x="758" y="247" font-size="15">不能据 FLOPs 推断</text></g><g stroke="#087b7c" stroke-width="3" fill="none"><path d="M304 206h55m-10-9 10 9-10 9M605 206h54m-10-9 10 9-10 9"/></g><g font-family="Arial,sans-serif" fill="#53676d" font-size="16"><text x="37" y="348">不同文献/工具对融合 multiply-add 的计数约定可能不同；记录软件及算子范围。</text><text x="37" y="380">参数量、实际显存、吞吐率、端到端延迟不是同一个指标。</text></g></svg>