<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">四个虚构模型在精度与延迟之间的帕累托前沿</title><desc id="desc">横轴延迟越小越好，纵轴准确率越高越好。toy A坐标5ms85%，B坐标3ms82%，C坐标8ms80%，D坐标12ms89%；C 被 A 与 B 支配。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dae8e2"/><text x="27" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">不是最高准确率胜出，而是先明确系统约束</text><path d="M107 85v260h707" stroke="#53676d" stroke-width="3" fill="none"/><g font-family="Arial,sans-serif" font-size="16" fill="#53676d"><text x="14" y="93">准确率 ↑</text><text x="710" y="383">延迟 (ms) →</text><text x="105" y="365">0</text><text x="265" y="365">3</text><text x="360" y="365">5</text><text x="540" y="365">8</text><text x="753" y="365">12</text></g><g fill="none" stroke="#087b7c" stroke-width="3" stroke-dasharray="8 6"><path d="M265 215L360 172L753 102"/></g><circle cx="265" cy="215" r="10" fill="#087b7c"/><text x="279" y="201" font-size="18" fill="#243338" font-family="Arial,sans-serif">B · 82%</text><circle cx="360" cy="172" r="10" fill="#087b7c"/><text x="374" y="158" font-size="18" fill="#243338" font-family="Arial,sans-serif">A · 85%</text><circle cx="540" cy="260" r="10" fill="#c46b45"/><text x="554" y="246" font-size="18" fill="#243338" font-family="Arial,sans-serif">C · 80%</text><circle cx="753" cy="102" r="10" fill="#087b7c"/><text x="767" y="88" font-size="18" fill="#243338" font-family="Arial,sans-serif">D · 89%</text><text x="454" y="302" font-family="Arial,sans-serif" font-size="16" fill="#c46b45">C 同时更慢且准确率更低</text><text x="29" y="399" font-family="Arial,sans-serif" font-size="15" fill="#53676d">纯教学示例，不是 AlexNet / ResNet / ViT / ConvNeXt 的历史性能数据。</text></svg>