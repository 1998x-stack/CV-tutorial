<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">AP在指定IoU阈值下先排序检测分数再沿recall-precision汇总</title><desc id="desc">示例PR曲线从高precision、低recall到低precision高recall，示意11个recall参考点；COCO用101个recall点并在十个IoU阈值上平均，而非把IoU平均后再阈值。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">AP：先定义匹配，再沿 recall 汇总 precision</text><path d="M96 83v274h684" stroke="#53676d" stroke-width="2.5" fill="none"/><g stroke="#d4e2da" stroke-width="1"><path d="M158 83v274"/><path d="M220 83v274"/><path d="M282 83v274"/><path d="M344 83v274"/><path d="M406 83v274"/><path d="M468 83v274"/><path d="M530 83v274"/><path d="M592 83v274"/><path d="M654 83v274"/><path d="M716 83v274"/></g><path d="M96 102H211V124H323V162H447V207H553V265H691V316H779" fill="none" stroke="#087b7c" stroke-width="4"/><path d="M96 102H211V124H323V162H447V207H553V265H691V316H779V357H96Z" fill="#d6ebe1" opacity=".58"/><g font-family="Arial,sans-serif" fill="#53676d" font-size="16"><text x="15" y="95">precision ↑</text><text x="700" y="393">recall →</text><text x="101" y="378">0</text><text x="754" y="378">1</text><text x="277" y="303">虚构 PR 曲线（非真实 AP）</text></g></svg>