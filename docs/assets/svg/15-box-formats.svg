<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">边界框三种格式在同一个坐标系中互相转换</title><desc id="desc">宽度400高度300的图片里box的左上角为40 50，右下角为200 210，xywh为40 50 160 160，cxcywh为120 130 160 160。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="30" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">坐标的定义比算法名字更先决定计算是否正确</text><rect x="34" y="91" width="429" height="276" rx="12" fill="#e5f2eb" stroke="#087b7c" stroke-width="2"/><rect x="90" y="136" width="228" height="185" fill="#f9e4d7" stroke="#c46b45" stroke-width="3"/><path d="M204 136v185 M90 228h228" stroke="#7461ba" stroke-dasharray="6 6" stroke-width="2"/><circle cx="204" cy="228" r="7" fill="#7461ba"/><g font-family="Arial,sans-serif" font-size="16" fill="#243338"><text x="76" y="122">(40,50)</text><text x="318" y="343">(200,210)</text><text x="210" y="212">center</text><text x="44" y="387" fill="#53676d">示意：xyxy 使用连续坐标，面积宽高为坐标差。</text></g><g font-family="Arial,sans-serif" fill="#243338" font-size="19"><text x="503" y="136">xyxy  = (40, 50, 200, 210)</text><text x="503" y="190">xywh  = (40, 50, 160, 160)</text><text x="503" y="244">cxcywh = (120, 130, 160, 160)</text><text x="503" y="302" font-size="16" fill="#53676d">归一化版本需除以对应图像宽高</text><text x="503" y="333" font-size="16" fill="#53676d">并记录 resize、padding、坐标系变换</text></g></svg>