<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Greedy NMS依照分数保留最高框并抑制过度重叠框</title><desc id="desc">先按同一类别得分排序A0.95 B0.90 C0.80，A与B的IoU大于阈值0.5，抑制B；C与A不重叠保留C，最终保留A和C。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">同类框排序 → 保留最高分 → 抑制高 IoU 重复框</text><g fill="none" stroke-width="3"><rect x="59" y="102" width="245" height="196" stroke="#087b7c"/><rect x="103" y="133" width="241" height="193" stroke="#c46b45"/><rect x="378" y="151" width="150" height="128" stroke="#7461ba"/></g><g font-size="18" font-family="Arial,sans-serif"><text x="64" y="91" fill="#087b7c">A: 0.95</text><text x="242" y="344" fill="#c46b45">B: 0.90 (删)</text><text x="380" y="143" fill="#7461ba">C: 0.80</text></g><rect x="567" y="113" width="290" height="213" rx="13" fill="#e7f3ee" stroke="#087b7c"/><g font-family="Arial,sans-serif" fill="#243338" font-size="18"><text x="590" y="152">1. A 得分最高 → 保留</text><text x="590" y="197">2. IoU(A,B) &gt; 0.5</text><text x="610" y="225">→ 移除 B</text><text x="590" y="266">3. C 不重叠 → 保留</text><text x="590" y="305" font-weight="700">结果：{A, C}</text></g><text x="29" y="388" font-family="Arial,sans-serif" font-size="16" fill="#53676d">这是同类别 greedy NMS；跨类别抑制、score tie 及 soft-NMS 需要不同约定。</text></svg>