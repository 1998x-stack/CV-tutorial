<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">两矩形IoU等于交集面积除以并集面积</title><desc id="desc">A为从0到4的方框面积16，B为从2到6的方框面积16，交集从2到4面积4，并集28，IoU=1/7。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="30" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">IoU 匹配的是重叠程度，不是分类信心</text><rect x="73" y="94" width="209" height="209" fill="#dbeee5" stroke="#087b7c" stroke-width="3"/><rect x="176" y="197" width="209" height="209" fill="#f6dfcf" fill-opacity=".75" stroke="#c46b45" stroke-width="3"/><rect x="176" y="197" width="106" height="106" fill="#b5a7d9" fill-opacity=".78" stroke="#7461ba" stroke-width="2"/><g font-size="18" font-family="Arial,sans-serif" fill="#243338"><text x="83" y="120">A</text><text x="351" y="383">B</text><text x="203" y="254">交集</text><text x="475" y="135">面积 A = 4×4 = 16</text><text x="475" y="191">面积 B = 4×4 = 16</text><text x="475" y="248">交集 = 2×2 = 4</text><text x="475" y="307">IoU = 4 / (16+16−4)</text><text x="475" y="350" font-size="25" font-weight="700" fill="#087b7c">= 1/7 ≈ 0.143</text></g></svg>