<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">R-CNN repeats CNN inference for each candidate region</title><desc id="desc">Each of N proposals runs the same CNN independently. The total image feature extraction cost scales approximately with N times per crop CNN cost, ignoring proposal and SVM costs.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="27" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">重复计算：同一张图，很多次 CNN 前向</text><rect x="35" y="117" width="155" height="75" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="112" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#243338">同一图像 I</text><path d="M190 154H235V104H277" stroke="#c46b45" stroke-width="2.5" fill="none"/><rect x="280" y="76" width="175" height="54" rx="9" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="367" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">CNN proposal 1</text><path d="M455 103h35" stroke="#53676d" stroke-width="2" fill="none"/><path d="M190 154H235V181H277" stroke="#c46b45" stroke-width="2.5" fill="none"/><rect x="280" y="153" width="175" height="54" rx="9" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="367" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">CNN proposal 2</text><path d="M455 180h35" stroke="#53676d" stroke-width="2" fill="none"/><path d="M190 154H235V258H277" stroke="#c46b45" stroke-width="2.5" fill="none"/><rect x="280" y="230" width="175" height="54" rx="9" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="367" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">CNN proposal 3</text><path d="M455 257h35" stroke="#53676d" stroke-width="2" fill="none"/><path d="M190 154H235V335H277" stroke="#c46b45" stroke-width="2.5" fill="none"/><rect x="280" y="307" width="175" height="54" rx="9" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="367" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">CNN proposal 4</text><path d="M455 334h35" stroke="#53676d" stroke-width="2" fill="none"/><g font-family="Arial,sans-serif" fill="#243338"><rect x="520" y="108" width="335" height="190" rx="13" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="687" y="155" text-anchor="middle" font-size="21" font-weight="700">N 次独立特征提取</text><text x="687" y="201" text-anchor="middle" font-size="18">N × C_CNN</text><text x="687" y="245" text-anchor="middle" font-size="16">训练还需保存 proposal 特征</text></g><text x="27" y="365" font-family="Arial,sans-serif" font-size="16" fill="#53676d">Fast R-CNN 的改进：整图只做一次 backbone 卷积，再从共享 feature map 池化每个 RoI。</text></svg>