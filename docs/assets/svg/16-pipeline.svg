<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">R-CNN region proposal to category-specific detection</title><desc id="desc">Image enters Selective Search, around 2000 candidate regions are warped to 227 square and each independently passes through CNN to 4096 dimensional features; per-class linear SVM and box regressor then NMS.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="27" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">每个 proposal 都要走一遍 CNN</text><rect x="20" y="135" width="100" height="125" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="70" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#243338">输入图像</text><text x="70" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">RGB</text><path d="M120 198h9m-5-5 5 5-5 5" fill="none" stroke="#53676d" stroke-width="2"/><rect x="130" y="135" width="100" height="125" rx="10" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="180" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243338">Selective Search</text><text x="180" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">CPU proposals</text><path d="M230 198h9m-5-5 5 5-5 5" fill="none" stroke="#53676d" stroke-width="2"/><rect x="240" y="135" width="100" height="125" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="290" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243338">约 2,000 proposals</text><text x="290" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">class agnostic</text><path d="M340 198h9m-5-5 5 5-5 5" fill="none" stroke="#53676d" stroke-width="2"/><rect x="350" y="135" width="100" height="125" rx="10" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="400" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#243338">Warp 227×227</text><text x="400" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">fixed size</text><path d="M450 198h9m-5-5 5 5-5 5" fill="none" stroke="#53676d" stroke-width="2"/><rect x="460" y="135" width="100" height="125" rx="10" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="510" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#243338">CNN × N</text><text x="510" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">per region</text><path d="M560 198h9m-5-5 5 5-5 5" fill="none" stroke="#53676d" stroke-width="2"/><rect x="570" y="135" width="100" height="125" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="620" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243338">4096-D features</text><text x="620" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">per region</text><path d="M670 198h9m-5-5 5 5-5 5" fill="none" stroke="#53676d" stroke-width="2"/><rect x="680" y="135" width="100" height="125" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="730" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243338">SVM + box reg.</text><text x="730" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">per class</text><path d="M780 198h9m-5-5 5 5-5 5" fill="none" stroke="#53676d" stroke-width="2"/><rect x="790" y="135" width="100" height="125" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="840" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#243338">NMS 输出</text><text x="840" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53676d">deduplicate</text><text x="26" y="330" font-family="Arial,sans-serif" font-size="17" fill="#53676d">关键：卷积特征没有在不同 proposal 之间共享。</text><text x="26" y="365" font-family="Arial,sans-serif" font-size="16" fill="#53676d">“约 2,000”是 R-CNN 论文使用 Selective Search fast mode 的实验量级。</text></svg>