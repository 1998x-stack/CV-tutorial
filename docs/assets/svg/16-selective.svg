<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Selective Search hierarchical superpixel grouping</title><desc id="desc">Image is oversegmented into superpixels; adjacent regions iteratively merge according to color, texture, size and fill similarity, yielding region candidates at multiple scales.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="27" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">候选框从局部区域逐步长成更大的区域</text><rect x="40" y="100" width="220" height="200" rx="12" fill="#e8f3ed" stroke="#087b7c" stroke-width="2"/><g stroke="#fffdfa" stroke-width="4"><path d="M150 100v200M40 200h220M95 100v100M205 200v100M40 150h55M150 250h55"/></g><g font-family="Arial,sans-serif" fill="#243338" font-size="16"><text x="44" y="326">① 超像素</text></g><path d="M278 200h65m-10-8 10 8-10 8" stroke="#c46b45" stroke-width="3" fill="none"/><rect x="367" y="100" width="220" height="200" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><g stroke="#fffdfa" stroke-width="4"><path d="M477 100v200M367 200h220M422 100v100M532 200v100"/></g><rect x="367" y="100" width="110" height="100" fill="none" stroke="#7461ba" stroke-width="4"/><rect x="367" y="100" width="220" height="200" fill="none" stroke="#7461ba" stroke-width="2" stroke-dasharray="8 6"/><text x="370" y="326" font-family="Arial,sans-serif" font-size="16" fill="#243338">② 按相似度合并</text><path d="M605 200h65m-10-8 10 8-10 8" stroke="#087b7c" stroke-width="3" fill="none"/><g font-family="Arial,sans-serif" fill="#243338"><rect x="694" y="110" width="160" height="75" rx="10" fill="#e6f2ec" stroke="#087b7c" stroke-width="2"/><rect x="694" y="210" width="160" height="75" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="774" y="154" text-anchor="middle" font-size="18">小 / 中区域</text><text x="774" y="254" text-anchor="middle" font-size="18">大区域候选</text><text x="28" y="385" font-size="16" fill="#53676d">合并依据是手工设计的区域相似度，不是 CNN 学出的类别概率。</text></g></svg>