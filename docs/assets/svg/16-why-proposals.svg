<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="wp-title wp-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="wp-title">滑动窗口与候选区域两种搜索方式的对比</title>
<desc id="wp-desc">左图在图像上以多尺度滑动窗口穷举位置，窗口数量巨大；右图只评估 Selective Search 生成的少量候选框，算力集中在可能含物体的区域。</desc>
<rect width="900" height="420" fill="#fffdf9"/>
<g>
<text x="45" y="44" font-size="22" font-weight="700" fill="#203035">滑动窗口：穷举位置 × 尺度</text>
<rect x="45" y="64" width="360" height="280" rx="12" fill="#eef3f2" stroke="#53676d"/>
<g stroke="#d06d4d" fill="none" stroke-width="2" opacity="0.75">
<path d="M45 134h360M45 204h360M45 274h360M135 64v280M225 64v280M315 64v280"/>
</g>
<rect x="102" y="150" width="90" height="90" fill="#ffecd9" stroke="#d06d4d" stroke-width="3"/>
<text x="147" y="204" font-size="18" text-anchor="middle" fill="#8a4526">逐窗分类</text>
<text x="45" y="378" font-size="19" fill="#53676d">窗口数随尺度数平方增长</text>
</g>
<g>
<text x="495" y="44" font-size="22" font-weight="700" fill="#203035">候选区域：只评估少量区域</text>
<rect x="495" y="64" width="360" height="280" rx="12" fill="#eef3f2" stroke="#53676d"/>
<g fill="#d6f1eb" stroke="#147f80" stroke-width="2.5">
<rect x="540" y="110" width="150" height="120"/>
<rect x="620" y="180" width="170" height="120"/>
<rect x="540" y="240" width="100" height="80"/>
</g>
<text x="615" y="176" font-size="18" text-anchor="middle" fill="#0f5f60">约 2000 区域</text>
<text x="495" y="378" font-size="19" fill="#53676d">算力集中在有内容的区域</text>
</g>
</svg>
