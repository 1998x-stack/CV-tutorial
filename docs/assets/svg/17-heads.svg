<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Fast R-CNN shared RoI representation feeds classification and localization branches</title><desc id="desc">RoI pooled tensor passes through shared fully connected layers then two sibling outputs: K+1 softmax and K class-specific 4-d box offsets. Localization loss is disabled for background class.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">一个 RoI 表征，两种互补监督</text><rect x="36" y="150" width="175" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="123" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">RoI feature</text><text x="123" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#53676d">C×7×7</text><path d="M211 200h50m-9-8 9 8-9 8" stroke="#c46b45" stroke-width="3" fill="none"/><rect x="264" y="150" width="170" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="349" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">Shared FC</text><text x="349" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#53676d">feature vector</text><path d="M434 200H480V118H524M480 200V285H524" stroke="#7461ba" stroke-width="3" fill="none"/><rect x="525" y="83" width="310" height="77" rx="11" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><rect x="525" y="246" width="310" height="77" rx="11" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><text x="680" y="116" font-size="19" font-weight="700">分类：K+1 logits</text><text x="680" y="141" font-size="15">前景类别 + background</text><text x="680" y="278" font-size="19" font-weight="700">回归：K × 4 offsets</text><text x="680" y="303" font-size="15">每个前景类一个框修正</text></g><text x="28" y="375" font-family="Arial,sans-serif" font-size="16" fill="#53676d">background RoI 参与分类损失，不参与框回归损失。</text></svg>