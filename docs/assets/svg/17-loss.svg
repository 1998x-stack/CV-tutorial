<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Fast R-CNN 分类与定位损失的前景门控</title><desc id="desc">所有RoI参与K加1分类交叉熵，只有前景RoI参与Smooth L1框回归。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dce8e4"/><text x="28" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#203035">分类看所有 RoI，定位只看前景 RoI</text><rect x="42" y="115" width="210" height="180" rx="12" fill="#e4f2eb" stroke="#147f80" stroke-width="2"/><text x="147" y="157" text-anchor="middle" font-size="20" fill="#203035" font-family="Arial,sans-serif">RoI batch</text><rect x="70" y="183" width="64" height="56" rx="7" fill="#f8e7da" stroke="#c46b45"/><rect x="158" y="183" width="64" height="56" rx="7" fill="#eae6f5" stroke="#7461ba"/><text x="102" y="216" text-anchor="middle" font-size="15" fill="#203035" font-family="Arial,sans-serif">cat</text><text x="190" y="216" text-anchor="middle" font-size="15" fill="#203035" font-family="Arial,sans-serif">bg</text><path d="M254 205h45m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="305" y="115" width="235" height="180" rx="12" fill="#fff7ee" stroke="#c46b45" stroke-width="2"/><text x="422" y="157" text-anchor="middle" font-size="20" fill="#203035" font-family="Arial,sans-serif">Classification</text><text x="422" y="207" text-anchor="middle" font-size="17" fill="#53676d" font-family="Arial,sans-serif">K+1 softmax</text><text x="422" y="254" text-anchor="middle" font-size="16" fill="#147f80" font-family="Arial,sans-serif">foreground + bg</text><path d="M254 240h45m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="588" y="115" width="267" height="180" rx="12" fill="#eae6f5" stroke="#7461ba" stroke-width="2"/><text x="721" y="157" text-anchor="middle" font-size="20" fill="#203035" font-family="Arial,sans-serif">Box regression</text><text x="721" y="207" text-anchor="middle" font-size="17" fill="#53676d" font-family="Arial,sans-serif">class-specific 4 offsets</text><text x="721" y="254" text-anchor="middle" font-size="16" fill="#c46b45" font-family="Arial,sans-serif">foreground only</text><text x="28" y="362" font-size="16" fill="#53676d" font-family="Arial,sans-serif">Background 没有匹配的物体框，因此框回归损失被 u≥1 的指示函数关闭。</text></svg>