<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">RoI Pooling divides a region into bins and max pools each channel</title><desc id="desc">A 4x4 feature ROI is split into four 2x2 bins; each bin independently takes a maximum, producing 2x2 pooled output.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">固定网格：4×4 RoI → 2×2 输出</text><g transform="translate(65 102)"><rect width="280" height="280" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><path d="M70 0v280M0 70h280" stroke="#fffdfa" stroke-width="4"/><path d="M140 0v280M0 140h280" stroke="#fffdfa" stroke-width="4"/><path d="M210 0v280M0 210h280" stroke="#fffdfa" stroke-width="4"/><text x="35" y="54" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#243338">6</text><text x="175" y="54" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#243338">8</text><text x="35" y="194" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#243338">14</text><text x="175" y="194" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#243338">16</text><path d="M140 0v280M0 140h280" stroke="#c46b45" stroke-width="3" stroke-dasharray="7 5"/></g><path d="M374 242h94m-10-8 10 8-10 8" stroke="#c46b45" stroke-width="3" fill="none"/><g transform="translate(500 151)"><rect width="210" height="210" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><path d="M105 0v210M0 105h210" stroke="#fffdfa" stroke-width="4"/><g font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#243338"><text x="52" y="67">6</text><text x="157" y="67">8</text><text x="52" y="172">14</text><text x="157" y="172">16</text></g></g><text x="28" y="398" font-family="Arial,sans-serif" font-size="15" fill="#53676d">示意单通道；实际对每个 feature channel 分别 max-pool，输出 C×2×2。</text></svg>