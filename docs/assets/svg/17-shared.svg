<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Fast R-CNN computes one shared convolutional feature map</title><desc id="desc">Image passes once through convolutional backbone; multiple region proposals are projected onto shared feature map; each ROI uses pooling and same detection head.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="26" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">卷积只算一次，RoI 特征按候选区域读取</text><rect x="30" y="140" width="140" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="100" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">整图 I</text><path d="M170 190h38m-8-8 8 8-8 8" stroke="#c46b45" stroke-width="3" fill="none"/><rect x="211" y="115" width="165" height="150" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="293" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">CNN backbone</text><text x="293" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#53676d">一次前向</text><path d="M376 190h37m-8-8 8 8-8 8" stroke="#087b7c" stroke-width="3" fill="none"/><rect x="416" y="103" width="170" height="174" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="501" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">共享 feature map</text><g fill="none" stroke="#7461ba" stroke-width="3"><rect x="440" y="171" width="65" height="57"/><rect x="476" y="195" width="83" height="55"/></g><path d="M586 150H620V112H645M586 190H620V190H645M586 232H620V268H645" stroke="#7461ba" stroke-width="2" fill="none"/><g font-family="Arial,sans-serif" fill="#243338"><rect x="646" y="85" width="205" height="60" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><rect x="646" y="160" width="205" height="60" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><rect x="646" y="235" width="205" height="60" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="748" y="122" text-anchor="middle" font-size="17">RoI 1 → head</text><text x="748" y="197" text-anchor="middle" font-size="17">RoI 2 → head</text><text x="748" y="272" text-anchor="middle" font-size="17">RoI N → head</text></g><text x="27" y="355" font-family="Arial,sans-serif" font-size="16" fill="#53676d">候选区域仍需外部提供；节省的是每个 proposal 重复执行 backbone 的成本。</text></svg>