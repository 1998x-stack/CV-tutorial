<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Nine Faster R-CNN anchors at one feature-map position</title><desc id="desc">Three anchor scales and three aspect ratios centered at one feature-map location; large square, tall, wide anchors at each scale.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="27" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">一个位置的 3×3 anchor 组合</text><path d="M450 75v270M315 210h270" stroke="#53676d" stroke-dasharray="6 6" stroke-width="2"/><circle cx="450" cy="210" r="5" fill="#243338"/><g fill="none" stroke-width="3"><rect x="390" y="150" width="120" height="120" stroke="#087b7c"/><rect x="390" y="110" width="120" height="200" stroke="#c46b45"/><rect x="350" y="150" width="200" height="120" stroke="#7461ba"/><rect x="405" y="165" width="90" height="90" stroke="#087b7c"/><rect x="405" y="135" width="90" height="150" stroke="#c46b45"/><rect x="375" y="165" width="150" height="90" stroke="#7461ba"/><rect x="425" y="185" width="50" height="50" stroke="#087b7c"/><rect x="425" y="175" width="50" height="70" stroke="#c46b45"/><rect x="415" y="185" width="70" height="50" stroke="#7461ba"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#243338"><text x="33" y="122">3 scales</text><text x="33" y="152">128 / 256 / 512</text><text x="33" y="182">box area = s²</text><text x="670" y="122">3 ratios</text><text x="670" y="152">1:2 / 1:1 / 2:1</text><text x="670" y="182">w/h = r</text><text x="27" y="385" font-size="15" fill="#53676d">颜色只用于区分同尺度下的形状族；示意图未按真实 anchor 像素比例绘制。</text></g></svg>