<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Faster R-CNN shared backbone RPN and Fast R-CNN detector</title><desc id="desc">Backbone produces shared feature map; RPN sliding window predicts objectness and box deltas relative to anchors; proposals filtered with NMS; RoI pooling and detection head output class and refined boxes.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">共享特征图同时喂给 proposal 与 detection</text><rect x="25" y="143" width="120" height="90" rx="11" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="85" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">Image</text><path d="M145 188h26m-8-8 8 8-8 8" stroke="#c46b45" stroke-width="3" fill="none"/><rect x="173" y="120" width="145" height="136" rx="11" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="245" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">Backbone</text><text x="245" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#53676d">shared conv</text><path d="M318 188h28" stroke="#087b7c" stroke-width="3" fill="none"/><rect x="347" y="105" width="170" height="165" rx="11" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="432" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">Feature map</text><text x="432" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#53676d">H×W×C</text><path d="M517 150H550V113H582M517 225H550V276H582" stroke="#7461ba" stroke-width="3" fill="none"/><rect x="583" y="82" width="135" height="65" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="650" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">RPN</text><rect x="583" y="245" width="135" height="65" rx="10" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="650" y="284" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">RoI head</text><path d="M718 114h30v162h-30" stroke="#087b7c" stroke-width="2.5" fill="none"/><rect x="751" y="151" width="126" height="88" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="814" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#243338">proposals</text><text x="814" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#53676d">NMS</text><path d="M814 239v54H720" stroke="#087b7c" stroke-width="2.5" fill="none"/><text x="27" y="360" font-family="Arial,sans-serif" font-size="16" fill="#53676d">RPN 与检测头共享 backbone 参数；RPN 的 objectness 不是最终类别预测。</text></svg>