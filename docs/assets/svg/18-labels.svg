<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">RPN anchor labels use positive negative and ignore IoU bands</title><desc id="desc">Anchors with max IoU greater than 0.7 are positive; those below 0.3 for all ground truths are negative; between thresholds are ignored; each ground truth highest overlap anchor is also positive.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">RPN 训练标签：两端监督，中间忽略</text><path d="M90 202h720" stroke="#53676d" stroke-width="3"/><rect x="90" y="151" width="216" height="102" rx="10" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><rect x="306" y="151" width="288" height="102" rx="10" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><rect x="594" y="151" width="216" height="102" rx="10" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="198" y="190" font-size="21" font-weight="700">Negative</text><text x="198" y="223" font-size="18">IoU &lt; 0.3</text><text x="450" y="190" font-size="21" font-weight="700">Ignore</text><text x="450" y="223" font-size="18">0.3–0.7</text><text x="702" y="190" font-size="21" font-weight="700">Positive</text><text x="702" y="223" font-size="18">IoU &gt; 0.7</text></g><path d="M306 130v-20m288 20v-20" stroke="#53676d" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#53676d" font-size="16"><text x="90" y="285">对所有 GT 都低</text><text x="594" y="285">任一 GT 足够高</text><text x="90" y="335">额外规则：每个 GT 的最高 IoU anchor 也标为正样本，即使其 IoU 未达到 0.7。</text><text x="90" y="370">每张图随机采样 256 anchors，正负最多 1:1；越界 anchor 在训练时忽略。</text></g></svg>