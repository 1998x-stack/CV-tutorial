<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="pd-title pd-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="pd-title">两阶段与单阶段检测流程对比</title>
<desc id="pd-desc">上排两阶段：主干提取特征，RPN 从密集位置粗筛出少量候选，再在候选上做精细分类与回归；下排单阶段：主干一次前向就在多尺度密集位置上直接预测框与类别，没有独立候选阶段。</desc>
<rect width="900" height="420" fill="#fffdf9"/>
<text x="45" y="42" font-size="21" font-weight="700" fill="#203035">两阶段</text>
<g font-size="17" text-anchor="middle" fill="#203035">
<rect x="40" y="60" width="130" height="70" rx="10" fill="#d6f1eb" stroke="#147f80" stroke-width="2.5"/><text x="105" y="102">主干特征</text>
<rect x="230" y="60" width="150" height="70" rx="10" fill="#ebe5ff" stroke="#7461ba" stroke-width="2.5"/><text x="305" y="94">RPN 粗筛</text><text x="305" y="116" font-size="14" fill="#6b57a8">几万 → 几百</text>
<rect x="440" y="60" width="170" height="70" rx="10" fill="#ffecd9" stroke="#d06d4d" stroke-width="2.5"/><text x="525" y="94">候选上分类回归</text><text x="525" y="116" font-size="14" fill="#8a4526">正负较平衡</text>
</g>
<g stroke="#147f80" stroke-width="4" fill="none" marker-end="url(#pd-ah)"><path d="M170 95H226"/><path d="M380 95H436"/></g>
<text x="45" y="212" font-size="21" font-weight="700" fill="#203035">单阶段</text>
<g font-size="17" text-anchor="middle" fill="#203035">
<rect x="40" y="230" width="130" height="70" rx="10" fill="#d6f1eb" stroke="#147f80" stroke-width="2.5"/><text x="105" y="272">主干特征</text>
<rect x="230" y="230" width="190" height="70" rx="10" fill="#ffecd9" stroke="#d06d4d" stroke-width="2.5"/><text x="325" y="264">多尺度密集预测</text><text x="325" y="286" font-size="14" fill="#8a4526">每个位置直接出框</text>
<rect x="480" y="230" width="150" height="70" rx="10" fill="#ebe5ff" stroke="#7461ba" stroke-width="2.5"/><text x="555" y="264">得分 / NMS</text><text x="555" y="286" font-size="14" fill="#6b57a8">正负极不平衡</text>
</g>
<g stroke="#147f80" stroke-width="4" fill="none" marker-end="url(#pd-ah)"><path d="M170 265H226"/><path d="M420 265H476"/></g>
<defs><marker id="pd-ah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs>
<text x="450" y="392" font-size="17" text-anchor="middle" fill="#53676d">差别在算力分配：先粗筛再精算，还是全位置一步预测</text>
</svg>
