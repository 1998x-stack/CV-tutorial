<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="yg-title yg-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="yg-title">YOLO 的 7×7 网格与输出张量</title>
<desc id="yg-desc">图像划分为 7×7 网格，物体中心落在哪个单元就由该单元负责；每个单元输出两个框的 (x,y,w,h,confidence) 与 20 个类别概率，拼成 7×7×30 张量。</desc>
<rect width="900" height="420" fill="#fffdf9"/>
<text x="45" y="44" font-size="22" font-weight="700" fill="#203035">YOLO：网格责任制</text>
<rect x="45" y="66" width="330" height="270" rx="10" fill="#eef3f2" stroke="#53676d"/>
<g stroke="#b9c9c4" stroke-width="1.5">
<path d="M45 105h330M45 144h330M45 183h330M45 222h330M45 261h330M45 300h330"/>
<path d="M92 66v270M139 66v270M186 66v270M233 66v270M280 66v270M327 66v270"/>
</g>
<rect x="139" y="144" width="47" height="39" fill="#ffecd9" stroke="#d06d4d" stroke-width="3"/>
<circle cx="162" cy="164" r="4" fill="#203035"/>
<text x="162" y="200" font-size="14" text-anchor="middle" fill="#8a4526">中心在此</text>
<circle cx="49" cy="207" r="4" fill="#203035"/>
<text x="70" y="212" font-size="0">x</text>
<text x="45" y="368" font-size="17" fill="#53676d">每单元预测 B 个框 + C 个类别概率</text>
<g font-size="17" text-anchor="middle" fill="#203035">
<rect x="470" y="110" width="360" height="180" rx="12" fill="#d6f1eb" stroke="#147f80" stroke-width="2.5"/>
<text x="650" y="150" font-weight="700">输出张量 S×S×(B·5+C)</text>
<text x="650" y="192">S=7, B=2, C=20</text>
<text x="650" y="228" font-size="20" font-weight="700" fill="#0f5f60">7 × 7 × 30</text>
</g>
<g font-size="15" fill="#53676d">
<text x="470" y="330">每单元 30 维：2×5（框+置信度）+ 20（类别）</text>
</g>
</svg>
