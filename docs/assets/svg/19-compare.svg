<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Two-stage versus one-stage detection computational graph</title><desc id="desc">R-CNN family uses proposal generation and region feature extraction; YOLOv1 predicts from a grid; SSD predicts default boxes from multiple feature maps.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">两阶段与单阶段：差别在候选如何进入检测头</text><rect x="28" y="92" width="255" height="260" rx="13" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><rect x="323" y="92" width="255" height="260" rx="13" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><rect x="618" y="92" width="255" height="260" rx="13" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243338"><text x="155" y="132" font-size="20" font-weight="700">Two-stage</text><text x="450" y="132" font-size="20" font-weight="700">YOLOv1</text><text x="745" y="132" font-size="20" font-weight="700">SSD</text><text x="155" y="188" font-size="17">proposals</text><text x="155" y="230" font-size="17">RoI features</text><text x="155" y="272" font-size="17">class + box head</text><text x="450" y="188" font-size="17">S×S grid</text><text x="450" y="230" font-size="17">B boxes / cell</text><text x="450" y="272" font-size="17">cell class scores</text><text x="745" y="188" font-size="17">multi-scale maps</text><text x="745" y="230" font-size="17">default boxes</text><text x="745" y="272" font-size="17">class + offsets</text></g><g stroke-width="2" fill="none"><path d="M155 202v20m-7-7 7 7 7-7M450 202v20m-7-7 7 7 7-7M745 202v20m-7-7 7 7 7-7" stroke="#53676d"/></g><text x="28" y="390" font-family="Arial,sans-serif" font-size="15" fill="#53676d">示意结构，不代表同等 backbone、训练预算或推理速度的公平 benchmark。</text></svg>