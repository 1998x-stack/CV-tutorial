<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">DETR 通过 learned queries 并行预测对象集合</title><desc id="desc">CNN特征进入Transformer encoder，decoder用learned object queries输出类别与框，训练时Hungarian matching对预测和真值一对一匹配。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dce8e4"/><text x="28" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#203035">DETR：query 集合 → 并行预测 → 二分匹配</text><rect x="35" y="125" width="160" height="155" rx="12" fill="#e4f2eb" stroke="#147f80" stroke-width="2"/><text x="115" y="170" text-anchor="middle" font-size="18" fill="#203035" font-family="Arial,sans-serif">CNN feature</text><text x="115" y="207" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">+ positional</text><text x="115" y="235" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">encoding</text><path d="M197 202h35m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="238" y="125" width="160" height="155" rx="12" fill="#eae6f5" stroke="#7461ba" stroke-width="2"/><text x="318" y="169" text-anchor="middle" font-size="18" fill="#203035" font-family="Arial,sans-serif">Transformer</text><text x="318" y="205" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">encoder / decoder</text><text x="318" y="241" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">100 queries</text><path d="M400 202h35m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="441" y="125" width="165" height="155" rx="12" fill="#f8e7da" stroke="#c46b45" stroke-width="2"/><text x="523" y="169" text-anchor="middle" font-size="18" fill="#203035" font-family="Arial,sans-serif">Predictions</text><text x="523" y="205" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">class + box</text><text x="523" y="241" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">+ no-object</text><path d="M608 202h35m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="649" y="125" width="210" height="155" rx="12" fill="#fff7ee" stroke="#147f80" stroke-width="2"/><text x="754" y="169" text-anchor="middle" font-size="18" fill="#203035" font-family="Arial,sans-serif">Hungarian</text><text x="754" y="205" text-anchor="middle" font-size="18" fill="#203035" font-family="Arial,sans-serif">matching</text><text x="754" y="241" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">one-to-one</text><text x="28" y="344" font-size="17" fill="#203035" font-family="Arial,sans-serif">Matching cost combines class probability and box geometry</text><text x="28" y="379" font-size="15" fill="#53676d" font-family="Arial,sans-serif">Original DETR removes hand-designed anchors and classic NMS; later variants may differ.</text></svg>