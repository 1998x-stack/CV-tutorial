<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="im-title im-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="im-title">掩码 IoU：交集像素数除以并集像素数</title>
<desc id="im-desc">预测掩码与真值掩码叠加，中间紫色为交集，两种颜色合起来为并集；mask IoU 等于交集像素数除以并集像素数，mIoU 再对各类别取平均。</desc>
<rect width="900" height="420" fill="#fffdf9"/>
<text x="45" y="44" font-size="22" font-weight="700" fill="#203035">mask IoU = 交集 / 并集</text>
<rect x="60" y="90" width="240" height="240" rx="10" fill="#eef3f2" stroke="#53676d"/>
<rect x="100" y="150" width="150" height="140" fill="#d6f1eb" stroke="#147f80" stroke-width="2.5"/>
<rect x="160" y="190" width="150" height="140" fill="#ffecd9" stroke="#d06d4d" stroke-width="2.5" fill-opacity="0.55"/>
<rect x="160" y="190" width="90" height="100" fill="#7461ba" opacity="0.65"/>
<text x="185" y="245" font-size="15" fill="#fffdf9">交集</text>
<text x="118" y="172" font-size="15" fill="#0f5f60">预测掩码</text>
<text x="235" y="345" font-size="15" fill="#8a4526">真值掩码</text>
<g font-size="18" fill="#203035">
<text x="360" y="140">交集 P∩G：同时属于两者的像素</text>
<text x="360" y="185">并集 P∪G：属于任一者的像素</text>
<text x="360" y="230">IoU = |P∩G| / |P∪G|</text>
<text x="360" y="290" fill="#0f5f60">mIoU = 各类别 IoU 的平均</text>
<text x="360" y="330" fill="#53676d">先按类别算 IoU，再平均</text>
</g>
<text x="450" y="392" font-size="16" text-anchor="middle" fill="#53676d">逐类别计算让 mIoU 比整体像素精度更少受类别不平衡影响</text>
</svg>
