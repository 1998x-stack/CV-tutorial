<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">RetinaNet 以 FPN 多尺度特征进行密集检测</title><desc id="desc">Backbone特征经过FPN形成P3到P7，每层共享分类子网络和框回归子网络，在anchors上输出类别分数与框偏移。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dce8e4"/><text x="28" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#203035">RetinaNet：多尺度特征 + 两个共享子网络</text><rect x="35" y="124" width="170" height="150" rx="12" fill="#e4f2eb" stroke="#147f80" stroke-width="2"/><text x="120" y="170" text-anchor="middle" font-size="19" fill="#203035" font-family="Arial,sans-serif">Backbone</text><text x="120" y="205" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">C3 / C4 / C5</text><path d="M207 200h44m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="257" y="124" width="145" height="150" rx="12" fill="#eae6f5" stroke="#7461ba" stroke-width="2"/><text x="329" y="177" text-anchor="middle" font-size="19" fill="#203035" font-family="Arial,sans-serif">FPN</text><text x="329" y="210" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">P3–P7</text><path d="M405 200h42m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="453" y="93" width="175" height="93" rx="10" fill="#f8e7da" stroke="#c46b45" stroke-width="2"/><text x="540" y="132" text-anchor="middle" font-size="17" fill="#203035" font-family="Arial,sans-serif">Classification</text><text x="540" y="160" text-anchor="middle" font-size="14" fill="#53676d" font-family="Arial,sans-serif">Focal Loss</text><rect x="453" y="214" width="175" height="93" rx="10" fill="#e4f2eb" stroke="#147f80" stroke-width="2"/><text x="540" y="253" text-anchor="middle" font-size="17" fill="#203035" font-family="Arial,sans-serif">Box regression</text><text x="540" y="281" text-anchor="middle" font-size="14" fill="#53676d" font-family="Arial,sans-serif">Smooth L1</text><path d="M402 180h34v-41h14m-8-8 8 8-8 8M436 180v81h14m-8-8 8 8-8 8" stroke="#53676d" stroke-width="2.5" fill="none"/><path d="M630 140h42m-10-8 10 8-10 8M630 260h42m-10-8 10 8-10 8" stroke="#53676d" stroke-width="2.5" fill="none"/><rect x="678" y="92" width="184" height="216" rx="12" fill="#fff7ee" stroke="#c46b45" stroke-width="2"/><text x="770" y="137" text-anchor="middle" font-size="18" fill="#203035" font-family="Arial,sans-serif">Dense anchors</text><text x="770" y="180" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">class scores</text><text x="770" y="220" text-anchor="middle" font-size="15" fill="#53676d" font-family="Arial,sans-serif">box offsets</text><text x="770" y="267" text-anchor="middle" font-size="14" fill="#53676d" font-family="Arial,sans-serif">threshold + NMS</text><text x="28" y="365" font-size="15" fill="#53676d" font-family="Arial,sans-serif">图示强调数据流；具体 anchor 数量与网络宽度依论文配置而定。</text></svg>