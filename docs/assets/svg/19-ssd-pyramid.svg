<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">SSD300 predicts from six feature maps with 8732 default boxes</title><desc id="desc">Feature map sizes 38,19,10,5,3,1 have 4,6,6,6,4,4 boxes per location respectively; the total number of default boxes is 8732.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">分辨率越高，位置越密；不同层负责不同尺度</text><rect x="24" y="120" width="150" height="150" rx="7" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="99" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">38×38</text><text x="99" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">4 boxes / loc</text><text x="99" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#087b7c">5776</text><rect x="169" y="135" width="120" height="120" rx="7" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="244" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">19×19</text><text x="244" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">6 boxes / loc</text><text x="244" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#087b7c">2166</text><rect x="314" y="147.5" width="95" height="95" rx="7" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="389" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243338">10×10</text><text x="389" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53676d">6 boxes / loc</text><text x="389" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#087b7c">600</text><rect x="459" y="159" width="72" height="72" rx="7" fill="#e9e5f4" stroke="#7461ba" stroke-wi