<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">YOLOv1 7x7 grid assigns an object to the cell containing its center</title><desc id="desc">An image is partitioned into a 7x7 grid; one cell owns the object center and predicts two boxes with confidence and one shared 20-class conditional probability vector.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243338">中心点落在哪个 cell，哪个 cell 就负责该物体</text><g transform="translate(55 90)"><rect width="360" height="270" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><path d="M51.42857142857143 0v270M0 38.57142857142857h360" stroke="#fffdfa" stroke-width="2"/><path d="M102.85714285714286 0v270M0 77.14285714285714h360" stroke="#fffdfa" stroke-width="2"/><path d="M154.28571428571428 0v270M0 115.71428571428571h360" stroke="#fffdfa" stroke-width="2"/><path d="M205.71428571428572 0v270M0 154.28571428571428h360" stroke="#fffdfa" stroke-width="2"/><path d="M257.14285714285717 0v270M0 192.85714285714286h360" stroke="#fffdfa" stroke-width="2"/><path d="M308.57142857142856 0v270M0 231.42857142857142h360" stroke="#fffdfa" stroke-width="2"/><rect x="102.85714285714286" y="115.71428571428571" width="51.42857142857143" height="38.57142857142857" fill="#f5c6a8" opacity=".8" stroke="#c46b45" stroke-width="3"/><circle cx="3*360/7+25" cy="3*270/7+18" r="7" fill="#c46b45"/><rect x="115" y="80" width="150" height="105" fill="none" stroke="#7461ba" stroke-width="3" stroke-dasharray="7 5"/></g><g font-family="Arial,sans-serif" fill="#243338"><text x="470" y="115" font-size="20" font-weight="700">每 cell 输出</text><text x="470" y="165" font-size="18">B=2 个框 × 5 值</text><text x="470" y="205" font-size="18">C=20 条件类别概率</text><text x="470" y="264" font-size="22" fill="#087b7c">7×7×(2×5+20)</text><text x="470" y="302" font-size="25" font-weight="700" fill="#087b7c">= 7×7×30</text><text x="470" y="347" font-size="15" fill="#53676d">类别向量按 cell 共享，不是每个 box 一份。</text></g></svg>