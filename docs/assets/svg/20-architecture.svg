<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Original U-Net contracting and expansive paths with skip concatenations</title><desc id="desc">Input 572 by 572; encoder feature sizes 568 280 136 64 and channels 64 128 256 512; bottleneck 28 by 28 times 1024; decoder outputs 52 100 196 388 and final 2 classes.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="24" y="43" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">原版 U-Net：左收缩、右扩张，横向拼接高分辨率特征</text><g font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><rect x="42" y="75" width="118" height="54" rx="8" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="101" y="98" font-size="15">572² × 1</text><text x="101" y="118" font-size="12">input</text><rect x="42" y="145" width="118" height="54" rx="8" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="101" y="168" font-size="15">568² × 64</text><text x="101" y="188" font-size="12">conv pair</text><rect x="42" y="215" width="118" height="54" rx="8" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="101" y="238" font-size="15">280² × 128</text><text x="101" y="258" font-size="12">pool / conv</text><rect x="42" y="285" width="118" height="54" rx="8" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="101" y="308" font-size="15">136² × 256</text><text x="101" y="328" font-size="12">pool / conv</text><rect x="42" y="355" width="118" height="45" rx="8" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="101" y="383" font-size="14">64² × 512</text><rect x="360" y="342" width="150" height="58" rx="9" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="435" y="365" font-size="16">28² × 1024</text><text x="435" y="387" font-size="13">bottleneck</text><rect x="680" y="355" width="150" height="45" rx="8" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="755" y="383" font-size="15">52² × 512</text><rect x="680" y="285" width="150" height="54" rx="8" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="755" y="308" font-size="15">100² × 256</text><text x="755" y="328" font-size="12">up + concat + conv</text><rect x="680" y="215" width="150" height="54" rx="8" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="755" y="238" font-size="15">196² × 128</text><text x="755" y="258" font-size="12">up + concat + conv</text><rect x="680" y="145" width="150" height="54" rx="8" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="755" y="168" font-size="15">388² × 64</text><text x="755" y="188" font-size="12">up + concat + conv</text><rect x="680" y="75" width="150" height="54" rx="8" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="755" y="98" font-size="15">388² × 2</text><text x="755" y="118" font-size="12">1×1 class logits</text></g><g fill="none" stroke="#c46b45" stroke-width="3"><path d="M101 129v16m-6-6 6 6 6-6M101 199v16m-6-6 6 6 6-6M101 269v16m-6-6 6 6 6-6M101 339v16m-6-6 6 6 6-6"/><path d="M160 382H350m-9-8 9 8-9 8M510 371h165m-9-8 9 8-9 8M755 355v-16m-6 6 6-6 6 6M755 285v-16m-6 6 6-6 6 6M755 215v-16m-6 6 6-6 6 6M755 145v-16m-6 6 6-6 6 6"/></g><g fill="none" stroke="#7461ba" stroke-width="2.5" stroke-dasharray="7 5"><path d="M160 172H640V172H680M160 242H620V242H680M160 312H600V312H680M160 382H580V382H680"/></g><text x="24" y="60" font-family="Arial,sans-serif" font-size="14" fill="#53676d">灰紫虚线：encoder feature 中心裁剪后，与 decoder 特征按通道拼接。</text></svg>