<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">U-Net skip feature is center-cropped before channel concatenation</title><desc id="desc">An 8 by 8 encoder feature is center cropped to 4 by 4, matching decoder upsampled feature; the two 4 by 4 maps concatenate along channels, not elementwise add.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">空间尺寸先对齐，再拼接通道</text><g transform="translate(55 104)"><rect width="256" height="256" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><path d="M32 0v256M0 32h256" stroke="#fffdfa" stroke-width="2"/><path d="M64 0v256M0 64h256" stroke="#fffdfa" stroke-width="2"/><path d="M96 0v256M0 96h256" stroke="#fffdfa" stroke-width="2"/><path d="M128 0v256M0 128h256" stroke="#fffdfa" stroke-width="2"/><path d="M160 0v256M0 160h256" stroke="#fffdfa" stroke-width="2"/><path d="M192 0v256M0 192h256" stroke="#fffdfa" stroke-width="2"/><path d="M224 0v256M0 224h256" stroke="#fffdfa" stroke-width="2"/><rect x="64" y="64" width="128" height="128" fill="#f4c9ad" fill-opacity=".65" stroke="#c46b45" stroke-width="3"/><text x="128" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#243338">Encoder 8×8</text></g><path d="M335 232h70m-9-8 9 8-9 8" stroke="#c46b45" stroke-width="3" fill="none"/><g transform="translate(425 152)"><rect width="128" height="128" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><path d="M32 0v128M0 32h128" stroke="#fffdfa" stroke-width="2"/><path d="M64 0v128M0 64h128" stroke="#fffdfa" stroke-width="2"/><path d="M96 0v128M0 96h128" stroke="#fffdfa" stroke-width="2"/><text x="64" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#243338">Crop 4×4</text></g><path d="M563 216h65m-9-8 9 8-9 8" stroke="#7461ba" stroke-width="3" fill="none"/><g transform="translate(648 127)"><rect width="90" height="90" rx="8" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="45" y="39" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#243338">Decoder</text><text x="45" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#53676d">4×4</text><rect x="0" y="110" width="90" height="90" rx="8" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="45" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#243338">Encoder</text><text x="45" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#53676d">4×4</text><path d="M105 45h32v65m-7-8 7 8 7-8" stroke="#c46b45" stroke-width="2.5" fill="none"/><rect x="150" y="65" width="75" height="75" rx="8" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="187" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#243338">Concat</text><text x="187" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#53676d">channels</text></g><text x="28" y="398" font-family="Arial,sans-serif" font-size="15" fill="#53676d">原版 skip connection 是 concatenation；图中尺寸为概念示意，非完整 572→388 网络比例。</text></svg>