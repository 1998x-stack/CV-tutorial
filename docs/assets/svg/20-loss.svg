<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Pixel weighted cross entropy and Dice overlap loss are distinct objectives</title><desc id="desc">Per-pixel logits produce class probabilities and weighted cross entropy map in original U-Net; a separate Dice overlap branch represents a commonly used later segmentation objective.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">两个目标回答不同问题：逐像素分类 vs 区域重叠</text><rect x="35" y="110" width="235" height="205" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><rect x="335" y="110" width="235" height="205" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><rect x="635" y="110" width="230" height="205" rx="12" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#243338" text-anchor="middle"><text x="152" y="151" font-size="19" font-weight="700">Pixel logits</text><text x="152" y="192" font-size="17">softmax per pixel</text><text x="152" y="230" font-size="16">target class p(y|x)</text><text x="152" y="274" font-size="16">weighted CE map</text><text x="452" y="151" font-size="19" font-weight="700">Original U-Net</text><text x="452" y="192" font-size="17">class frequency weight</text><text x="452" y="230" font-size="16">+ touching-border weight</text><text x="452" y="274" font-size="16">sum pixel losses</text><text x="750" y="151" font-size="19" font-weight="700">Later Dice option</text><text x="750" y="192" font-size="17">overlap of masks</text><text x="750" y="230" font-size="16">2|P∩Y|/(|P|+|Y|)</text><text x="750" y="274" font-size="16">1 − Dice</text></g><path d="M270 210h64m-9-8 9 8-9 8M570 210h64m-9-8 9 8-9 8" stroke="#53676d" stroke-width="3" fill="none"/><text x="28" y="370" font-family="Arial,sans-serif" font-size="15" fill="#53676d">Dice Loss 不属于原始 2015 U-Net 的主要目标；空掩码与类别汇总规则需显式定义。</text></svg>