<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">U-Net overlap tile inference predicts center regions with mirrored context at borders</title><desc id="desc">Large input is split into overlapping input tiles; each network call predicts a smaller central output tile; adjacent center predictions tile together, with mirrored padding near the image edge.</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#d9e9e2"/><text x="28" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243338">输入 tile 重叠，输出中心区域拼接</text><rect x="55" y="103" width="335" height="220" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><rect x="120" y="145" width="205" height="135" fill="#f5c9ae" fill-opacity=".75" stroke="#c46b45" stroke-width="3"/><rect x="250" y="103" width="140" height="220" fill="#e9e5f4" fill-opacity=".3" stroke="#7461ba" stroke-width="2" stroke-dasharray="7 5"/><g font-family="Arial,sans-serif" fill="#243338"><text x="65" y="90" font-size="17">大图像上的两个重叠输入区域</text><text x="222" y="216" text-anchor="middle" font-size="18">有效输出区</text><text x="222" y="246" text-anchor="middle" font-size="15">只保留中心</text></g><path d="M414 215h78m-9-8 9 8-9 8" stroke="#c46b45" stroke-width="3" fill="none"/><g transform="translate(520 110)"><rect width="300" height="210" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><rect x="18" y="18" width="126" height="174" fill="#f5c9ae" stroke="#c46b45" stroke-width="2"/><rect x="156" y="18" width="126" height="174" fill="#e9e5f4" stroke="#7461ba" stroke-width="2"/><text x="81" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">Output A</text><text x="219" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">Output B</text><text x="150" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#53676d">中心区域相邻拼接</text></g><text x="28" y="375" font-family="Arial,sans-serif" font-size="15" fill="#53676d">原图边缘缺失上下文时用镜像外推；输入/输出步长需一致，避免接缝与漏预测。</text></svg>