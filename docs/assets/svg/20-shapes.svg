<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">原始 U-Net valid convolution 的 572 到 388 尺寸轨迹</title><desc id="desc">输入572经过encoder双卷积池化到568 280 136 64，bottleneck28，decoder输出52 100 196 388。</desc><rect width="900" height="420" rx="20" fill="#fffdfa" stroke="#dce8e4"/><text x="28" y="45" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#203035">空间尺寸账本（每边像素）</text><g font-family="Arial,sans-serif" fill="#203035" font-size="17"><text x="50" y="104">Input</text><text x="50" y="143">Encoder 1</text><text x="50" y="182">Encoder 2</text><text x="50" y="221">Encoder 3</text><text x="50" y="260">Encoder 4</text><text x="50" y="299">Bottleneck</text><text x="50" y="338">Decoder output</text></g><rect x="120" y="85" width="150" height="27" rx="6" fill="#147f80" opacity=".85"/><text x="132" y="104" font-size="15" fill="#fff" font-family="Arial,sans-serif">572</text><rect x="180" y="124" width="150" height="27" rx="6" fill="#147f80" opacity=".85"/><text x="192" y="143" font-size="15" fill="#fff" font-family="Arial,sans-serif">568 → 284</text><rect x="240" y="163" width="150" height="27" rx="6" fill="#147f80" opacity=".85"/><text x="252" y="182" font-size="15" fill="#fff" font-family="Arial,sans-serif">280 → 140</text><rect x="300" y="202" width="150" height="27" rx="6" fill="#147f80" opacity=".85"/><text x="312" y="221" font-size="15" fill="#fff" font-family="Arial,sans-serif">136 → 68</text><rect x="360" y="241" width="150" height="27" rx="6" fill="#147f80" opacity=".85"/><text x="372" y="260" font-size="15" fill="#fff" font-family="Arial,sans-serif">64 → 32</text><rect x="420" y="280" width="150" height="27" rx="6" fill="#c46b45" opacity=".85"/><text x="432" y="299" font-size="15" fill="#fff" font-family="Arial,sans-serif">28</text><rect x="480" y="319" width="380" height="27" rx="6" fill="#7461ba" opacity=".85"/><text x="492" y="338" font-size="15" fill="#fff" font-family="Arial,sans-serif">52 → 100 → 196 → 388</text><rect x="630" y="100" width="230" height="210" rx="12" fill="#f8e7da" stroke="#c46b45" stroke-width="2"/><text x="650" y="145" font-size="19" font-weight="700" fill="#203035" font-family="Arial,sans-serif">Skip crop</text><text x="650" y="183" font-size="17" fill="#203035" font-family="Arial,sans-serif">4 px / side</text><text x="650" y="219" font-size="17" fill="#203035" font-family="Arial,sans-serif">16 px / side</text><text x="650" y="255" font-size="17" fill="#203035" font-family="Arial,sans-serif">40 px / side</text><text x="650" y="291" font-size="17" fill="#203035" font-family="Arial,sans-serif">88 px / side</text><text x="28" y="395" font-size="15" fill="#53676d" font-family="Arial,sans-serif">输入 572×572 → 输出 388×388；crop 只为 skip feature 与上采样特征对齐。</text></svg>