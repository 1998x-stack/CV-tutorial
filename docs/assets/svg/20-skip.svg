<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="sk-title sk-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="sk-title">U-Net 拼接与 ResNet 残差相加的区别</title>
<desc id="sk-desc">左：U-Net 跳跃连接把编码器同分辨率特征与解码器上采样结果在通道维拼接，通道数相加、信息分通道保留；右：ResNet 残差把输入与变换结果逐元素相加，通道数不变、用于缓解优化退化。</desc>
<rect width="900" height="420" fill="#fffdf9"/>
<text x="45" y="42" font-size="21" font-weight="700" fill="#203035">拼接（concat）</text>
<text x="510" y="42" font-size="21" font-weight="700" fill="#203035">相加（add）</text>
<rect x="55" y="66" width="340" height="300" rx="12" fill="#eef3f2" stroke="#c9d8d3"/>
<rect x="485" y="66" width="360" height="300" rx="12" fill="#eef3f2" stroke="#c9d8d3"/>
<g font-size="16" text-anchor="middle" fill="#203035">
<rect x="95" y="110" width="120" height="60" rx="8" fill="#d6f1eb" stroke="#147f80" stroke-width="2.5"/><text x="155" y="146">编码器特征</text>
<rect x="95" y="210" width="120" height="60" rx="8" fill="#ffecd9" stroke="#d06d4d" stroke-width="2.5"/><text x="155" y="246">解码器特征</text>
<rect x="265" y="160" width="110" height="60" rx="8" fill="#ebe5ff" stroke="#7461ba" stroke-width="2.5"/><text x="320" y="196">通道拼接</text>
<text x="225" y="340" font-size="15" fill="#53676d">通道数：C + C = 2C</text>

<rect x="640" y="96" width="120" height="70" rx="8" fill="#d6f1eb" stroke="#147f80" stroke-width="2.5"/><text x="700" y="138">变换 F(x)</text>
<rect x="620" y="250" width="150" height="60" rx="8" fill="#ebe5ff" stroke="#7461ba" stroke-width="2.5"/><text x="695" y="286">相加 F(x)+x</text>
<circle cx="530" cy="132" r="5" fill="#203035"/><text x="530" y="112" font-size="15" fill="#203035">x</text>
<circle cx="530" cy="280" r="5" fill="#203035"/><text x="512" y="300" font-size="15" fill="#203035">x</text>
<text x="700" y="340" font-size="15" fill="#53676d">通道数：C 不变</text>
</g>
<g stroke="#147f80" stroke-width="4" fill="none" marker-end="url(#sk-ah)">
<path d="M215 140 L261 175"/><path d="M215 240 L261 205"/>
<path d="M560 132 H636"/><path d="M700 166 V246"/><path d="M530 285 H616"/>
</g>
<defs><marker id="sk-ah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs>
<text x="225" y="392" font-size="15" text-anchor="middle" fill="#6b57a8">跨编码器/解码器通路，补空间细节</text>
<text x="665" y="392" font-size="15" text-anchor="middle" fill="#6b57a8">同一阶段内恒等映射，助优化</text>
</svg>
