<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Mask R-CNN 的多任务损失与前景门控</title><desc id="desc">分类损失作用于所有采样 RoI；框回归和掩码损失只在前景 RoI 上有有效监督。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="35" y="145" width="170" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="120" y="176" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Sampled RoIs</text><text x="120" y="202" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">foreground + background</text>
<rect x="280" y="55" width="175" height="85" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="367.5" y="86" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">L_cls</text><text x="367.5" y="112" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">all RoIs</text>
<rect x="280" y="175" width="175" height="85" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="367.5" y="206" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">L_box</text><text x="367.5" y="232" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">foreground only</text>
<rect x="280" y="295" width="175" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="367.5" y="326" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">L_mask</text><text x="367.5" y="352" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">foreground only</text>
<path d="M205 195 L245 195" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M245 195 V98 H280 M245 195 H260 V217 H280 M245 195 V337 H280" stroke="#566a70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="590" y="155" width="235" height="105" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="707.5" y="186" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">L_total</text><text x="707.5" y="212" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">L_cls + L_box + L_mask</text>
<path d="M455 98 L535 180" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M455 217 L535 207" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M455 337 L535 235" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="705" y="315" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#c46b45">background RoI：L_mask = 0</text>
<text x="705" y="350" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#566a70">box target / mask target 不存在</text>
</svg>