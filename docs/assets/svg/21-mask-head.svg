<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Mask branch：以类别条件选择一个 m×m 二值掩码</title><desc id="desc">RoI feature 经过全卷积掩码头，输出 K 个类别掩码；训练时只对匹配的真实类别通道计算逐像素 BCE。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="30" y="130" width="150" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="105" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">RoI feature</text><text x="105" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">14 × 14 × C</text>
<rect x="245" y="130" width="165" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="327.5" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Conv stack</text><text x="327.5" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">空间特征融合</text>
<rect x="475" y="130" width="150" height="100" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="550" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Upsample</text><text x="550" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">转置卷积</text>
<rect x="690" y="80" width="175" height="200" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="777.5" y="111" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Mask logits</text><text x="777.5" y="137" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">K × 28 × 28</text>
<path d="M180 180 L245 180" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M410 180 L475 180" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M625 180 L690 180" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="777" y="120" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#243338">class 1</text><text x="777" y="155" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#243338">class 2</text><text x="777" y="190" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" fill="#243338">…</text><text x="777" y="225" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#243338">class K</text>
<path d="M777 245 V305 H535" stroke="#c46b45" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="355" y="300" width="180" height="70" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="445" y="331" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Select GT class</text><text x="445" y="357" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">positive RoI only</text>
<text x="35" y="392" text-anchor="start" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">Mask 分支保留空间布局；分类分支负责决定最终使用哪一类 mask</text>
</svg>