<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Mask R-CNN：在共享 RoI 特征上并行预测类别、边框与掩码</title><desc id="desc">共享 backbone 特征进入 RPN 产生 proposals；RoIAlign 对齐每个区域；第二阶段三个并行头分别输出 class、box 和 mask。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<text x="28" y="40" text-anchor="start" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700" fill="#243338">同一候选区域，三个互补问题</text>
<rect x="30" y="130" width="140" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="100" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">输入图像</text><text x="100" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">H × W × 3</text>
<rect x="220" y="130" width="145" height="100" rx="12" fill="#f8e7db" stroke="#087b7c" stroke-width="2"/><text x="292.5" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Backbone</text><text x="292.5" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">共享特征图</text>
<rect x="420" y="45" width="145" height="85" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="492.5" y="76" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">RPN</text><text x="492.5" y="102" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">候选框 proposals</text>
<rect x="420" y="190" width="145" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="492.5" y="221" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">RoIAlign</text><text x="492.5" y="247" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">连续坐标采样</text>
<path d="M170 180 L220 180" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M365 155 L420 90" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M492 130 L492 190" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<rect x="640" y="35" width="220" height="85" rx="12" fill="#f8e7db" stroke="#087b7c" stroke-width="2"/><text x="750" y="66" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">分类头</text><text x="750" y="92" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">K + 1 类别</text>
<rect x="640" y="155" width="220" height="85" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="750" y="186" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">框回归头</text><text x="750" y="212" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">K × 4 offsets</text>
<rect x="640" y="275" width="220" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="750" y="306" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">掩码头</text><text x="750" y="332" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">K × m × m</text>
<path d="M565 230 L605 230" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M605 230 V78 H640 M605 230 V198 H640 M605 230 V318 H640" stroke="#566a70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="365" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#566a70">共享 RoI 表示；分支并行，不是先分割再分类</text>
</svg>