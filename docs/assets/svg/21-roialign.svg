<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">RoIAlign：保留浮点边界并在 bin 内双线性采样</title><desc id="desc">RoIPool 将 RoI 边界与 bin 边界取整；RoIAlign 保留浮点坐标，在每个 bin 的规则采样点做双线性插值并聚合。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<text x="28" y="42" text-anchor="start" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#243338">空间对齐不是装饰：边界偏一格，像素标签就可能错位</text>
<rect x="40" y="105" width="350" height="245" rx="12" fill="#fff6ef" stroke="#c46b45" stroke-width="2"/><text x="215" y="136" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">RoIPool：两次量化</text><text x="215" y="162" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">浮点 RoI → 整数边界 → 整数 bins</text>
<rect x="510" y="105" width="350" height="245" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="685" y="136" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">RoIAlign：连续采样</text><text x="685" y="162" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">不取整 → 双线性插值 → 聚合</text>
<g stroke="#d4dfdb" stroke-width="1"><path d="M85 170 V315 M85 170 H325"/><path d="M133 170 V315 M85 199 H325"/><path d="M181 170 V315 M85 228 H325"/><path d="M229 170 V315 M85 257 H325"/><path d="M277 170 V315 M85 286 H325"/><path d="M325 170 V315 M85 315 H325"/></g>
<rect x="133" y="199" width="145" height="87" fill="#f6c8a9" opacity=".42" stroke="#c46b45" stroke-width="2"/>
<path d="M133 199 L278 199 L278 286 L133 286 Z" stroke="#c46b45" stroke-width="3" fill="none"/>
<g stroke="#d4dfdb" stroke-width="1"><path d="M555+i*48 170 V315 M555 170 H795"/><path d="M555+i*48 170 V315 M555 199 H795"/><path d="M555+i*48 170 V315 M555 228 H795"/><path d="M555+i*48 170 V315 M555 257 H795"/><path d="M555+i*48 170 V315 M555 286 H795"/><path d="M555+i*48 170 V315 M555 315 H795"/></g>
<rect x="602" y="193" width="145" height="94" fill="#b9ded2" opacity=".28" stroke="#087b7c" stroke-width="2"/>
<circle cx="625" cy="218" r="6" fill="#087b7c"/><circle cx="720" cy="218" r="6" fill="#087b7c"/><circle cx="625" cy="261" r="6" fill="#087b7c"/><circle cx="720" cy="261" r="6" fill="#087b7c"/>
<text x="215" y="330" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#c46b45">边界/分箱取整</text><text x="685" y="330" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#087b7c">浮点位置插值</text>
<text x="450" y="388" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">原论文：每个 bin 的规则采样点经双线性插值后做 max 或 average 聚合</text>
</svg>