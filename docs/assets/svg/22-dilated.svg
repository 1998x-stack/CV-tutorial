<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dil-title dil-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="dil-title">空洞卷积：参数量不变，等效感受野随空洞率增大</title>
<desc id="dil-desc">三组使用相同 9 个权重的 3×3 卷积核。dilation=1 时等效感受野 3×3；dilation=2 时权重之间隔 1 个空洞，等效 5×5；dilation=4 时隔 3 个空洞，等效 9×9。三组参数量都恒为 9。</desc>
<rect width="900" height="400" fill="#fffdf9"/>
<style>.w{fill:#f4b183;stroke:#d06d4d;stroke-width:1.5}.g{fill:#eef3f2;stroke:#c9d8d3}</style>
<text x="70" y="46" font-size="21" font-weight="700" fill="#203035">空洞卷积：不增参数，增大感受野</text>
<text x="70" y="72" font-size="14" fill="#53676d">同一组 9 个权重，只改变采样点间距</text>

<rect class="g" x="70" y="110" width="120" height="120"/>
<g><rect class="w" x="72" y="112" width="36" height="36"/><rect class="w" x="112" y="112" width="36" height="36"/><rect class="w" x="152" y="112" width="36" height="36"/>
<rect class="w" x="72" y="152" width="36" height="36"/><rect class="w" x="112" y="152" width="36" height="36"/><rect class="w" x="152" y="152" width="36" height="36"/>
<rect class="w" x="72" y="192" width="36" height="36"/><rect class="w" x="112" y="192" width="36" height="36"/><rect class="w" x="152" y="192" width="36" height="36"/></g>
<text x="130" y="258" font-size="16" font-weight="700" text-anchor="middle" fill="#8a4526">d = 1</text>
<text x="130" y="280" font-size="14" text-anchor="middle" fill="#53676d">等效核 3×3</text>

<rect class="g" x="350" y="90" width="140" height="140"/>
<g><rect class="w" x="352" y="92" width="24" height="24"/><rect class="w" x="408" y="92" width="24" height="24"/><rect class="w" x="464" y="92" width="24" height="24"/>
<rect class="w" x="352" y="148" width="24" height="24"/><rect class="w" x="408" y="148" width="24" height="24"/><rect class="w" x="464" y="148" width="24" height="24"/>
<rect class="w" x="352" y="204" width="24" height="24"/><rect class="w" x="408" y="204" width="24" height="24"/><rect class="w" x="464" y="204" width="24" height="24"/></g>
<text x="420" y="258" font-size="16" font-weight="700" text-anchor="middle" fill="#8a4526">d = 2</text>
<text x="420" y="280" font-size="14" text-anchor="middle" fill="#53676d">等效核 5×5</text>

<rect class="g" x="620" y="80" width="162" height="162"/>
<g><rect class="w" x="621" y="81" width="15" height="15"/><rect class="w" x="693" y="81" width="15" height="15"/><rect class="w" x="765" y="81" width="15" height="15"/>
<rect class="w" x="621" y="153" width="15" height="15"/><rect class="w" x="693" y="153" width="15" height="15"/><rect class="w" x="765" y="153" width="15" height="15"/>
<rect class="w" x="621" y="225" width="15" height="15"/><rect class="w" x="693" y="225" width="15" height="15"/><rect class="w" x="765" y="225" width="15" height="15"/></g>
<text x="701" y="264" font-size="16" font-weight="700" text-anchor="middle" fill="#8a4526">d = 4</text>
<text x="701" y="286" font-size="14" text-anchor="middle" fill="#53676d">等效核 9×9</text>

<rect x="70" y="330" width="190" height="20" fill="#f4b183" stroke="#d06d4d"/>
<text x="272" y="346" font-size="14" fill="#53676d">橙色格 = 权重采样点</text>
<rect x="470" y="330" width="60" height="20" fill="#eef3f2" stroke="#c9d8d3"/>
<text x="544" y="346" font-size="14" fill="#53676d">浅灰格 = 空洞（未采样）</text>
<text x="70" y="382" font-size="14" fill="#53676d">三组参数量恒为 9；感受野 k_eff = k + (k−1)(d−1)</text>
</svg>
