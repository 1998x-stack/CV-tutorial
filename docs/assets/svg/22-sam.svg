<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">SAM：图像 embedding 可复用，提示编码与 mask decoder 快速响应</title><desc id="desc">SAM 包含 image encoder、prompt encoder 和 mask decoder；image embedding 可对同一张图复用，点/框/掩码提示驱动多个候选 mask 与质量分数。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="25" y="130" width="165" height="105" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="107.5" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Image encoder</text><text x="107.5" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">ViT image embedding</text>
<rect x="260" y="35" width="175" height="95" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="347.5" y="66" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Sparse prompts</text><text x="347.5" y="92" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">points / boxes / text</text>
<rect x="260" y="240" width="175" height="95" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="347.5" y="271" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Dense prompt</text><text x="347.5" y="297" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">mask input</text>
<rect x="500" y="130" width="160" height="105" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="580" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Prompt encoder</text><text x="580" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">prompt embeddings</text>
<rect x="720" y="130" width="150" height="105" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="795" y="161" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Mask decoder</text><text x="795" y="187" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">mask + IoU score</text>
<path d="M190 182 L230 182" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M230 182 V82 H260 M230 182 V287 H260" stroke="#566a70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M435 82 L470 160" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M435 287 L470 205" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M660 182 L720 182" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="795" y="275" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#087b7c">mask A / B / C</text>
<text x="450" y="385" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">图像编码一次；新提示只需运行轻量交互分支</text>
