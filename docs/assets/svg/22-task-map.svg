<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">语义、实例与全景分割：输出标签粒度不同</title><desc id="desc">语义分割给每像素类别；实例分割给每个 thing 实例独立 ID；全景分割把 things 和 stuff 放进一张无重叠像素分区图。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<text x="28" y="42" text-anchor="start" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700" fill="#243338">同一张街景图，三种不同的输出契约</text>
<rect x="35" y="90" width="245" height="72" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="157.5" y="121" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Semantic</text><text x="157.5" y="147" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">class map</text>
<rect x="328" y="90" width="245" height="72" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="450.5" y="121" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Instance</text><text x="450.5" y="147" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">class + instance ID</text>
<rect x="620" y="90" width="245" height="72" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="742.5" y="121" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Panoptic</text><text x="742.5" y="147" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">things + stuff</text>
<g transform="translate(45,195)"><rect width="210" height="132" rx="8" fill="#edf5f1" stroke="#b9c9c3"/><path d="M0 87 H210 V132 H0Z" fill="#d7e1e7"/><rect x="18" y="34" width="54" height="53" fill="#87b9a7"/><rect x="84" y="49" width="42" height="38" fill="#d99b76"/><rect x="143" y="22" width="48" height="65" fill="#9b8bc8"/><path d="M18 34 H72 M84 49 H126 M143 22 H191" stroke="#fff" stroke-width="2"/></g><g transform="translate(338,195)"><rect width="210" height="132" rx="8" fill="#edf5f1" stroke="#b9c9c3"/><path d="M0 87 H210 V132 H0Z" fill="#d7e1e7"/><rect x="18" y="34" width="54" height="53" fill="#87b9a7"/><rect x="84" y="49" width="42" height="38" fill="#d99b76"/><rect x="143" y="22" width="48" height="65" fill="#9b8bc8"/><path d="M18 34 H72 M84 49 H126 M143 22 H191" stroke="#fff" stroke-width="2"/></g><g transform="translate(631,195)"><rect width="210" height="132" rx="8" fill="#edf5f1" stroke="#b9c9c3"/><path d="M0 87 H210 V132 H0Z" fill="#d7e1e7"/><rect x="18" y="34" width="54" height="53" fill="#87b9a7"/><rect x="84" y="49" width="42" height="38" fill="#d99b76"/><rect x="143" y="22" width="48" height="65" fill="#9b8bc8"/><path d="M18 34 H72 M84 49 H126 M143 22 H191" stroke="#fff" stroke-width="2"/></g>
<text x="150" y="355" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#566a70">同类车像素同色</text><text x="443" y="355" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#566a70">每辆车有独立 ID</text><text x="735" y="355" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#566a70">路面/天空也有标签</text>
<text x="450" y="393" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">thing：可数实例；stuff：连续区域或材料类别</text>
</svg>