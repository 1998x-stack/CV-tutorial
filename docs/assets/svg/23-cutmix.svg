<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">CutMix：按实际可见面积修正标签比例</title><desc id="desc">从图像 A 中切出矩形区域并用图像 B 的对应 patch 替换；标签权重由裁剪后实际面积计算，而不是只使用裁剪前采样值。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<text x="30" y="42" text-anchor="start" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#243338">图像 A 的 patch 被 B 覆盖，目标标签也按面积混合</text>
<rect x="55" y="90" width="300" height="205" rx="10" fill="#b9ded2" stroke="#087b7c" stroke-width="2"/><path d="M55 240 H355 V295 H55Z" fill="#d6e0e6"/><rect x="180" y="140" width="110" height="95" fill="#e9c1a8" stroke="#c46b45" stroke-width="2"/>
<text x="205" y="125" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#9b4d2d">B patch</text>
<text x="205" y="325" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#087b7c">A visible area = λeff</text>
<rect x="480" y="100" width="330" height="80" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="645" y="131" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">λeff = 1 − patch_area / image_area</text><text x="645" y="157" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">after clipping</text>
<rect x="480" y="225" width="330" height="80" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="645" y="256" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">ỹ = λeff yA + (1−λeff)yB</text><text x="645" y="282" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">classification label mix</text>
<path d="M355 190 L450 140" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M645 180 L645 225" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="645" y="355" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#566a70">检测 / 分割任务还必须同步更新 boxes / masks / instance IDs</text>
</svg>