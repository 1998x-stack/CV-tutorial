<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mix-title mix-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="mix-title">MixUp、CutMix 与 CutOut 的区别</title>
<desc id="mix-desc">MixUp 把两张图的像素按系数 λ 叠加并插值标签；CutMix 把一张图的矩形块贴到另一张图上、标签按面积比例混合；CutOut 在单张图上遮盖一块方形区域、标签保持不变。</desc>
<rect width="900" height="400" fill="#fffdf9"/>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">样本级增强：混合像素，还是拼贴、遮挡？</text>
<rect x="40" y="60" width="26" height="18" fill="#cfe8f5" stroke="#8fb9cd"/>
<text x="74" y="74" font-size="13.5" fill="#53676d">图 A（类别 0）</text>
<rect x="210" y="60" width="26" height="18" fill="#f4b183" stroke="#d06d4d"/>
<text x="244" y="74" font-size="13.5" fill="#53676d">图 B（类别 1）</text>

<rect x="40" y="100" width="240" height="170" rx="10" fill="#cfe8f5" stroke="#8fb9cd" stroke-width="1.5"/>
<rect x="40" y="100" width="240" height="170" rx="10" fill="#f4b183" opacity="0.45"/>
<text x="160" y="192" font-size="15" font-weight="700" text-anchor="middle" fill="#6b4a2a">0.6 · A + 0.4 · B</text>
<text x="160" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4526">MixUp：像素叠加 + 标签插值</text>
<text x="160" y="322" font-size="12.5" text-anchor="middle" fill="#53676d">y = 0.6·y_A + 0.4·y_B</text>

<rect x="330" y="100" width="240" height="170" rx="10" fill="#cfe8f5" stroke="#8fb9cd" stroke-width="1.5"/>
<rect x="400" y="150" width="110" height="80" fill="#f4b183" stroke="#d06d4d" stroke-width="1.5"/>
<text x="455" y="196" font-size="14" text-anchor="middle" fill="#6b4a2a">B 的矩形块</text>
<text x="450" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4526">CutMix：贴块，标签按面积比例</text>
<text x="450" y="322" font-size="12.5" text-anchor="middle" fill="#53676d">保留局部纹理</text>

<rect x="620" y="100" width="240" height="170" rx="10" fill="#cfe8f5" stroke="#8fb9cd" stroke-width="1.5"/>
<rect x="690" y="150" width="100" height="80" fill="#e3e3e3" stroke="#9aa7ac" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="740" y="196" font-size="14" text-anchor="middle" fill="#6b7478">遮盖</text>
<text x="740" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4526">CutOut：单图挖洞，标签不变</text>
<text x="740" y="322" font-size="12.5" text-anchor="middle" fill="#53676d">y = y_A</text>

<text x="40" y="372" font-size="14" fill="#53676d">λ 常从 Beta(α,α) 采样，多数时候接近 0 或 1，只在少数时候接近 0.5。</text>
<text x="40" y="394" font-size="14" fill="#53676d">样本混合产生软标签：细粒度分类或需要可靠概率时需谨慎。</text>
</svg>
