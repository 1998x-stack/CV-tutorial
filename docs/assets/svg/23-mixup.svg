<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">MixUp：图像与标签沿同一凸组合系数插值</title><desc id="desc">MixUp 从 Beta(alpha, alpha) 采样 lambda，同时混合两张图像与 one-hot 标签，训练模型在样本之间保持更平滑的决策。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="35" y="100" width="150" height="90" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="110" y="131" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Image A</text><text x="110" y="157" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">label yA</text>
<rect x="35" y="245" width="150" height="90" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="110" y="276" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Image B</text><text x="110" y="302" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">label yB</text>
<rect x="285" y="100" width="150" height="90" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="360" y="131" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">λ × A</text><text x="360" y="157" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">weighted pixels</text>
<rect x="285" y="245" width="150" height="90" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="360" y="276" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">(1−λ) × B</text><text x="360" y="302" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">weighted pixels</text>
<path d="M185 145 L285 145" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M185 290 L285 290" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<rect x="550" y="145" width="295" height="130" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="697.5" y="176" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Mixed sample</text><text x="697.5" y="202" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">x̃ = λxA + (1−λ)xB</text>
<path d="M435 145 L520 185" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M435 290 L520 235" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="695" y="310" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" fill="#7560b5">ỹ = λyA + (1−λ)yB</text>
<text x="450" y="382" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#566a70">λ ~ Beta(α, α)；输入和目标必须使用同一个 λ</text>
</svg>