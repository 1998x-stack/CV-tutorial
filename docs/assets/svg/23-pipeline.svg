<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">训练数据管线：先划分数据，再只对训练集随机增强</title><desc id="desc">数据划分先于随机增强；训练集应用同步变换与归一化，验证和测试只做确定性 resize/normalize，避免评估分布被污染。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="25" y="135" width="150" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="100" y="166" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Raw dataset</text><text x="100" y="192" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">group-aware split</text>
<rect x="245" y="40" width="170" height="85" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="330" y="71" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Train split</text><text x="330" y="97" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">random transforms</text>
<rect x="245" y="245" width="170" height="85" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="330" y="276" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Val / Test</text><text x="330" y="302" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">deterministic only</text>
<rect x="500" y="40" width="170" height="85" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="585" y="71" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Augment + batch</text><text x="585" y="97" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">paired targets</text>
<rect x="500" y="245" width="170" height="85" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="585" y="276" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Resize + normalize</text><text x="585" y="302" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">no random mix</text>
<rect x="735" y="135" width="140" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="805" y="166" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Model</text><text x="805" y="192" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">train / eval</text>
<path d="M175 185 L215 185" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M215 185 V82 H245 M215 185 V287 H245" stroke="#566a70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M415 82 L500 82" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M415 287 L500 287" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M670 82 L705 165" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M670 287 L705 205" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="385" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#c46b45">若同一患者 / 视频 / 原始图像的派生样本跨 split，指标会产生泄漏</text>
</svg>