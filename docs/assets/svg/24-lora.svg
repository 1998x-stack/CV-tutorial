<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">LoRA：冻结 W0，只训练低秩增量 BA</title><desc id="desc">原始权重 W0 保持冻结；低秩矩阵 A 将输入投影到 rank r，矩阵 B 再映射回输出维度；增量按 alpha/r 缩放后加到原始线性层。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="35" y="140" width="155" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="112.5" y="171" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Input x</text><text x="112.5" y="197" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">d_in</text>
<rect x="280" y="45" width="205" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="382.5" y="76" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Frozen W₀</text><text x="382.5" y="102" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">d_out × d_in</text>
<rect x="280" y="265" width="95" height="90" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="327.5" y="296" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">A</text><text x="327.5" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">r × d_in</text>
<rect x="415" y="265" width="95" height="90" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="462.5" y="296" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">B</text><text x="462.5" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">d_out × r</text>
<rect x="690" y="140" width="175" height="100" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="777.5" y="171" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Output</text><text x="777.5" y="197" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">W₀x + ΔWx</text>
<path d="M190 170 L250 100" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M190 210 L250 310" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M375 310 L415 310" stroke="#7560b5" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M510 310 L650 220" stroke="#7560b5" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M485 95 L650 170" stroke="#c46b45" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="460" y="390" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#566a70">ΔW = (α / r) BA；trainable params = r(d_in + d_out)</text>
</svg>