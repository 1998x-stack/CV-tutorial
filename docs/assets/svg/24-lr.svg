<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">差分学习率：靠近输入的通用特征通常更新更谨慎</title><desc id="desc">一个可选的 fine-tuning 配方：head 使用较大学习率，靠近输出的 stage 使用中等学习率，早期 backbone 使用较小学习率；这不是普适定律。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<text x="35" y="45" text-anchor="start" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#243338">Discriminative learning rates（示意配置）</text>
<rect x="55" y="115" width="180" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="145" y="146" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Early backbone</text><text x="145" y="172" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">1e−5</text>
<rect x="355" y="115" width="180" height="85" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="445" y="146" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Late stages</text><text x="445" y="172" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">1e−4</text>
<rect x="655" y="115" width="180" height="85" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="745" y="146" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">New task head</text><text x="745" y="172" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">1e−3</text>
<path d="M235 157 L355 157" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M535 157 L655 157" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="145" y="255" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#087b7c">较小更新</text><text x="445" y="255" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#c46b45">中等更新</text><text x="745" y="255" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" fill="#7560b5">较大更新</text>
<path d="M65 300 H835" stroke="#d5dfdb" stroke-width="2"/>
<text x="450" y="340" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">解冻 schedule、BN running stats、weight decay 与 warmup 都要纳入实验记录</text>
<text x="450" y="380" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">先用 linear probe 建立基线，再增加可训练自由度</text>
</svg>