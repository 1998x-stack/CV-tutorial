<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">迁移学习的四种训练深度</title><desc id="desc">同一预训练 backbone 可以冻结做线性探测、冻结大部分层只训练 head、逐步解冻，或全量微调；训练参数量和适配能力随策略变化。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="30" y="145" width="150" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="105" y="176" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Pretrained</text><text x="105" y="202" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">source domain</text>
<rect x="250" y="25" width="175" height="75" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="337.5" y="56" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Linear probe</text><text x="337.5" y="82" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">train head only</text>
<rect x="250" y="125" width="175" height="75" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="337.5" y="156" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Partial tune</text><text x="337.5" y="182" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">last stages + head</text>
<rect x="250" y="225" width="175" height="75" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="337.5" y="256" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Gradual unfreeze</text><text x="337.5" y="282" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">stage by stage</text>
<rect x="250" y="325" width="175" height="75" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="337.5" y="356" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Full fine-tune</text><text x="337.5" y="382" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">all parameters</text>
<path d="M180 195 L220 195" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M220 195 V62 H250 M220 195 V162 H250 M220 195 V262 H250 M220 195 V362 H250" stroke="#566a70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="550" y="145" width="300" height="100" rx="12" fill="#fff6ef" stroke="#c46b45" stroke-width="2"/><text x="700" y="176" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Target task</text><text x="700" y="202" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">data size + domain gap + compute</text>
<path d="M425 62 L500 195" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>,<path d="M425 162 L500 195" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>,<path d="M425 262 L500 195" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>,<path d="M425 362 L500 195" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="700" y="285" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">策略由验证集决定，不由模型大小决定</text>
</svg>