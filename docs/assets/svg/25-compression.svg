<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">压缩工具作用于不同层面：结构、数值与监督信号</title><desc id="desc">结构化剪枝移除通道/层并改变图结构；量化降低表示精度；蒸馏用教师软目标训练学生。三者可组合，但必须重新测量质量与速度。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="30" y="115" width="180" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="120" y="146" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Pruning</text><text x="120" y="172" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">remove channels / weights</text>
<rect x="360" y="115" width="180" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="450" y="146" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Quantization</text><text x="450" y="172" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">FP32 → INT8 / FP16</text>
<rect x="690" y="115" width="180" height="100" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="780" y="146" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Distillation</text><text x="780" y="172" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">teacher → student</text>
<path d="M210 165 L330 165" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M540 165 L660 165" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<rect x="250" y="280" width="400" height="80" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="450" y="311" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Export + runtime</text><text x="450" y="337" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">operator fusion / kernels / profiles</text>
<path d="M450 215 L450 280" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="390" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#c46b45">非结构化稀疏 ≠ 自动加速；目标 runtime 必须有对应 kernel 支持</text>
</svg>