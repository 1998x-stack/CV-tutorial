<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="dep-title dep-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="dep-title">部署链路与算子融合</title>
<desc id="dep-desc">PyTorch 模型先导出为 ONNX 中间表示，再交给 TensorRT 或 ONNX Runtime 等推理引擎；引擎会做算子融合，把 Conv、BatchNorm、ReLU 合并成一个算子以减少中间张量的读写。</desc>
<rect width="900" height="340" fill="#fffdf9"/>
<defs><marker id="dep-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7a8a90"/></marker></defs>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">导出与部署：框架 → 中间表示 → 推理引擎</text>

<rect x="60" y="76" width="200" height="76" rx="9" fill="#ffecd9" stroke="#d06d4d" stroke-width="1.6"/>
<text x="160" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4526">PyTorch 模型</text>
<text x="160" y="132" font-size="12.5" text-anchor="middle" fill="#a05a32">训练框架</text>
<rect x="340" y="76" width="200" height="76" rx="9" fill="#d6f1eb" stroke="#147f80" stroke-width="1.6"/>
<text x="440" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#0f5c5d">ONNX</text>
<text x="440" y="132" font-size="12.5" text-anchor="middle" fill="#147f80">通用中间表示</text>
<rect x="620" y="76" width="230" height="76" rx="9" fill="#ece7f8" stroke="#7461ba" stroke-width="1.8"/>
<text x="735" y="106" font-size="13.5" font-weight="700" text-anchor="middle" fill="#4a3d80">推理引擎</text>
<text x="735" y="128" font-size="12.5" text-anchor="middle" fill="#7461ba">TensorRT / ONNX Runtime</text>
<g fill="none" stroke="#7a8a90" stroke-width="1.6" marker-end="url(#dep-arw)">
<path d="M260 114 L336 114"/><path d="M540 114 L616 114"/>
</g>

<text x="60" y="206" font-size="15" font-weight="700" fill="#203035">引擎层的算子融合</text>
<rect x="100" y="228" width="110" height="52" rx="8" fill="#eef3f2" stroke="#c9d8d3" stroke-width="1.4"/>
<text x="155" y="260" font-size="14" text-anchor="middle" fill="#3c4c52">Conv</text>
<rect x="230" y="228" width="110" height="52" rx="8" fill="#eef3f2" stroke="#c9d8d3" stroke-width="1.4"/>
<text x="285" y="260" font-size="14" text-anchor="middle" fill="#3c4c52">BatchNorm</text>
<rect x="360" y="228" width="110" height="52" rx="8" fill="#eef3f2" stroke="#c9d8d3" stroke-width="1.4"/>
<text x="415" y="260" font-size="14" text-anchor="middle" fill="#3c4c52">ReLU</text>
<path d="M480 254 L556 254" fill="none" stroke="#7a8a90" stroke-width="1.6" marker-end="url(#dep-arw)"/>
<rect x="560" y="228" width="290" height="52" rx="8" fill="#d6f1eb" stroke="#147f80" stroke-width="1.6"/>
<text x="705" y="252" font-size="13.5" text-anchor="middle" fill="#0f5c5d">融合算子：Conv+BN+ReLU</text>
<text x="705" y="271" font-size="12" text-anchor="middle" fill="#147f80">减少中间张量的读写</text>

<text x="60" y="322" font-size="13.5" fill="#53676d">导出后需用同一批输入比对数值一致性，并在目标硬件上实测延迟（而非只看 FLOPs）。</text>
</svg>
