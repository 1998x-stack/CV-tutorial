<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">部署优化是多约束问题，不是只追求 FLOPs 最小</title><desc id="desc">模型部署同时受质量、尾延迟、吞吐、内存、能耗、设备支持和维护成本约束；优化前必须先定义服务负载与目标硬件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<rect x="345" y="145" width="210" height="110" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="450" y="176" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Model choice</text><text x="450" y="202" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">accuracy / robustness</text>
<rect x="35" y="45" width="190" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="130" y="76" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Quality</text><text x="130" y="102" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">mAP / mIoU / recall</text>
<rect x="35" y="290" width="190" height="85" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="130" y="321" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Latency</text><text x="130" y="347" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">P50 / P95</text>
<rect x="675" y="45" width="190" height="85" rx="12" fill="#eff7f5" stroke="#087b7c" stroke-width="2"/><text x="770" y="76" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Memory</text><text x="770" y="102" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">weights + activations</text>
<rect x="675" y="290" width="190" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="770" y="321" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Throughput</text><text x="770" y="347" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">images / second</text>
<rect x="345" y="315" width="210" height="70" rx="12" fill="#fff6ef" stroke="#c46b45" stroke-width="2"/><text x="450" y="346" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">Target hardware</text><text x="450" y="372" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">CPU / GPU / NPU</text>
<path d="M225 88 L345 165" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M225 332 L345 225" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M555 165 L675 88" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M555 225 L675 332" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M450 255 L450 315" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="405" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#566a70">最优点通常位于 Pareto 前沿；没有统一最优的压缩率</text>
</svg>