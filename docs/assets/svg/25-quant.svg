<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="q-title q-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="q-title">仿射量化：把连续实数映射到均匀整数格</title>
<desc id="q-desc">连续的实数轴上的取值经过 scale 与 zero-point 映射，被舍入到最近的整数格点。S 表示相邻整数格之间的步长，Z 是零点。舍入造成的误差不超过半个步长。</desc>
<rect width="900" height="360" fill="#fffdf9"/>
<defs><marker id="q-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7a8a90"/></marker></defs>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">仿射量化：实数 → 均匀整数格</text>

<line x1="80" y1="120" x2="820" y2="120" stroke="#147f80" stroke-width="2"/>
<text x="80" y="100" font-size="14" fill="#0f5c5d">连续实数 x</text>
<g fill="#147f80"><circle cx="200" cy="120" r="6"/><circle cx="350" cy="120" r="6"/><circle cx="500" cy="120" r="6"/><circle cx="650" cy="120" r="6"/></g>
<text x="200" y="146" font-size="12.5" text-anchor="middle" fill="#53676d">x₁</text>
<text x="350" y="146" font-size="12.5" text-anchor="middle" fill="#53676d">x₂</text>
<text x="500" y="146" font-size="12.5" text-anchor="middle" fill="#53676d">x₃</text>
<text x="650" y="146" font-size="12.5" text-anchor="middle" fill="#53676d">x₄</text>

<rect x="300" y="176" width="300" height="34" rx="8" fill="#eef3f2" stroke="#c9d8d3"/>
<text x="450" y="199" font-size="15" font-weight="700" text-anchor="middle" fill="#3c4c52">q = round(x / S) + Z</text>

<line x1="80" y1="270" x2="820" y2="270" stroke="#d06d4d" stroke-width="2"/>
<text x="80" y="258" font-size="14" fill="#8a4526">均匀整数格 q</text>
<g fill="#d06d4d"><circle cx="140" cy="270" r="6"/><circle cx="300" cy="270" r="6"/><circle cx="460" cy="270" r="6"/><circle cx="620" cy="270" r="6"/><circle cx="780" cy="270" r="6"/></g>
<text x="140" y="296" font-size="12.5" text-anchor="middle" fill="#53676d">q_min</text>
<text x="460" y="316" font-size="12.5" text-anchor="middle" fill="#8a4526">Z（零点）</text>
<text x="780" y="296" font-size="12.5" text-anchor="middle" fill="#53676d">q_max</text>
<g fill="none" stroke="#7a8a90" stroke-width="1.4" stroke-dasharray="4 4"><path d="M200 128 L300 262"/><path d="M350 128 L300 262"/><path d="M500 128 L460 262"/><path d="M650 128 L620 262"/></g>
<path d="M300 246 L460 246" fill="none" stroke="#7461ba" stroke-width="1.8"/>
<text x="380" y="240" font-size="12.5" text-anchor="middle" fill="#7461ba">S（步长）</text>
<text x="40" y="344" font-size="13.5" fill="#53676d">落在同一格区间内的实数被映射为同一个整数，舍入误差不超过 S/2。</text>
</svg>
