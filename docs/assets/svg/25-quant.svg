<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Affine quantization：用 scale 和 zero-point 映射整数格点</title><desc id="desc">量化将浮点 x 映射到整数 q，再用同一 scale 与 zero-point 反量化；clip 范围、校准数据与 per-tensor/per-channel 粒度决定误差。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="420" rx="18" fill="#fffdfa" stroke="#e0e7e4"/>
<text x="30" y="45" text-anchor="start" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#243338">浮点数轴 → 有限整数格点</text>
<path d="M80 160 H820" stroke="#566a70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M140 145 V175" stroke="#087b7c" stroke-width="3"/><text x="140" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">-2</text><path d="M290 145 V175" stroke="#087b7c" stroke-width="3"/><text x="290" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">-1</text><path d="M440 145 V175" stroke="#087b7c" stroke-width="3"/><text x="440" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">0</text><path d="M590 145 V175" stroke="#087b7c" stroke-width="3"/><text x="590" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">1</text><path d="M740 145 V175" stroke="#087b7c" stroke-width="3"/><text x="740" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243338">2</text>
<text x="140" y="125" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#566a70">−2.0</text><text x="440" y="125" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#566a70">0.0</text><text x="740" y="125" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#566a70">+2.0</text>
<rect x="110" y="265" width="270" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="245" y="296" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">q = round(x / s) + z</text><text x="245" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">clip to [qmin, qmax]</text>
<rect x="520" y="265" width="270" height="85" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="655" y="296" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#243338">x̂ = s × (q − z)</text><text x="655" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#566a70">dequantized approximation</text>
<path d="M380 307 L520 307" stroke="#566a70" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="395" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#566a70">s &gt; 0；z 表示实数 0 在整数域中的位置</text>
</svg>