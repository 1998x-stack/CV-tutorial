<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="clip-title clip-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="clip-title">CLIP 的图文对比目标与零样本分类</title>
<desc id="clip-desc">一个 batch 内 N 张图像与 N 条文本经各自编码器得到嵌入，组成相似度矩阵，对角线上的配对为正样本、其余为负样本。推理时把类别写成文本提示，取与图像特征最相近的一类，即为零样本分类。</desc>
<rect width="900" height="380" fill="#fffdf9"/>
<defs><marker id="clip-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7a8a90"/></marker></defs>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">CLIP：图像-文本对比 + 零样本分类</text>

<text x="40" y="86" font-size="13.5" fill="#0f5c5d">图像编码器 →</text>
<g><rect x="40" y="110" width="90" height="46" rx="7" fill="#d6f1eb" stroke="#147f80" stroke-width="1.4"/><text x="85" y="138" font-size="13" text-anchor="middle" fill="#0f5c5d">图像 1</text>
<rect x="40" y="164" width="90" height="46" rx="7" fill="#d6f1eb" stroke="#147f80" stroke-width="1.4"/><text x="85" y="192" font-size="13" text-anchor="middle" fill="#0f5c5d">图像 2</text>
<rect x="40" y="218" width="90" height="46" rx="7" fill="#d6f1eb" stroke="#147f80" stroke-width="1.4"/><text x="85" y="246" font-size="13" text-anchor="middle" fill="#0f5c5d">图像 3</text></g>

<text x="180" y="86" font-size="13.5" fill="#8a4526">↑ 文本编码器</text>
<g><rect x="180" y="60" width="80" height="42" rx="7" fill="#ffecd9" stroke="#d06d4d" stroke-width="1.4"/><text x="220" y="87" font-size="12.5" text-anchor="middle" fill="#8a4526">文本 1</text>
<rect x="270" y="60" width="80" height="42" rx="7" fill="#ffecd9" stroke="#d06d4d" stroke-width="1.4"/><text x="310" y="87" font-size="12.5" text-anchor="middle" fill="#8a4526">文本 2</text>
<rect x="360" y="60" width="80" height="42" rx="7" fill="#ffecd9" stroke="#d06d4d" stroke-width="1.4"/><text x="400" y="87" font-size="12.5" text-anchor="middle" fill="#8a4526">文本 3</text></g>

<g stroke="#c9d8d3" stroke-width="1">
<rect x="180" y="110" width="80" height="46" fill="#d6f1eb" stroke="#147f80" stroke-width="2"/>
<rect x="270" y="110" width="80" height="46" fill="#f3f6f5"/>
<rect x="360" y="110" width="80" height="46" fill="#f3f6f5"/>
<rect x="180" y="164" width="80" height="46" fill="#f3f6f5"/>
<rect x="270" y="164" width="80" height="46" fill="#d6f1eb" stroke="#147f80" stroke-width="2"/>
<rect x="360" y="164" width="80" height="46" fill="#f3f6f5"/>
<rect x="180" y="218" width="80" height="46" fill="#f3f6f5"/>
<rect x="270" y="218" width="80" height="46" fill="#f3f6f5"/>
<rect x="360" y="218" width="80" height="46" fill="#d6f1eb" stroke="#147f80" stroke-width="2"/>
</g>
<text x="310" y="290" font-size="13" text-anchor="middle" fill="#53676d">相似度矩阵：对角=配对正样本（青），其余=负样本</text>

<path d="M470 190 L520 190" fill="none" stroke="#7a8a90" stroke-width="1.6" marker-end="url(#clip-arw)"/>
<rect x="530" y="120" width="330" height="140" rx="10" fill="#f7faf9" stroke="#c9d8d3" stroke-width="1.5"/>
<text x="695" y="152" font-size="14" font-weight="700" text-anchor="middle" fill="#203035">零样本分类</text>
<text x="695" y="180" font-size="13" text-anchor="middle" fill="#3c4c52">图像特征 vs 类别文本提示</text>
<text x="695" y="206" font-size="13" text-anchor="middle" fill="#0f5c5d">“a photo of a cat” / “… a dog” …</text>
<text x="695" y="234" font-size="13" text-anchor="middle" fill="#8a4526">argmax 相似度 → 预测类别</text>
<text x="40" y="348" font-size="13.5" fill="#53676d">训练不需要人工类别标签，只需要互联网图文对；但对细粒度差异与组合语义不敏感，且对提示词敏感。</text>
</svg>
