<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">MAE：仅可见 patches 进入 encoder，decoder 负责重建掩码区域</title><desc id="desc">图像被划分成 patches，典型掩码比例 75%；encoder 只处理未掩码 tokens，轻量 decoder 再与 mask tokens 合并还原缺失像素。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><text x="32" y="45" fill="#243338" text-anchor="start" font-size="21" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">MAE 的非对称性降低编码计算量</text>
