<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="mae-title mae-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="mae-title">MAE 的非对称编解码与高掩码率</title>
<desc id="mae-desc">图像被切成 patch 后遮盖约 75%，编码器只处理可见的 25% patch（青色），解码器用掩码 token 补全后重建全部 patch，损失只在被遮盖的位置计算。</desc>
<rect width="900" height="360" fill="#fffdf9"/>
<defs><marker id="mae-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7a8a90"/></marker></defs>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">MAE：遮盖 75%，只编码可见 patch</text>

<rect x="60" y="96" width="156" height="156" fill="#eef3f2" stroke="#c9d8d3" stroke-width="1.4"/>
<g fill="#d6f1eb" stroke="#147f80" stroke-width="1.2">
<rect x="61" y="97" width="24" height="24"/><rect x="87" y="123" width="24" height="24"/><rect x="113" y="149" width="24" height="24"/>
<rect x="139" y="175" width="24" height="24"/><rect x="165" y="201" width="24" height="24"/><rect x="191" y="227" width="24" height="24"/>
<rect x="139" y="97" width="24" height="24"/><rect x="191" y="149" width="24" height="24"/><rect x="87" y="227" width="24" height="24"/>
</g>
<text x="138" y="278" font-size="13" text-anchor="middle" fill="#53676d">输入：6×6 patch，青=可见</text>

<rect x="300" y="130" width="150" height="90" rx="10" fill="#ffecd9" stroke="#d06d4d" stroke-width="1.6"/>
<text x="375" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4526">编码器</text>
<text x="375" y="188" font-size="12.5" text-anchor="middle" fill="#a05a32">只处理可见 25%</text>

<rect x="520" y="130" width="150" height="90" rx="10" fill="#ece7f8" stroke="#7461ba" stroke-width="1.8"/>
<text x="595" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#4a3d80">解码器</text>
<text x="595" y="188" font-size="12.5" text-anchor="middle" fill="#7461ba">补掩码 token，重建全部</text>

<rect x="720" y="96" width="156" height="156" fill="#d6f1eb" stroke="#147f80" stroke-width="1.6"/>
<g stroke="#147f80" stroke-width="1"><path d="M746 96v156M772 96v156M798 96v156M824 96v156M850 96v156M720 122h156M720 148h156M720 174h156M720 200h156M720 226h156"/></g>
<text x="798" y="278" font-size="13" text-anchor="middle" fill="#53676d">重建全部 patch</text>

<g fill="none" stroke="#7a8a90" stroke-width="1.6" marker-end="url(#mae-arw)">
<path d="M216 174 L296 174"/><path d="M450 174 L516 174"/><path d="M670 174 L716 174"/></g>
<text x="160" y="330" font-size="13.5" fill="#53676d">损失只在被遮盖的 patch 上计算（预测被遮像素）。训练后通常丢弃解码器，只保留编码器用于下游任务。</text>
</svg>
