<text x="450" y="408" fill="#566a70" text-anchor="middle" font-size="15" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">损失仅在被遮挡的 patch pixels 上计算；位置顺序在 decoder 恢复</text></svg>