<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">MoCo 使用动量 key encoder 与负样本 queue</title><desc id="desc">Query encoder 用梯度训练，key encoder 用指数滑动平均更新，key embeddings 进入 FIFO queue 构造大字典。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="35" y="115" width="175" height="96" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="122.5" y="146" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Query encoder</text><text x="122.5" y="171" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">θq · gradients</text>
