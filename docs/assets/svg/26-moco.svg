<rect x="303" y="277" width="180" height="96" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="393" y="308" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Positive key k+</text><text x="393" y="333" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">normalized vector</text>
