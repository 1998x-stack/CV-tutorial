<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">自监督预训练任务：视图一致性、教师分布与像素重构</title><desc id="desc">同一无标签图像可以构建对比学习、教师学生分布匹配和随机掩码重构三种不同的自监督信号。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><text x="28" y="46" fill="#243338" text-anchor="start" font-size="22" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">没有人工类别标注，训练信号从哪里来？</text>
<rect x="28" y="135" width="180" height="90" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="118" y="166" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Raw image x</text><text x="118" y="191" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">No human labels</text>
<rect x="282" y="65" width="195" height="82" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="379.5" y="96" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Contrastive</text><text x="379.5" y="121" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">two views → embeddings</text>
<rect x="282" y="184" width="195" height="82" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="379.5" y="215" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Self-distill</text><text x="379.5" y="240" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">student matches teacher</text>
<rect x="282" y="303" width="195" height="82" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="379.5" y="334" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Masked AE</text><text x="379.5" y="359" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">visible → missing patches</text>
<path d="M208 180 L240 180" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M240 180 V106 H282 M240 180 H282 V225 M240 180 V344 H282" stroke="#566a70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="570" y="65" width="285" height="82" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="712.5" y="96" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SimCLR / MoCo</text><text x="712.5" y="121" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">NT-Xent / InfoNCE</text>
<rect x="570" y="184" width="285" height="82" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="712.5" y="215" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">DINO / DINOv2</text><text x="712.5" y="240" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">teacher target / EMA</text>
<rect x="570" y="303" width="285" height="82" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="712.5" y="334" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">MAE</text><text x="712.5" y="359" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">masked-patch reconstruction</text>
<path d="M477 106 L570 106" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M477 225 L570 225" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M477 344 L570 344" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="417" fill="#566a70" text-anchor="middle" font-size="15" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">自监督不意味着“没有目标”；目标由数据内部结构构造</text></svg>