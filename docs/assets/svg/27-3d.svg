<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">NeRF 与 3D Gaussian Splatting 的表示、渲染与代价区别</title><desc id="desc">NeRF 通过连续函数沿射线积分颜色与密度；3D Gaussian Splatting 优化显式高斯 primitives，使用可见性感知的 splat rasterization。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="35" y="92" width="355" height="94" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="212.5" y="123" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">NeRF</text><text x="212.5" y="148" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">MLP: (x,d) → σ, RGB</text>
<rect x="510" y="92" width="355" height="94" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="687.5" y="123" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">3D Gaussian Splatting</text><text x="687.5" y="148" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">Gaussian: μ, Σ, opacity, color</text>
<rect x="35" y="258" width="355" height="94" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="212.5" y="289" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Ray marching</text><text x="212.5" y="314" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">many samples / volume integral</text>
<rect x="510" y="258" width="355" height="94" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="687.5" y="289" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Rasterization</text><text x="687.5" y="314" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">project, sort, alpha compose</text>
<path d="M212 186 L212 258" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M686 186 L686 258" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<text x="448" y="220" fill="#7560b5" text-anchor="middle" font-size="24" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">vs</text>
<text x="450" y="402" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">两者都需要已校准视角/相机位姿；单张 RGB 图像并不唯一决定真实 3D 场景</text></svg>