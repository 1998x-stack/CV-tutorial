<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">CLIP：图像文本编码到共享嵌入空间的双向配对损失</title><desc id="desc">CLIP 对一个 batch 的图像和文本分别编码、L2 归一化，以相似度矩阵的对角线为正确配对，优化 image-to-text 与 text-to-image 对称交叉熵。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="25" y="105" width="176" height="93" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="113" y="136" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Images</text><text x="113" y="161" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">N images</text>
<rect x="25" y="255" width="176" height="93" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="113" y="286" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Texts</text><text x="113" y="311" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">N captions</text>
<rect x="270" y="105" width="188" height="93" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="364" y="136" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Image encoder</text><text x="364" y="161" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">normalized zi</text>
<rect x="270" y="255" width="188" height="93" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="364" y="286" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Text encoder</text><text x="364" y="311" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">normalized tj</text>
