<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">DDPM 前向噪声过程与反向去噪过程</title><desc id="desc">前向过程逐步向 x0 注入 Gaussian noise，训练时可直接按 alpha bar 采样任意 t；反向模型通过预测噪声或等价参数化逐步构造样本。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><text x="32" y="45" fill="#243338" text-anchor="start" font-size="21" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Forward q : x₀ → xₜ；Reverse pθ : xₜ → x₀</text>
<rect x="32" y="127" width="180" height="103" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="122" y="158" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Clean image x₀</text><text x="122" y="183" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">structured pixels</text>
<rect x="362" y="127" width="180" height="103" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="452" y="158" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Noisy xₜ</text><text x="452" y="183" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">sqrt(αbar) x0 + noise</text>
<rect x="692" y="127" width="180" height="103" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="782" y="158" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Prior xT</text><text x="782" y="183" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">approximately N(0,I)</text>
<path d="M212 180 L362 180" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M542 180 L692 180" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<path d="M692 267 L542 267" stroke="#7560b5" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M362 267 L212 267" stroke="#7560b5" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="316" fill="#7560b5" text-anchor="middle" font-size="17" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">noise predictor εθ(xₜ,t) learns denoising</text>
<text x="450" y="372" fill="#566a70" text-anchor="middle" font-size="15" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">训练：采 t、采 ε、构造 xₜ，最小化 ‖ε−εθ(xₜ,t)‖²</text>
<text x="450" y="403" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">注意：前向采样不是把同一个 ε 每步简单相加</text></svg>