<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">潜空间扩散：VAE 编码图像，在低维 latent 上加噪与去噪</title><desc id="desc">Latent diffusion 把图像 x 经预训练 autoencoder 变成 z；denoiser 在 z 空间工作，文本条件通过 cross-attention 注入，解码器再把 denoised z 还原为图像。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="25" y="142" width="151" height="96" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="100.5" y="173" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Image x</text><text x="100.5" y="198" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">H×W×3</text>
<rect x="222" y="142" width="157" height="96" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="300.5" y="173" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Encoder E</text><text x="300.5" y="198" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">z=E(x)</text>
<rect x="425" y="142" width="175" height="96" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="512.5" y="173" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Denoising U-Net</text><text x="512.5" y="198" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">zₜ, t, text</text>
<rect x="646" y="142" width="117" height="96" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="704.5" y="173" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Decoder D</text><text x="704.5" y="198" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">x≈D(z)</text>
<path d="M176 190 L222 190" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M379 190 L425 190" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M600 190 L646 190" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<rect x="430" y="28" width="185" height="81" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="522.5" y="59" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Text encoder</text><text x="522.5" y="84" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">conditioning tokens</text>
<path d="M523 109 L523 142" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<text x="790" y="187" fill="#243338" text-anchor="middle" font-size="17" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">Output</text>
<text x="450" y="332" fill="#566a70" text-anchor="middle" font-size="15" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">模型在较低空间分辨率的 latent 上学习，而不是对原始每像素直接扩散</text>
<text x="450" y="371" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">有损 VAE/autoencoder 限制细节；cross-attention 条件并非原 DDPM 的必要组件</text></svg>