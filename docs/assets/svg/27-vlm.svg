<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">视觉语言模型与 CLIP 的输出接口差异</title><desc id="desc">CLIP 输出共享向量相似度，BLIP 可执行图文理解与生成，LLaVA 用视觉编码器与投影层将图像特征连接到语言模型以进行指令回答。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="25" y="88" width="175" height="93" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="112.5" y="119" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Image</text><text x="112.5" y="144" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">pixels</text>
<rect x="260" y="88" width="205" height="93" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="362.5" y="119" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Vision encoder</text><text x="362.5" y="144" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">patch/pooled features</text>
<rect x="530" y="38" width="310" height="85" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="685" y="69" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">CLIP head</text><text x="685" y="94" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">similarities / retrieval</text>
<rect x="530" y="163" width="310" height="85" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="685" y="194" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">BLIP multimodal</text><text x="685" y="219" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">contrastive + matching + caption</text>
<rect x="530" y="288" width="310" height="85" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="685" y="319" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">LLaVA projector → LLM</text><text x="685" y="344" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">instruction tokens → text</text>
<path d="M200 135 L260 135" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M465 135 H490 V80 H530 M490 135 V205 H530 M490 135 V330 H530" stroke="#566a70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="408" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">相似度与自回归语言生成是两种不同的输出，评估协议不可混用</text></svg>