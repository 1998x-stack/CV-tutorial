<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="vlm-title vlm-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="vlm-title">视觉语言模型的连接器结构</title>
<desc id="vlm-desc">图像经 CLIP ViT 视觉编码器得到视觉特征，经投影层映射到 LLM 的嵌入空间，与文本 token 拼接后输入大语言模型，输出文本回答。</desc>
<rect width="900" height="360" fill="#fffdf9"/>
<defs><marker id="vlm-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7a8a90"/></marker></defs>
<style>.o{fill:#ffecd9;stroke:#d06d4d;stroke-width:1.6}.t{fill:#d6f1eb;stroke:#147f80;stroke-width:1.6}</style>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">VLM：把图像接进大语言模型</text>

<rect class="t" x="40" y="120" width="110" height="80" rx="9"/>
<text x="95" y="156" font-size="13.5" text-anchor="middle" fill="#0f5c5d">图像</text>
<text x="95" y="176" font-size="12" text-anchor="middle" fill="#147f80">H×W×3</text>
<rect class="o" x="190" y="120" width="150" height="80" rx="9"/>
<text x="265" y="152" font-size="13.5" font-weight="700" text-anchor="middle" fill="#8a4526">视觉编码器</text>
<text x="265" y="174" font-size="12" text-anchor="middle" fill="#a05a32">CLIP ViT</text>
<rect class="o" x="380" y="120" width="150" height="80" rx="9"/>
<text x="455" y="152" font-size="13.5" font-weight="700" text-anchor="middle" fill="#8a4526">投影层</text>
<text x="455" y="174" font-size="12" text-anchor="middle" fill="#a05a32">对齐到 LLM 嵌入空间</text>

<rect class="t" x="40" y="256" width="150" height="64" rx="9"/>
<text x="115" y="284" font-size="13.5" text-anchor="middle" fill="#0f5c5d">文本 token</text>
<text x="115" y="304" font-size="12" text-anchor="middle" fill="#147f80">问题 / 指令</text>

<circle cx="590" cy="192" r="26" fill="#f7faf9" stroke="#7461ba" stroke-width="1.8"/>
<text x="590" y="200" font-size="18" text-anchor="middle" fill="#4a3d80">⊕</text>
<rect class="o" x="650" y="140" width="200" height="104" rx="10"/>
<text x="750" y="182" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4526">大语言模型</text>
<text x="750" y="206" font-size="12.5" text-anchor="middle" fill="#a05a32">自回归生成文本回答</text>

<g fill="none" stroke="#7a8a90" stroke-width="1.6" marker-end="url(#vlm-arw)">
<path d="M150 160 L186 160"/><path d="M340 160 L376 160"/><path d="M530 160 C 560 160, 560 182, 564 188"/>
<path d="M190 288 C 400 288, 520 240, 570 214"/><path d="M616 192 L646 192"/></g>
<text x="40" y="348" font-size="13.5" fill="#53676d">连接器可以只是一个线性层；关键是对齐视觉与文本两个嵌入空间，而不是把模型堆得更大。</text>
</svg>
