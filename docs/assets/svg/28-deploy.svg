<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="dp-title dp-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="dp-title">部署链路：导出、引擎优化、容器服务与验收</title>
<desc id="dp-desc">训练好的模型导出为 ONNX，经 TensorRT 量化与算子融合后在边缘设备上以容器方式运行，提供带超时与批处理的推理服务，并以 P99 延迟与数值一致性作为验收指标。</desc>
<rect width="900" height="340" fill="#fffdf9"/>
<defs><marker id="dp-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7a8a90"/></marker></defs>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">部署：导出 → 优化 → 容器服务 → 验收</text>

<rect x="40" y="130" width="150" height="72" rx="9" fill="#ffecd9" stroke="#d06d4d" stroke-width="1.6"/>
<text x="115" y="162" font-size="13" text-anchor="middle" fill="#8a4526">训练好的模型</text>
<text x="115" y="182" font-size="12" text-anchor="middle" fill="#a05a32">PyTorch</text>

<rect x="228" y="130" width="150" height="72" rx="9" fill="#d6f1eb" stroke="#147f80" stroke-width="1.6"/>
<text x="303" y="162" font-size="13" text-anchor="middle" fill="#0f5c5d">ONNX 导出</text>
<text x="303" y="182" font-size="12" text-anchor="middle" fill="#147f80">数值一致性校验</text>

<rect x="416" y="130" width="150" height="72" rx="9" fill="#ece7f8" stroke="#7461ba" stroke-width="1.8"/>
<text x="491" y="162" font-size="13" text-anchor="middle" fill="#4a3d80">TensorRT</text>
<text x="491" y="182" font-size="12" text-anchor="middle" fill="#7461ba">量化 + 算子融合</text>

<rect x="604" y="130" width="150" height="72" rx="9" fill="#d6f1eb" stroke="#147f80" stroke-width="1.6"/>
<text x="679" y="158" font-size="13" text-anchor="middle" fill="#0f5c5d">容器化服务</text>
<text x="679" y="178" font-size="12" text-anchor="middle" fill="#147f80">超时 / 批处理</text>

<rect x="792" y="130" width="80" height="72" rx="9" fill="#f7faf9" stroke="#c9d8d3" stroke-width="1.5"/>
<text x="832" y="160" font-size="12.5" text-anchor="middle" fill="#3c4c52">验收</text>
<text x="832" y="180" font-size="11.5" text-anchor="middle" fill="#53676d">P99</text>

<g fill="none" stroke="#7a8a90" stroke-width="1.6" marker-end="url(#dp-arw)">
<path d="M190 166 L224 166"/><path d="M378 166 L412 166"/><path d="M566 166 L600 166"/><path d="M754 166 L788 166"/></g>
<text x="40" y="100" font-size="13.5" fill="#53676d">同批输入比对输出、同硬件实测延迟——两者缺一不可</text>
<text x="40" y="290" font-size="13.5" fill="#53676d">容器化打包环境，避免 PyTorch/CUDA/OpenCV 版本差异导致的输出漂移；边缘设备上 TensorRT 常为标准选择。</text>
</svg>
