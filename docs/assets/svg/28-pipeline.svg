<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="pl-title pl-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="pl-title">仓储分拣系统的端到端流水线</title>
<desc id="pl-desc">采集与预处理后做包裹检测，按框路由到分类、OCR 与破损检测三个并行分支，再汇入决策与后处理输出，整条链路共享一个延迟预算。</desc>
<rect width="900" height="340" fill="#fffdf9"/>
<defs><marker id="pl-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7a8a90"/></marker></defs>
<style>.o{fill:#ffecd9;stroke:#d06d4d;stroke-width:1.6}.t{fill:#d6f1eb;stroke:#147f80;stroke-width:1.6}</style>
<text x="40" y="44" font-size="21" font-weight="700" fill="#203035">端到端流水线：一条延迟预算串起所有子任务</text>

<rect class="t" x="40" y="140" width="110" height="62" rx="9"/><text x="95" y="170" font-size="13" text-anchor="middle" fill="#0f5c5d">采集 /</text><text x="95" y="188" font-size="13" text-anchor="middle" fill="#0f5c5d">预处理</text>
<rect class="o" x="190" y="140" width="110" height="62" rx="9"/><text x="245" y="170" font-size="13" text-anchor="middle" fill="#8a4526">检测</text><text x="245" y="188" font-size="12" text-anchor="middle" fill="#a05a32">定位包裹</text>
<rect class="t" x="340" y="62" width="150" height="50" rx="8"/><text x="415" y="92" font-size="13" text-anchor="middle" fill="#0f5c5d">类型分类</text>
<rect class="t" x="340" y="146" width="150" height="50" rx="8"/><text x="415" y="176" font-size="13" text-anchor="middle" fill="#0f5c5d">运单 OCR</text>
<rect class="t" x="340" y="230" width="150" height="50" rx="8"/><text x="415" y="260" font-size="13" text-anchor="middle" fill="#0f5c5d">破损检测</text>
<rect class="o" x="540" y="140" width="150" height="62" rx="9"/><text x="615" y="170" font-size="13" text-anchor="middle" fill="#8a4526">决策 / 后处理</text><text x="615" y="188" font-size="12" text-anchor="middle" fill="#a05a32">NMS / 阈值 / 路由</text>
<rect class="t" x="720" y="140" width="140" height="62" rx="9"/><text x="790" y="176" font-size="13" text-anchor="middle" fill="#0f5c5d">输出结果</text>

<g fill="none" stroke="#7a8a90" stroke-width="1.6" marker-end="url(#pl-arw)">
<path d="M150 171 L186 171"/><path d="M300 171 L336 171"/>
<path d="M490 87 C 520 87, 520 160, 536 165"/><path d="M490 171 L536 171"/><path d="M490 255 C 520 255, 520 182, 536 177"/>
<path d="M690 171 L716 171"/></g>
<text x="40" y="316" font-size="13.5" fill="#53676d">检测决定主延迟，分类/OCR/破损是并行支路；总延迟 = 预处理 + 检测 + 支路 + 后处理，必须小于单件处理窗口。</text>
</svg>
