<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">可复现训练：输入契约、优化循环、验证与持久化四层</title><desc id="desc">同一个 preprocessing spec 用于训练/线上，optimizer 和 RNG 状态与 model 一起保存；验证在 model.eval/no_grad 下完成。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="25" y="135" width="155" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="102.5" y="166" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Data loader</text><text x="102.5" y="191" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">fixed RGB / normalize</text>
<rect x="226" y="135" width="155" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="303.5" y="166" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Train step</text><text x="303.5" y="191" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">zero-grad → loss → step</text>
<rect x="427" y="135" width="155" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="504.5" y="166" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Validation</text><text x="504.5" y="191" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">eval / no-grad</text>
<rect x="629" y="135" width="235" height="100" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="746.5" y="166" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Checkpoint</text><text x="746.5" y="191" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">weights + schema + RNG</text>
<path d="M180 185 L226 185" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M381 185 L427 185" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M582 185 L629 185" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="297" fill="#566a70" text-anchor="middle" font-size="17" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">same transform | same label IDs | same model version</text>
<text x="450" y="344" fill="#566a70" text-anchor="middle" font-size="15" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">每次实验记录：seed / split manifest / torch version / config / metrics</text>
<text x="450" y="386" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">推荐按业务分组统计；平均准确率可能掩盖少数类别失效</text></svg>