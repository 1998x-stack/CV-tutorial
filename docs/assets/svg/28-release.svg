<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">发布链：模型权重、预处理、版本、监控和可回滚工件</title><desc id="desc">模型部署不是只传 weights 文件；需要打包类别映射、预处理规范、依赖版本、测试结果及回滚方式，并对输入漂移与推理延迟监控。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="25" y="125" width="170" height="95" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="110" y="156" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Versioned artifact</text><text x="110" y="181" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">weights + label_map</text>
<rect x="245" y="125" width="170" height="95" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="330" y="156" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Preprocess</text><text x="330" y="181" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">RGB, resize, normalize</text>
<rect x="465" y="125" width="170" height="95" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="550" y="156" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Inference</text><text x="550" y="181" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">batch + threshold</text>
<rect x="685" y="125" width="170" height="95" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="770" y="156" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Monitor</text><text x="770" y="181" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">latency + drift</text>
<path d="M195 174 L245 174" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M415 174 L465 174" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M635 174 L685 174" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<rect x="258" y="295" width="382" height="85" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="449" y="326" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Release gate</text><text x="449" y="351" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">reproducible test + rollback plan</text>
<path d="M770 220 V264 H449 V295" stroke="#566a70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="409" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">模型可运行 ≠ 模型可安全发布；测试集性能、业务阈值与数据漂移需共同验收</text></svg>