<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">分组数据切分避免同一设备/场景的近重复样本跨集合</title><desc id="desc">同一 group 下的图像或视频帧不可分到训练与测试，先做分组切分再做增强；保留 train/val/test 独立性。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="30" y="85" width="205" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="132.5" y="116" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Raw groups</text><text x="132.5" y="141" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">A A A / B B / C C</text>
<rect x="325" y="40" width="230" height="84" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="440" y="71" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Train</text><text x="440" y="96" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">groups A,B</text>
<rect x="325" y="168" width="230" height="84" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="440" y="199" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Validation</text><text x="440" y="224" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">group C</text>
<rect x="325" y="296" width="230" height="84" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="440" y="327" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Test</text><text x="440" y="352" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">group D</text>
<path d="M235 135 L290 135" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/><path d="M290 135 V82 H325 M290 135 V210 H325 M290 135 V338 H325" stroke="#566a70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="645" y="168" width="225" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="757.5" y="199" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Audit</text><text x="757.5" y="224" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">no group overlap</text>
<path d="M555 210 L645 210" stroke="#566a70" stroke-width="2.6" stroke-dasharray="" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="416" fill="#566a70" text-anchor="middle" font-size="15" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">Test 只在最后验收一次；模型选择使用 Validation，不能反复看 Test 调参数</text></svg>