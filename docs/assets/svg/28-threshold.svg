<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">拒识机制让分类器可明确表达低置信度</title><desc id="desc">从 softmax 最大值与阈值 τ 决定自动接受或人工复核；覆盖率与被接受样本准确率随阈值变化，但 softmax 不是已经校准的正确概率。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#566a70" stroke-width="1.2"/></marker></defs><rect width="900" height="440" rx="20" fill="#fffdfa" stroke="#e0e7e4"/><rect x="26" y="126" width="184" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="118" y="157" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Class logits</text><text x="118" y="182" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">z ∈ R^K</text>
<rect x="270" y="126" width="200" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="370" y="157" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Softmax</text><text x="370" y="182" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">max prob = c</text>
<rect x="540" y="126" width="160" height="100" rx="12" fill="#e9e5f4" stroke="#7560b5" stroke-width="2"/><text x="620" y="157" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Threshold τ</text><text x="620" y="182" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">accept if c≥τ</text>
<rect x="750" y="45" width="125" height="100" rx="12" fill="#e4f2eb" stroke="#087b7c" stroke-width="2"/><text x="812.5" y="76" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Auto path</text><text x="812.5" y="101" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">accepted</text>
<rect x="750" y="260" width="125" height="100" rx="12" fill="#f8e7db" stroke="#c46b45" stroke-width="2"/><text x="812.5" y="291" fill="#243338" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Review path</text><text x="812.5" y="316" fill="#566a70" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">abstain</text>
