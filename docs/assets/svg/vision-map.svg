<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="title desc"><title id="title">从像素到视觉理解的四层递进</title><desc id="desc">输入图像经过像素表示、几何与纹理特征、表征模型，最终产生分类、定位与像素级分割结果。</desc><rect x="12" y="18" width="756" height="470" rx="23" fill="#fffdfa"/><g font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="21" fill="#243338"><text x="35" y="58">一张图像，四个抽象层次</text></g><g stroke="#dce8e2" stroke-width="1.5"><path d="M42 111 H740 M42 205 H740 M42 300 H740 M42 395 H740"/></g><g font-family="system-ui,Arial,sans-serif" font-size="18" fill="#243338"><text x="48" y="91">01</text><text x="95" y="91">像素</text><text x="48" y="188">02</text><text x="95" y="188">局部结构</text><text x="48" y="283">03</text><text x="95" y="283">视觉表征</text><text x="48" y="378">04</text><text x="95" y="378">任务输出</text></g><g><rect x="300" y="71" width="62" height="62" rx="6" fill="#edb38b"/><rect x="364" y="71" width="62" height="62" rx="6" fill="#b7d9d0"/><rect x="428" y="71" width="62" height="62" rx="6" fill="#8db6aa"/><rect x="492" y="71" width="62" height="62" rx="6" fill="#c7aad4"/><rect x="556" y="71" width="62" height="62" rx="6" fill="#f4d692"/></g><g stroke="#087b7c" fill="none" stroke-width="3"><path d="M308 179 q24 -32 48 0 t48 0 t48 0 t48 0 t48 0"/><path d="M311 269 H610"/><path d="M333 251 V286 M380 244 V294 M427 239 V299 M474 249 V289 M521 236 V302 M568 245 V293"/></g><g fill="#edf5f1" stroke="#087b7c" stroke-width="2"><rect x="292" y="335" width="111" height="51" rx="8"/><rect x="414" y="335" width="111" height="51" rx="8"/><rect x="536" y="335" width="115" height="51" rx="8"/></g><g font-family="system-ui,Arial,sans-serif" font-size="17" fill="#243338" text-anchor="middle"><text x="347" y="367">分类</text><text x="470" y="367">检测</text><text x="593" y="367">分割</text></g><g fill="#c46b45"><circle cx="693" cy="103" r="8"/><circle cx="693" cy="198" r="8"/><circle cx="693" cy="293" r="8"/><circle cx="693" cy="388" r="8"/></g><g font-family="system-ui,Arial,sans-serif" font-size="15" fill="#53676d"><text x="47" y="448">每一层保留有用信息，也引入新的假设与代价。</text></g></svg>